<style>
  :root{
    --bg:#F0F3FD;
    --surface:#FFFFFF;
    --ink:#2A2E3D;
    --navy:#4169E1;
    --navy-2:#8AA3EC;
    --navy-text:#2A4492;
    --navy-ink:#FFFFFF;
    --navy-rgb:65,105,225;
    --gold:#C9E4DE;
    --gold-ink:#3F5C4E;
    --line:#D9E1F9;
    --muted:#6B7290;
    --danger:#C24F6A;
    --radius:10px;
    --font-scale:1;
    --schedule-font:'Poppins', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  /* ---- header ---- */
  .app-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px;flex-wrap:wrap;}
  .wordmark{font-family:'Poppins',sans-serif;font-weight:700;font-size:calc(34px * var(--font-scale));color:var(--navy-text);letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
  .wordmark-icon{height:calc(40px * var(--font-scale));width:auto;flex-shrink:0;}
  .tagline{font-size:calc(13px * var(--font-scale));color:var(--muted);margin-top:2px;font-family:'Poppins',sans-serif;letter-spacing:0.2px;}
  .whoami{font-size:calc(13px * var(--font-scale));color:var(--muted);text-align:right;}
  .whoami b{color:var(--navy-text);font-family:'Poppins',sans-serif;}
  .edit-name-btn{
    background:transparent;border:none;color:var(--muted);cursor:pointer;
    font-size:calc(12px * var(--font-scale));padding:0 2px;border-radius:4px;vertical-align:middle;
  }
  .edit-name-btn:hover{color:var(--navy-text);opacity:1;}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:6px;border-bottom:2px solid var(--navy-text);margin-bottom:20px;}
  .tab-btn{
    font-family:'Poppins',sans-serif;font-weight:600;font-size:calc(14px * var(--font-scale));
    background:var(--line);color:var(--muted);border:none;
    padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer;
    transform:translateY(2px);transition:transform .15s, background .15s, color .15s;
  }
  .tab-btn:hover{color:var(--navy-text);}
  .tab-btn.active{background:var(--navy);color:var(--navy-ink);transform:translateY(0);}

  /* ---- panels / cards ---- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .panel h3{font-family:'Poppins',sans-serif;font-size:calc(15px * var(--font-scale));margin:0 0 12px;color:var(--navy-text);}
  .hint{font-size:calc(12.5px * var(--font-scale));color:var(--muted);margin-top:6px;line-height:1.5;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  textarea{
    width:100%;min-height:90px;font-family:'Poppins',sans-serif;font-size:calc(12.5px * var(--font-scale));
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;background:var(--surface);color:var(--ink);
  }
  input[type=text], input[type=time], input[type=password], input[type=email], input[type=number], select{
    font-family:'Poppins',sans-serif;font-size:calc(13.5px * var(--font-scale));border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);
  }
  button{
    font-family:'Poppins',sans-serif;font-weight:600;font-size:calc(13px * var(--font-scale));
    border:none;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--navy);color:var(--navy-ink);
    transition:opacity .15s;
  }
  button:hover{opacity:.88;}
  button.ghost{background:transparent;color:var(--navy-text);border:1px solid var(--navy-text);}
  button.gold{background:var(--gold);color:var(--gold-ink);}
  button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:4px 8px;font-size:calc(12px * var(--font-scale));}
  button.small{padding:6px 10px;font-size:calc(12px * var(--font-scale));}

  /* ---- search + dropdown hybrid ---- */
  .combo{position:relative;flex:1;min-width:240px;}
  .combo input{width:100%;padding:10px 12px;}
  .combo-list{
    position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);
    border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);z-index:20;display:none;
  }
  .combo-list.open{display:block;}
  .combo-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid #F0F1EF;font-size:calc(13px * var(--font-scale));}
  .combo-item:last-child{border-bottom:none;}
  .combo-item:hover{background:var(--line);}
  .combo-item .code{font-family:'Poppins',sans-serif;font-weight:600;color:var(--navy-text);margin-right:8px;}
  .combo-item .meta{color:var(--muted);font-size:calc(11.5px * var(--font-scale));}
  .combo-empty{padding:12px;color:var(--muted);font-size:calc(12.5px * var(--font-scale));}
  .clash-tag{
    flex:none;font-family:'Poppins',sans-serif;font-weight:600;font-size:calc(10.5px * var(--font-scale));
    color:var(--danger);border:1px solid var(--danger);border-radius:20px;padding:2px 8px;
    white-space:nowrap;
  }

  /* ---- task tracker ---- */
  table.tasks{width:100%;min-width:840px;border-collapse:collapse;font-size:calc(12.5px * var(--font-scale));}
  table.tasks th{text-align:left;color:var(--muted);font-weight:600;font-size:calc(10.5px * var(--font-scale));text-transform:uppercase;letter-spacing:0.4px;padding:8px 8px;border-bottom:2px solid var(--navy-text);white-space:nowrap;}
  table.tasks td{padding:5px 6px;border-bottom:1px solid #F0F1EF;vertical-align:middle;}
  table.tasks input[type=text], table.tasks input[type=date]{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;font-size:calc(12.5px * var(--font-scale));font-family:'Poppins',sans-serif;border-radius:6px;color:var(--ink);}
  table.tasks input[type=text]:focus, table.tasks input[type=date]:focus{border-color:var(--line);background:var(--surface);}
  /* Due-date cell: a typable text field + calendar button, see
     createDueDateCell(). The real <input type="date"> that powers the
     calendar button stays present (for showPicker()/keyboard access) but
     visually hidden — clipped to 0 size rather than display:none, since
     some browsers refuse to open a picker on a display:none element. */
  .due-date-field{display:flex;align-items:center;gap:2px;position:relative;width:100%;min-width:118px;}
  .due-date-field .due-date-text{flex:1;min-width:88px;width:100%;border:1px solid transparent;background:transparent;padding:5px 4px;font-size:calc(12.5px * var(--font-scale));font-family:'Poppins',sans-serif;border-radius:6px;color:var(--ink);}
  .due-date-field .due-date-text:focus{border-color:var(--line);background:var(--surface);}
  .due-date-field .due-date-cal{flex:none;background:transparent;border:none;padding:2px 3px;border-radius:6px;cursor:pointer;font-size:calc(12px * var(--font-scale));line-height:1;opacity:0.7;}
  .due-date-field .due-date-cal:hover{opacity:1;background:var(--line);}
  .due-date-field .due-date-native{position:absolute;width:1px;height:1px;padding:0;margin:0;border:none;opacity:0;overflow:hidden;pointer-events:none;}

  /* ---- calendar tab ---- */
  .cal-panel{padding:12px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-family:'Poppins',sans-serif;font-weight:600;font-size:calc(11px * var(--font-scale));color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:0.4px;padding:4px 0;}
  .cal-cell{min-height:88px;border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;background:var(--surface);transition:background .15s;overflow:hidden;}
  .cal-cell:hover{background:var(--line);}
  .cal-cell-empty{border:none;background:transparent;cursor:default;}
  .cal-cell-empty:hover{background:transparent;}
  .cal-cell-today{border:2px solid var(--navy);}
  .cal-daynum{font-family:'Poppins',sans-serif;font-weight:600;font-size:calc(12px * var(--font-scale));color:var(--navy-text);margin-bottom:4px;}
  .cal-chips{display:flex;flex-direction:column;gap:3px;}
  .cal-chip{font-size:calc(10.5px * var(--font-scale));font-weight:600;border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Poppins',sans-serif;}
  .cal-chip-class{background:var(--navy-2);color:#FFFFFF;}
  .cal-chip-task{background:#FFE7B0;color:#7A5A12;}
  .cal-chip-sidequest{background:#E0D6F5;color:#4A2E7A;}
  .cal-chip-event-private{background:#D6EAF8;color:#274E70;}
  .cal-chip-event-shared{background:#D9F2D9;color:#2E5B22;}
  .cal-chip-more{background:transparent;color:var(--muted);font-weight:600;}
  .cal-chip-completed{text-decoration:line-through;opacity:0.55;}
  .cal-chip-holiday{background:#F5C6C6;color:#7A2020;}
  .cal-cell-holiday{background:rgba(245,198,198,0.18);}
  .agenda-row{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid #F0F1EF;font-size:calc(13px * var(--font-scale));}
  .agenda-row:last-child{border-bottom:none;}
  .agenda-row .cal-chip{padding:3px 8px;}
  /* Free-text fields (task name, link, notes) auto-grow vertically as you
     type instead of clipping long content — see autoResizeTextarea(). */
  table.tasks textarea{
    display:block;width:100%;min-height:28px;border:1px solid transparent;background:transparent;
    padding:5px 6px;font-size:calc(12.5px * var(--font-scale));font-family:'Poppins',sans-serif;
    border-radius:6px;resize:none;overflow:hidden;line-height:1.4;white-space:pre-wrap;word-break:break-word;color:var(--ink);
  }
  table.tasks textarea:focus{border-color:var(--line);background:var(--surface);}
  table.tasks td.grow-cell{vertical-align:top;min-width:160px;}

<!-- ====== FIREBASE (shared catalog + personal cloud accounts) ======
  Fill in FIREBASE_CONFIG below with your own project's config object
  (Firebase console → Project settings → your web app → SDK setup and
  configuration). Until you do, apiKey stays 'PASTE_YOUR_API_KEY_HERE'

  visitors' devices until this is filled in.

  browser UNLESS the person signs in with a real account (Firebase Auth,
  email/password) — signed-in users get their personal data synced to
  Firestore under their own uid, readable only by them, so they can pick
  up their schedule on any device. Guests (not signed in) keep the old
  local-only behavior untouched. -->
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

<script>
/* ============================= STORAGE HELPERS ============================= */
// The CATALOG is always shared=true (same course listing for the whole
// school, synced via Firestore to every visitor once configured).
// Everything else — members, schedules, manual entries, block colors,
// groups, your own name/id/theme — is personal (shared=false). Where that
// lives depends on whether the person is signed in:
//   - Signed in (real Firebase Auth account): synced to Firestore under
//     their own uid, readable only by them, so it follows them to any
//     device they log into.
//   - Not signed in (guest): stays local to that browser only, exactly
//     like before — nothing is lost, it just doesn't roam.
// Personal-tier fallback order when NOT signed in:
//   1. window.storage — only exists inside a Claude artifact preview.
//   2. localStorage — real-deployment fallback, per-browser.
function hasArtifactStorage(){ return typeof window.storage !== 'undefined' && window.storage; }
function lsKey(key, shared){ return 'sked:'+(shared?'shared':'me')+':'+key; }
function currentUid(){ return (__auth && __auth.currentUser) ? __auth.currentUser.uid : null; }

async function sGet(key, shared=false){
  if(shared && __db){
    try{
      const snap = await __db.collection('sked_shared').doc(key).get();
      return snap.exists ? snap.data().value : null;
    }catch(e){ console.error('firestore get failed', key, e); /* fall through */ }
  }
  const uid = !shared ? currentUid() : null;
  if(uid && __db){
    try{
      const snap = await __db.collection('sked_users').doc(uid).collection('data').doc(key).get();
      return snap.exists ? snap.data().value : null;
    }catch(e){ console.error('firestore personal get failed', key, e); /* fall through to local */ }
  }
  if(hasArtifactStorage()){
    try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
    catch(e){ /* fall through to local fallback */ }
  }
  try{ const raw = localStorage.getItem(lsKey(key, shared)); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared=false){
  if(shared && __db){
    try{
      // Firestore rejects `undefined` fields; a JSON round-trip strips them
      // the same way JSON.stringify already did for the other two tiers.
      const clean = JSON.parse(JSON.stringify(value));
      await __db.collection('sked_shared').doc(key).set({
        value: clean, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return;
    }catch(e){ console.error('firestore set failed', key, e); /* fall through */ }
  }
  const uid = !shared ? currentUid() : null;
  if(uid && __db){
    try{
      const clean = JSON.parse(JSON.stringify(value));
      await __db.collection('sked_users').doc(uid).collection('data').doc(key).set({
        value: clean, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return;
    }catch(e){ console.error('firestore personal set failed', key, e); /* fall through to local */ }
  }
  if(hasArtifactStorage()){
    try{ await window.storage.set(key, JSON.stringify(value), shared); return; }
    catch(e){ /* fall through to local fallback */ }
  }
  try{ localStorage.setItem(lsKey(key, shared), JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', key, e); }
}
async function sDel(key, shared=false){
  if(shared && __db){
    try{ await __db.collection('sked_shared').doc(key).delete(); return; }
    catch(e){ console.error('firestore delete failed', key, e); /* fall through */ }
  }
  const uid = !shared ? currentUid() : null;
  if(uid && __db){
    try{ await __db.collection('sked_users').doc(uid).collection('data').doc(key).delete(); return; }
    catch(e){ console.error('firestore personal delete failed', key, e); /* fall through to local */ }
  }
  if(hasArtifactStorage()){
    try{ await window.storage.delete(key, shared); return; }
    catch(e){ /* fall through to local fallback */ }
  }
  try{ localStorage.removeItem(lsKey(key, shared)); }
  catch(e){ console.error('storage delete failed', key, e); }
}

// Two saves firing close together (e.g. adding two classes back-to-back) can
// race and hit the backend as conflicting concurrent writes. Chaining every
// save through one queue means the second write always waits for the first
// to finish instead of racing it.
let __saveChain = Promise.resolve();
function queueSave(fn){
  __saveChain = __saveChain.then(fn, fn).catch(e=>console.error('queued save failed', e));
  return __saveChain;
}

/* ============================= TIME / DAY HELPERS ============================= */
const DAY_ORDER = ['Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_LABEL = {Mon:'MON',Tue:'TUE',Wed:'WED',Thu:'THU',Fri:'FRI',Sat:'SAT'};
const DAY_FULL = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday'};

const SINGLE_LETTER_DAY = {M:'Mon', T:'Tue', W:'Wed', H:'Thu', F:'Fri', S:'Sat'};
const WORD_DAY = {
  MON:'Mon', MONDAY:'Mon',
  TU:'Tue', TUE:'Tue', TUES:'Tue', TUESDAY:'Tue',
  WED:'Wed', WEDNESDAY:'Wed',
  TH:'Thu', THU:'Thu', THUR:'Thu', THURS:'Thu', THURSDAY:'Thu',
  FRI:'Fri', FRIDAY:'Fri',
  SA:'Sat', SAT:'Sat', SATURDAY:'Sat',
  SU:'Sun', SUN:'Sun', SUNDAY:'Sun',
};

// Fallback for a blended run of single-letter codes with no delimiter at
// all, e.g. "MWF" or "TTH".
function scanBlendedDayLetters(token){
  const out = [];
  let i=0;
  while(i<token.length){
    if(token[i]==='T' && token[i+1]==='H'){ out.push('Thu'); i+=2; }
    else if(SINGLE_LETTER_DAY[token[i]]){ out.push(SINGLE_LETTER_DAY[token[i]]); i++; }
    else i++;
  }
  return out;
}

// AISIS mixes single-letter codes ("M-TH") with whole abbreviations
// ("W-SAT"). Naively stripping anything that isn't M/T/W/H/F/S would turn
// "SAT" into "ST" (dropping the A) and misread it as Saturday + Tuesday —
// so whole-word tokens are matched first, and the letter-by-letter scan is
// only used as a fallback for genuinely delimiter-less runs like "MWF".
function parseDays(raw){
  if(!raw) return [];
  const tokens = raw.toUpperCase().split(/[^A-Z]+/).filter(Boolean);
  const out = [];
  tokens.forEach(tok=>{
    if(tok.length===1){
      if(SINGLE_LETTER_DAY[tok]) out.push(SINGLE_LETTER_DAY[tok]);
    } else if(WORD_DAY[tok]){
      out.push(WORD_DAY[tok]);
    } else {
      out.push(...scanBlendedDayLetters(tok));
    }
  });
  return [...new Set(out)].filter(d=> DAY_ORDER.includes(d));
}

function timeToMinutes(str){
  if(!str) return null;
  str = str.trim().toUpperCase();
  const m = str.match(/(\d{1,2})[:.](\d{2})\s*(AM|PM)?/);
  if(!m) return null;
  let h = parseInt(m[1],10), min = parseInt(m[2],10);
  const ap = m[3];
  if(ap==='PM' && h<12) h+=12;
  if(ap==='AM' && h===12) h=0;
  if(!ap && h<7) h+=12; // heuristic: bare "1:00" in a class-time context usually means 1PM
  return h*60+min;
}

function minutesToLabel(mins){
  if(mins==null) return '';
  let h = Math.floor(mins/60), m = mins%60;
  const ap = h>=12 ? 'PM':'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return `${h12}:${String(m).padStart(2,'0')} ${ap}`;
}
// "09:00"-style value for an <input type="time">, from minutes-since-midnight.
function minutesToHHMM(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
// Compact hour-only label ("8a", "12p") used by the 'editorial' wallpaper style.
function abbrevHourLabel(mins){
  if(mins==null) return '';
  let h = Math.floor(mins/60);
  const ap = h>=12 ? 'p':'a';
  let h12 = h%12; if(h12===0) h12=12;
  return `${h12}${ap}`;
}

// Time-label ticks always anchor to 8:00 AM regardless of the chosen
// interval (30min, 1hr, 1hr30, etc.) — so switching intervals never shifts
// where the labels land, it only changes how many show up. If the grid's
// visible range starts after 8am (someone's earliest class is later),
// this finds the first tick at-or-after that start which still lines up
// with the 8am anchor.
function computeLabelStart(rangeStart, interval){
  const anchor = 8*60;
  if(rangeStart <= anchor) return anchor;
  return anchor + Math.ceil((rangeStart-anchor)/interval)*interval;
}

/* ============================= AISIS HTML TABLE PARSER (exact) ============================= */
function militaryToMinutes(str){
  str = String(str).padStart(4,'0');
  const h = parseInt(str.slice(0,2),10), m = parseInt(str.slice(2),10);
  if(Number.isNaN(h)||Number.isNaN(m)) return null;
  return h*60+m;
}

function looksLikeHtml(text){ return /<\s*(td|tr|table)\b/i.test(text); }

// Returns {start:Date, end:Date} — both at local midnight/end-of-day.
function semesterDateRange(type, schoolYear){
  const parts = String(schoolYear).split('-').map(s=>parseInt(s,10));
  const y1 = parts[0], y2 = Number.isFinite(parts[1]) ? parts[1] : parts[0]+1;
  if(type==='intersession') return {start:new Date(y1,5,8), end:new Date(y1,6,18)};   // Jun 8 – Jul 18
  if(type==='second')       return {start:new Date(y2,0,11), end:new Date(y2,4,15)};  // Jan 11 – May 15
  return {start:new Date(y1,7,5), end:new Date(y1,11,5)};                             // Aug 5 – Dec 5 (first sem, default)
}
// Best-guess default school year + term based on today's date.
function defaultSchoolYear(){
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  return m<=4 ? `${y-1}-${y}` : `${y}-${y+1}`; // Jan–May belongs to the school year that started the previous calendar year
}
function schoolYearOptions(){
  const y = new Date().getFullYear();
  const opts = [];
  for(let yy=y-2; yy<=y+5; yy++) opts.push(`${yy}-${yy+1}`);
  if(state.schoolYear && !opts.includes(state.schoolYear)) opts.unshift(state.schoolYear);
  return opts;
}
// Everything that's specific to a single term (your own class schedule,
// friends' schedules, tasks, sidequests) is namespaced under this key so
// switching term/school year swaps in a completely separate data set
// instead of showing the same thing everywhere. The Calendar tab
// deliberately does NOT use this — calendarEvents/receivedEvents stay a
// single running list across every term, since those are one-off events
// (birthdays, appointments, etc.) rather than term-bound coursework.
function currentTermKey(){
  return `${state.schoolYear||'unknown'}::${state.semesterType||'first'}`;
}
function termScopedKey(key){
  return `term:${currentTermKey()}:${key}`;
}
// Term-scoping was added after this app already had data saved under the
// old, un-scoped key names (e.g. plain 'schedules' instead of
// 'term:2026-2027::first:schedules'). Without this, that pre-existing data
// would look like it "disappeared" the first time someone opens the app
// post-update, since loadAll() now only looks at the term-scoped key.
// This transparently claims any old-format data it finds for a
// personal (shared=false) key: it's adopted as this term's data, written
// under the new term-scoped key so it's there next time, and the legacy
// key is cleared so a DIFFERENT term doesn't also claim the same old
// data the first time it's visited (each key can only be claimed once).
async function loadTermScopedPersonal(key, fallbackDefault){
  const scoped = termScopedKey(key);
  let val = await sGet(scoped, false);
  if(val===null || val===undefined){
    const legacy = await sGet(key, false);
    if(legacy!==null && legacy!==undefined){
      val = legacy;
      await sSet(scoped, legacy, false);
      await sDel(key, false);
    }
  }
  return (val===null || val===undefined) ? fallbackDefault : val;
}
// Same idea for a SHARED key (class-tied task lists) — but shared data is
// visible to every classmate, some of whom may not have opened the
// updated app yet, so this only ever READS the legacy doc as a fallback
// and never deletes it, to avoid pulling the rug out from under anyone
// still relying on the old key.
async function loadTermScopedShared(key, fallbackDefault){
  const scoped = termScopedKey(key);
  let val = await sGet(scoped, true);
  if(val===null || val===undefined){
    const legacy = await sGet(key, true);
    if(legacy!==null && legacy!==undefined) val = legacy;
  }
  return (val===null || val===undefined) ? fallbackDefault : val;
}

/* ============================= GOOGLE CALENDAR EXPORT (.ics) ============================= */
// No backend/OAuth is configured for this deployment, so a true one-click
// "insert directly into Google Calendar" isn't possible from a static page.
// Instead this builds a standard .ics file with one recurring weekly event
// per class meeting (correct days + times, recurring for the selected
// semester's date range) that Google Calendar imports in a single step —
// Settings → Import & export → Select file → Import.
const ICS_BYDAY = {Mon:'MO',Tue:'TU',Wed:'WE',Thu:'TH',Fri:'FR',Sat:'SA'};
const ICS_WEEKDAY_NUM = {Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
function icsPad(n){ return String(n).padStart(2,'0'); }
function icsDateTime(d){
  return `${d.getFullYear()}${icsPad(d.getMonth()+1)}${icsPad(d.getDate())}T${icsPad(d.getHours())}${icsPad(d.getMinutes())}00`;
}
function icsEscape(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
// Earliest date on/after rangeStart that lands on one of `days`.
function firstOccurrenceOnOrAfter(rangeStart, days){
  let best = null;
  (days||[]).forEach(d=>{
    const target = ICS_WEEKDAY_NUM[d];
    if(target==null) return;
    const diff = (target - rangeStart.getDay() + 7) % 7;
    const cand = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate()+diff);
    if(!best || cand < best) best = cand;
  });
  return best;
}
// Holiday dates (as local Date objects, midnight) that fall within [start, end] inclusive.
function holidayDatesInRange(range){
  return (state.holidays||[])
    .map(h=>{
      const [y,m,d] = (h.date||'').split('-').map(Number);
      if(!y||!m||!d) return null;
      return new Date(y, m-1, d);
    })
    .filter(d=> d && d >= range.start && d <= range.end);
}
// For a given weekly meeting (days=['Mon',...], start=minutes), which of the
// shared holiday dates fall on one of those weekdays — so they can be carved
// out of the RRULE as EXDATE entries and that class won't show on Google
// Calendar for that date.
function holidayExceptionsForMeeting(range, days, startMinutes){
  const abbrevForDate = (d)=> JS_DAY_TO_ABBR[d.getDay()];
  return holidayDatesInRange(range)
    .filter(d=> (days||[]).includes(abbrevForDate(d)))
    .map(d=> new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(startMinutes/60), startMinutes%60));
}
function buildIcsForEntries(entries, range){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Schedule Maker//EN','CALSCALE:GREGORIAN'];
  const stamp = icsDateTime(new Date())+'Z';
  const untilBase = new Date(range.end.getFullYear(), range.end.getMonth(), range.end.getDate(), 23,59,0);
  let n = 0, any = false;
  entries.forEach(entry=>{
    (entry.meetings||[]).forEach(m=>{
      if(!m.days || !m.days.length || m.start==null || m.end==null) return;
      const firstDate = firstOccurrenceOnOrAfter(range.start, m.days);
      if(!firstDate || firstDate > range.end) return;
      const dtStart = new Date(firstDate.getFullYear(), firstDate.getMonth(), firstDate.getDate(), Math.floor(m.start/60), m.start%60);
      const dtEnd = new Date(firstDate.getFullYear(), firstDate.getMonth(), firstDate.getDate(), Math.floor(m.end/60), m.end%60);
      const byday = m.days.map(d=>ICS_BYDAY[d]).filter(Boolean).join(',');
      if(!byday) return;
      any = true;
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:sked-${n++}-${Math.random().toString(36).slice(2,9)}@schedule-maker`);
      lines.push(`DTSTAMP:${stamp}`);
      lines.push(`DTSTART:${icsDateTime(dtStart)}`);
      lines.push(`DTEND:${icsDateTime(dtEnd)}`);
      lines.push(`RRULE:FREQ=WEEKLY;BYDAY=${byday};UNTIL=${icsDateTime(untilBase)}`);
      const exceptions = holidayExceptionsForMeeting(range, m.days, m.start);
      if(exceptions.length) lines.push(`EXDATE:${exceptions.map(icsDateTime).join(',')}`);
      lines.push(`SUMMARY:${icsEscape((entry.code||'Class')+(entry.section?' '+entry.section:''))}`);
      const desc = [entry.title, entry.instructor?('Instructor: '+entry.instructor):''].filter(Boolean).join('\\n');
      if(desc) lines.push(`DESCRIPTION:${icsEscape(desc)}`);
      if(m.room) lines.push(`LOCATION:${icsEscape(m.room)}`);
      lines.push('END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  return {text: lines.join('\r\n'), any};
}
function exportScheduleToGoogleCalendar(memberId){
  const entries = (state.schedules[memberId]||[]).map(entryFor).filter(Boolean);
  if(!entries.length){ showToast('Add a class first — nothing to export yet.'); return; }
  const range = semesterDateRange(state.semesterType, state.schoolYear);
  const {text, any} = buildIcsForEntries(entries, range);
  if(!any){ showToast("None of your classes fall within the selected term's dates."); return; }
  const blob = new Blob([text], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `schedule-${state.semesterType}-${state.schoolYear}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  showToast('Calendar file downloaded. In Google Calendar: Settings → Import & export → Select file → Import.');
}

/* ============================= GOOGLE CALENDAR — DIRECT ONE-CLICK INSERT ============================= */
// Real, no-import-step insertion via the Calendar API, using a
// per-person Google Cloud OAuth Client ID (see openGoogleCalendarSetupModal
// for the walkthrough). The Client ID is a public identifier — not a
// secret — so it's stored SHARED (shared=true), just like the class
// catalog: whoever sets it up once, everyone else automatically uses the
// same value and never sees the setup modal.
let __gisTokenClient = null;
let __gisAccessToken = null;
let __gisTokenExpiry = 0;

function getGoogleClientId(){ return state.googleClientId || ''; }

function ensureTokenClient(clientId){
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    throw new Error("Google's sign-in library hasn't loaded yet — check your connection and try again in a moment.");
  }
  if(__gisTokenClient && __gisTokenClient.__clientId === clientId) return __gisTokenClient;
  __gisTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: ()=>{}, // overridden per request below
  });
  __gisTokenClient.__clientId = clientId;
  return __gisTokenClient;
}

function requestGoogleAccessToken(clientId, forceConsent){
  return new Promise((resolve, reject)=>{
    let tc;
    try{ tc = ensureTokenClient(clientId); }catch(e){ reject(e); return; }
    tc.callback = (resp)=>{
      if(resp && resp.access_token){
        __gisAccessToken = resp.access_token;
        __gisTokenExpiry = Date.now() + ((resp.expires_in||3300)*1000);
        resolve(resp.access_token);
      } else {
        reject(new Error((resp && resp.error) || 'Google sign-in was cancelled or failed.'));
      }
    };
    tc.error_callback = (err)=> reject(new Error((err && err.message) || 'Google sign-in was cancelled or failed.'));
    tc.requestAccessToken({ prompt: forceConsent ? 'consent' : (__gisAccessToken ? '' : 'consent') });
  });
}

async function getValidAccessToken(clientId){
  if(__gisAccessToken && Date.now() < __gisTokenExpiry - 30000) return __gisAccessToken;
  return requestGoogleAccessToken(clientId, false);
}

function toGcalDateTime(d){
  return `${d.getFullYear()}-${icsPad(d.getMonth()+1)}-${icsPad(d.getDate())}T${icsPad(d.getHours())}:${icsPad(d.getMinutes())}:00`;
}
// Same meeting math as the .ics builder, but as Calendar API event bodies
// (structured start/end/timeZone + an RRULE string) instead of raw ICS text.
function buildGoogleCalendarEventBodies(entries, range, termLabel){
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Manila';
  const untilUtc = icsDateTime(new Date(range.end.getFullYear(), range.end.getMonth(), range.end.getDate(), 23,59,0)) + 'Z';
  const events = [];
  entries.forEach(entry=>{
    (entry.meetings||[]).forEach(m=>{
      if(!m.days || !m.days.length || m.start==null || m.end==null) return;
      const firstDate = firstOccurrenceOnOrAfter(range.start, m.days);
      if(!firstDate || firstDate > range.end) return;
      const byday = m.days.map(d=>ICS_BYDAY[d]).filter(Boolean).join(',');
      if(!byday) return;
      const startDate = new Date(firstDate.getFullYear(), firstDate.getMonth(), firstDate.getDate(), Math.floor(m.start/60), m.start%60);
      const endDate = new Date(firstDate.getFullYear(), firstDate.getMonth(), firstDate.getDate(), Math.floor(m.end/60), m.end%60);
      const description = [entry.title, entry.instructor?('Instructor: '+entry.instructor):'', termLabel].filter(Boolean).join('\n');
      const recurrence = [`RRULE:FREQ=WEEKLY;BYDAY=${byday};UNTIL=${untilUtc}`];
      const exceptions = holidayExceptionsForMeeting(range, m.days, m.start);
      // Google's EXDATE for a timed recurring event must match DTSTART's format:
      // local wall-clock time tagged with the same TZID (no trailing Z).
      if(exceptions.length) recurrence.push(`EXDATE;TZID=${tz}:${exceptions.map(toGcalDateTime).map(s=>s.replace(/[-:]/g,'')).join(',')}`);
      events.push({
        summary: (entry.code||'Class') + (entry.section ? ' '+entry.section : ''),
        location: m.room || undefined,
        description: description || undefined,
        start: { dateTime: toGcalDateTime(startDate), timeZone: tz },
        end:   { dateTime: toGcalDateTime(endDate),   timeZone: tz },
        recurrence,
      });
    });
  });
  return events;
}

async function insertEventBatch(events, token){
  let ok=0; const failed=[];
  for(const ev of events){
    try{
      const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method:'POST',
        headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' },
        body: JSON.stringify(ev)
      });
      if(res.ok){ ok++; }
      else { failed.push({ev, status:res.status}); console.error('Calendar insert failed', res.status, await res.text().catch(()=> '')); }
    }catch(e){ failed.push({ev, status:0}); console.error('Calendar insert error', e); }
  }
  return {ok, failed};
}

async function insertScheduleIntoGoogleCalendar(memberId){
  const clientId = getGoogleClientId();
  if(!clientId){ openGoogleCalendarSetupModal(); return; }

  const entries = (state.schedules[memberId]||[]).map(entryFor).filter(Boolean);
  if(!entries.length){ showToast('Add a class first — nothing to add yet.'); return; }
  const range = semesterDateRange(state.semesterType, state.schoolYear);
  const termLabel = semesterLabel(state.semesterType, state.schoolYear);
  const events = buildGoogleCalendarEventBodies(entries, range, termLabel);
  if(!events.length){ showToast("None of your classes fall within the selected term's dates."); return; }

  let token;
  try{ token = await getValidAccessToken(clientId); }
  catch(e){ showToast('Google sign-in failed: ' + e.message); return; }

  showToast(`Adding ${events.length} class${events.length===1?'':'es'} to Google Calendar…`);
  let {ok, failed} = await insertEventBatch(events, token);

  // If everything failed and it looks like an auth problem, the cached
  // token was likely stale/revoked — force a fresh consent prompt and
  // retry once before giving up.
  if(ok===0 && failed.length && failed.every(f=>f.status===401)){
    __gisAccessToken = null;
    try{
      token = await requestGoogleAccessToken(clientId, true);
      const retry = await insertEventBatch(failed.map(f=>f.ev), token);
      ok += retry.ok; failed = retry.failed;
    }catch(e){ showToast('Google sign-in failed: ' + e.message); return; }
  }

  if(!failed.length) showToast(`Added ${ok} class${ok===1?'':'es'} directly to your Google Calendar 🎉`);
  else showToast(`Added ${ok}, ${failed.length} failed to add — see browser console for details.`);
}

// Parses AISIS's public classSkeds.do result table. Returns one staged row
// per meeting line (a section with lecture+lab on different days/times yields
// two rows sharing the same code+section) — these get grouped back together
// when confirmed into the catalog.
function parseAisisHtml(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const trs = [...doc.querySelectorAll('tr')];
  const staged = [];

  for(const tr of trs){
    const cells = [...tr.querySelectorAll('td.text02')];
    if(cells.length < 7) continue; // header rows use text04, not a data row

    const cellText = (i)=>{
      if(!cells[i]) return '';
      return cells[i].innerHTML
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<[^>]+>/g, '')
        .replace(/&nbsp;/gi, ' ')
        .trim();
    };

    const code = cellText(0);
    if(!code) continue;
    const section = cellText(1);
    const title = cellText(2);
    const units = cellText(3);
    const timeRaw = cellText(4);
    const roomRaw = cellText(5);
    const instructor = cellText(6);
    const remarks = cellText(11);

    // Time cell often looks like "M-TH 0800-0930\n(FULLY ONSITE)" — drop the
    // parenthetical modality line, keep one line per actual meeting.
    const timeLines = timeRaw.split('\n').map(s=>s.trim()).filter(s=>s && !/^\(.*\)$/.test(s));
    const roomLines = roomRaw.split('\n').map(s=>s.trim()).filter(Boolean);

    const pushRow = (days, start, end, room)=> staged.push({
      id: 'stg_'+Math.random().toString(36).slice(2,9),
      code, section, title, units, days, start, end, room, instructor, remarks
    });

    if(!timeLines.length){ pushRow([], null, null, roomLines[0]||''); continue; }

    timeLines.forEach((line, idx)=>{
      const dayMatch = line.match(/^([A-Za-z-]+)/);
      const timeMatch = line.match(/(\d{3,4})\s*-\s*(\d{3,4})/);
      const days = dayMatch ? parseDays(dayMatch[1]) : [];
      const start = timeMatch ? militaryToMinutes(timeMatch[1]) : null;
      const end = timeMatch ? militaryToMinutes(timeMatch[2]) : null;
      const room = roomLines[idx] || roomLines[0] || '';
      pushRow(days, start, end, room);
    });
  }
  return staged;
}

/* ============================= LINE PARSER (best-effort, plain text fallback) ============================= */
function parseScheduleText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [];
  const dayTimeRe = /\b([MTWHFS](?:[MTWHFS]){0,4})\s*[\s,\/-]*\s*(\d{1,2}[:.]\d{2}\s*(?:[AaPp][Mm])?)\s*-\s*(\d{1,2}[:.]\d{2}\s*(?:[AaPp][Mm])?)/;
  const codeRe = /\b([A-Z]{2,6})\s?-?\s?(\d{1,4}[A-Z]?)\b/;
  const unitsRe = /\b(\d(?:\.\d)?)\s*(?:units?)?\b(?=.*$)/i;

  for(const line of lines){
    const dt = line.match(dayTimeRe);
    const cm = line.match(codeRe);
    if(!dt && !cm) continue; // skip lines with no useful signal at all

    let remainder = line;
    let days=[], start=null, end=null;
    if(dt){
      days = parseDays(dt[1]);
      start = timeToMinutes(dt[2]);
      end = timeToMinutes(dt[3]);
      remainder = remainder.replace(dt[0],' ');
    }
    let code='', section='';
    if(cm){
      code = (cm[1]+' '+cm[2]).trim();
      remainder = remainder.replace(cm[0],' ');
      // guess a short section token right after where code was
      const secMatch = remainder.match(/^\s*([A-Z0-9]{1,3})\b/);
      if(secMatch && secMatch[1].length<=3){ section = secMatch[1]; remainder = remainder.replace(secMatch[0],' '); }
    }
    let units='';
    const um = remainder.match(/\b([1-6](?:\.\d)?)\b/);
    if(um){ units = um[1]; }

    remainder = remainder.replace(/\s{2,}/g,' ').replace(/[|;,]{1,}/g,' ').trim();

    rows.push({
      id: 'stg_'+Math.random().toString(36).slice(2,9),
      code: code || '',
      section: section || '',
      title: remainder || '',
      units: units || '',
      days, start, end,
      room: '',
      instructor: ''
    });
  }
  return rows;
}

// Kept modest so a single font file's base64 form comfortably fits inside
// one Firestore document (1 MiB limit) alongside its metadata.
const CUSTOM_FONT_MAX_BYTES = 700*1024;
const CUSTOM_FONT_MIME = {woff2:'font/woff2', woff:'font/woff', ttf:'font/ttf', otf:'font/otf'};

function fontStackFor(name){
  const custom = state.customFonts.find(x=>x.name===name);
  if(custom) return `'${custom.name}', sans-serif`;
  const f = FONT_OPTIONS.find(x=>x.n===name);
  return f ? f.s : "'Poppins', sans-serif";
}
// Custom (user-uploaded) fonts are listed first, ahead of the built-in list.
function getAllFontOptions(){
  return [...state.customFonts.map(f=>({n:f.name, s:`'${f.name}', sans-serif`, custom:true, id:f.id})), ...FONT_OPTIONS];
}
function isKnownFontName(name){
  return state.customFonts.some(f=>f.name===name) || FONT_OPTIONS.some(f=>f.n===name);
}

function uniqueFontName(base){
  let name = base, i = 2;
  while(isKnownFontName(name) || FONT_OPTIONS.some(f=>f.n===name)) name = `${base} (${i++})`;
  return name;
}

// Loads a font's bytes into the browser's live font set. Both the on-site
// board and the wallpaper canvas need this to actually happen before they
// can render text in it — just having the base64 saved isn't enough.
async function registerFontFace(name, mime, dataUrl){
  const face = new FontFace(name, `url(${dataUrl})`);
  document.fonts.add(face);
  await face.load();
  return face;
}

async function loadCustomFonts(){
  const ids = (await sGet('customFontIndex', false)) || [];
  const loaded = [];
  for(const id of ids){
    const entry = await sGet(`customFont:${id}`, false);
    if(!entry || !entry.data) continue;
    try{
      await registerFontFace(entry.name, entry.mime, entry.data);
      loaded.push({id, name:entry.name, mime:entry.mime, data:entry.data});
    }catch(e){ console.error('failed to load custom font', entry.name, e); }
  }
  state.customFonts = loaded;
}

// Reads, registers, and persists an uploaded font file. Throws (with a
// human-readable message) on anything the caller should show the user.
async function addCustomFont(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  const mime = CUSTOM_FONT_MIME[ext];
  if(!mime) throw new Error('That doesn\'t look like a font file — use .ttf, .otf, .woff, or .woff2.');
  if(file.size > CUSTOM_FONT_MAX_BYTES) throw new Error(`That font file is too big (max ${Math.round(CUSTOM_FONT_MAX_BYTES/1024)}KB) to save to your account.`);
  const baseName = (file.name.replace(/\.[^.]+$/, '') || 'My font').trim().slice(0,60);
  const name = uniqueFontName(baseName);
  const dataUrl = await new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = ()=> reject(new Error('Could not read that file.'));
    r.readAsDataURL(file);
  });
  await registerFontFace(name, mime, dataUrl); // throws if the file isn't a valid font
  const id = (crypto.randomUUID ? crypto.randomUUID() : `f${Date.now()}${Math.random().toString(36).slice(2)}`);
  const entry = {id, name, mime, data:dataUrl};
  state.customFonts.push(entry);
  const ids = (await sGet('customFontIndex', false)) || [];
  await sSet(`customFont:${id}`, entry, false);
  await sSet('customFontIndex', [...ids, id], false);
  return name;
}

async function deleteCustomFont(id){
  const entry = state.customFonts.find(f=>f.id===id);
  state.customFonts = state.customFonts.filter(f=>f.id!==id);
  const ids = (await sGet('customFontIndex', false)) || [];
  await sSet('customFontIndex', ids.filter(x=>x!==id), false);
  await sDel(`customFont:${id}`, false);
  return entry;
}

      uploadBtn.textContent = '⬆️ Upload a font…';
    }
  };
  backdrop.querySelector('#fpClose').onclick = ()=> backdrop.remove();
  backdrop.onclick = (e)=>{ if(e.target===backdrop) backdrop.remove(); };
  setTimeout(()=>searchEl.focus(), 30);
}

// Every personal (shared=false) key the app stores — used to copy a
// guest's local data into their new account right after they sign up, so
// creating an account doesn't wipe out work they already did as a guest.
// Term-scoped data (schedules, manualEntries, blockColors, personalTasks,
// taskStatuses, customCategories, sidequests, sidequestCategories) is
// handled separately below since its key name depends on which term(s)
// the guest used.
const PERSONAL_KEYS = ['members','groups','me-id','theme','fontScale','labelInterval','darkMode','semesterType','schoolYear'];
async function migrateGuestDataToAccount(){
  for(const key of PERSONAL_KEYS){
    let raw;
    try{ raw = localStorage.getItem(lsKey(key, false)); }catch(e){ continue; }
    if(raw==null) continue;
    try{ await sSet(key, JSON.parse(raw), false); }catch(e){ console.error('migration failed for', key, e); }
  }
  // Copy over every term-scoped key the guest touched — not just the
  // currently selected term — so switching terms after signing up still
  // shows the work they did as a guest in other terms too.
  try{
    const prefix = lsKey('term:', false); // 'sked:me:term:'
    for(let i=0;i<localStorage.length;i++){
      const lsK = localStorage.key(i);
      if(!lsK || !lsK.startsWith(prefix)) continue;
      const rawKey = lsK.slice('sked:me:'.length); // back to the un-prefixed 'term:...' key sSet/sGet expect
      let raw;
      try{ raw = localStorage.getItem(lsK); }catch(e){ continue; }
      if(raw==null) continue;
      try{ await sSet(rawKey, JSON.parse(raw), false); }catch(e){ console.error('migration failed for', rawKey, e); }
    }
  }catch(e){ console.error('term-scoped guest migration scan failed', e); }
}

// ============================= ACCOUNT FRIENDS =============================
// Lets two signed-in accounts find each other by name, send/accept a
// request, and — once accepted — each automatically sees the other's own
// "My Schedule" (read-only) in their Friends tab. Separate from the older
// manual-friend feature above (typing in someone's classes yourself), which
// still works unchanged for people without accounts.
function nameLower(s){ return (s||'').trim().toLowerCase(); }

// Keeps this account's name searchable by others. Called after boot (if
// signed in) and whenever the person edits their own display name.
async function ensureDirectoryProfile(){
  const uid = currentUid();
  if(!__db || !uid) return;
  const me = getMember(state.meId);
  if(!me) return;
  try{
    await __db.collection('user_directory').doc(uid).set({
      uid, name: me.name, nameLower: nameLower(me.name),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ console.error('directory profile update failed', e); }
}

// Prefix search on the lowercase name field — Firestore has no full-text
// search, so this only matches names that START WITH the query.
async function searchDirectory(q){
  const uid = currentUid();
  if(!__db || !uid || !q.trim()) return [];
  const ql = nameLower(q);
  try{
    const snap = await __db.collection('user_directory')
      .where('nameLower','>=',ql).where('nameLower','<=',ql+'\uf8ff')
      .limit(15).get();
    return snap.docs.map(d=>d.data()).filter(u=>u.uid!==uid);
  }catch(e){ console.error('friend search failed', e); return []; }
}

async function acceptFriendRequestDoc(reqId, req){
  const a = req.from, b = req.to, aName = req.fromName, bName = req.toName;
  const now = firebase.firestore.FieldValue.serverTimestamp();
  await Promise.all([
    __db.collection('sked_users').doc(a).collection('friends').doc(b).set({uid:b, name:bName, since:now}),
    __db.collection('sked_users').doc(b).collection('friends').doc(a).set({uid:a, name:aName, since:now}),
    __db.collection('friend_requests').doc(reqId).delete(),
  ]);
}

// Sending a request while the other person already sent you one completes
// the match immediately instead of leaving two crossed pending requests.
async function sendFriendRequest(toUid, toName){
  const uid = currentUid();
  if(!__db || !uid) return 'error';
  const me = getMember(state.meId);
  const myName = me ? me.name : 'Someone';
  const reverseId = toUid+'_'+uid;
  const forwardId = uid+'_'+toUid;
  try{
    const reverseSnap = await __db.collection('friend_requests').doc(reverseId).get();
    if(reverseSnap.exists && reverseSnap.data().status==='pending'){
      await acceptFriendRequestDoc(reverseSnap.id, reverseSnap.data());
      return 'accepted';
    }
    await __db.collection('friend_requests').doc(forwardId).set({
      from: uid, fromName: myName, to: toUid, toName,
      status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return 'sent';
  }catch(e){ console.error('sendFriendRequest failed', e); return 'error'; }
}
async function acceptFriendRequest(req){
  try{ await acceptFriendRequestDoc(req.id, req); }catch(e){ console.error(e); }
  await loadFriendsData();
  render();
}
async function declineFriendRequest(req){
  try{ await __db.collection('friend_requests').doc(req.id).delete(); }catch(e){ console.error(e); }
  await loadFriendsData();
  render();
}
async function cancelOutgoingRequest(req){
  try{ await __db.collection('friend_requests').doc(req.id).delete(); }catch(e){ console.error(e); }
  await loadFriendsData();
  render();
}
async function unfriendAccount(remoteUid){
  const ok = await customConfirm(`Remove this friend?\n\nYou'll both stop seeing each other's schedules. This can't be undone.`);
  if(!ok) return;
  const uid = currentUid();
  try{
    await Promise.all([
      __db.collection('sked_users').doc(uid).collection('friends').doc(remoteUid).delete(),
      __db.collection('sked_users').doc(remoteUid).collection('friends').doc(uid).delete(),
    ]);
  }catch(e){ console.error(e); }
  const memberId = 'acct:'+remoteUid;
  state.members = state.members.filter(m=>m.remoteUid!==remoteUid);
  delete state.schedules[memberId];
  delete state.blockColors[memberId];
  delete state.remoteManualEntries[remoteUid];
  state.combinedOn.delete(memberId);
  if(state.friendEditingId===memberId) state.friendEditingId = null;
  render();
}

// Pulls one account-friend's OWN classes (never their friends-of-friends —
// their 'me-id' doc says which entry in THEIR schedules map is really
// theirs) into the local read-only cache so the Friends/Combined tabs can
// show it via the normal renderBoard/entryFor pipeline.
async function fetchFriendSchedule(remoteUid){
  if(!__db) return;
  const memberId = 'acct:'+remoteUid;
  try{
    const base = __db.collection('sked_users').doc(remoteUid).collection('data');
    const [meIdSnap, schedSnap, manualSnap] = await Promise.all([
      base.doc('me-id').get(), base.doc(termScopedKey('schedules')).get(), base.doc(termScopedKey('manualEntries')).get(),
    ]);
    const theirMeId = meIdSnap.exists ? meIdSnap.data().value : null;
    let remoteSchedules = schedSnap.exists ? (schedSnap.data().value||{}) : null;
    let remoteManual = manualSnap.exists ? (manualSnap.data().value||{}) : null;
    // Their client may not have opened the updated app yet, so their data
    // could still sit under the old un-scoped doc — fall back to reading
    // that (read-only; we can't write to their account to migrate it).
    if(remoteSchedules===null || remoteManual===null){
      const [legacySchedSnap, legacyManualSnap] = await Promise.all([
        base.doc('schedules').get(), base.doc('manualEntries').get(),
      ]);
      if(remoteSchedules===null) remoteSchedules = legacySchedSnap.exists ? (legacySchedSnap.data().value||{}) : {};
      if(remoteManual===null) remoteManual = legacyManualSnap.exists ? (legacyManualSnap.data().value||{}) : {};
    }
    state.schedules[memberId] = (theirMeId && remoteSchedules[theirMeId]) ? remoteSchedules[theirMeId] : [];
    state.remoteManualEntries[remoteUid] = (theirMeId && remoteManual[theirMeId]) ? remoteManual[theirMeId] : {};
  }catch(e){ console.error('fetchFriendSchedule failed', remoteUid, e); }
}

// Refreshes accepted friends + pending requests, and syncs state.members so
// every accepted friend automatically shows up in the Friends tab without
// the person needing to add them manually.
async function loadFriendsData(){
  const uid = currentUid();
  if(!__db || !uid) return;
  try{
    const [friendsSnap, inSnap, outSnap] = await Promise.all([
      __db.collection('sked_users').doc(uid).collection('friends').get(),
      __db.collection('friend_requests').where('to','==',uid).where('status','==','pending').get(),
      __db.collection('friend_requests').where('from','==',uid).where('status','==','pending').get(),
    ]);
    state.incomingRequests = inSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.outgoingRequests = outSnap.docs.map(d=>({id:d.id, ...d.data()}));

    const friendDocs = friendsSnap.docs.map(d=>d.data());
    state.members = state.members.filter(m=>!m.isAccountFriend || friendDocs.some(f=>f.uid===m.remoteUid));
    for(const f of friendDocs){
      let m = state.members.find(x=>x.remoteUid===f.uid);
      if(!m){
        m = {id:'acct:'+f.uid, name:f.name, color:colorForIndex(state.members.length), isAccountFriend:true, remoteUid:f.uid};
        state.members.push(m);
      } else {
        m.name = f.name;
      }
    }
    await Promise.all(friendDocs.map(f=>fetchFriendSchedule(f.uid)));
  }catch(e){ console.error('loadFriendsData failed', e); }
}

// Called whenever the term/school-year picker changes. Swaps in a
// completely separate data set for your own schedule, friends' schedules,
// tasks, and sidequests — Calendar events are deliberately left untouched
// (see the note above currentTermKey()).
async function reloadTermScopedData(){
  state.schedules = await loadTermScopedPersonal('schedules', {});
  state.manualEntries = await loadTermScopedPersonal('manualEntries', {});
  state.blockColors = await loadTermScopedPersonal('blockColors', {});
  // Re-pull account friends' schedules for the newly selected term (their
  // side is stored under the same term-scoped key, so this fetches the
  // right slice of their data too).
  if(currentUid()) await loadFriendsData();

  // Tasks/sidequests are lazy-loaded per tab behind a "loaded" flag —
  // clear the cached data and flags so the next visit fetches fresh,
  // term-scoped data instead of showing what was cached from the old term.
  state.tasks = {};
  state.personalTasks = [];
  state.personalStatuses = {};
  state.customCategories = [];
  state.__personalTasksLoaded = false;
  state.sidequests = [];
  state.sidequestCategories = [];
  state.__sidequestsLoaded = false;

  // If already sitting on a tab that needs this data, reload it now
  // instead of waiting for a tab switch.
  if(state.activeTab==='tasks') await ensureTasksLoaded();
  if(state.activeTab==='sidequests') await ensureSidequestsLoaded();

async function removeMember(id){
  if(id === state.meId) return; // never allow removing yourself from here
  state.members = state.members.filter(m=>m.id!==id);
  delete state.schedules[id];
  delete state.manualEntries[id];
  delete state.blockColors[id];
  state.combinedOn.delete(id);
  if(state.friendEditingId === id) state.friendEditingId = null;
  state.groups.forEach(g=>{ g.memberIds = g.memberIds.filter(mid=>mid!==id); });
  if(state.activeGroupId){
    const g = state.groups.find(gr=>gr.id===state.activeGroupId);
    if(!g) state.activeGroupId = null;
  }
  await saveMembers();
  await saveSchedules();
  await saveManual();
  await saveBlockColors();
  await saveGroups();
}

function colorForIndex(i){ return MEMBER_COLORS[i % MEMBER_COLORS.length]; }

// Picks black or white text depending on background luminance, so a light
// pastel block doesn't end up with unreadable white text.
function getContrastTextColor(hex){
  const c = (hex||'').replace('#','');
  if(c.length!==6) return '#FFFFFF';
  const r = parseInt(c.substr(0,2),16)/255, g = parseInt(c.substr(2,2),16)/255, b = parseInt(c.substr(4,2),16)/255;
  const lin = v => v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  const L = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  return L > 0.5 ? '#1C2430' : '#FFFFFF';
}

/* ============================= THEME ============================= */
// A handful of pastel presets to pick from, plus a native color input for
// a fully custom accent. Only the accent color is stored — every other
// theme variable (background tint, borders, text-on-accent contrast) is
// derived from it so a custom pick always stays readable.
const THEME_PRESETS = [
  {name:'Royal Blue',   hex:'#4169E1'},
  {name:'Pastel Yellow', hex:'#E3A62A'},
  {name:'Pastel Lavender', hex:'#9C8FC7'},
  {name:'Pastel Mint',   hex:'#5FAE96'},
  {name:'Pastel Blush',  hex:'#D97D96'},
  {name:'Pastel Sky',    hex:'#6FA8D9'},
  {name:'Pastel Peach',  hex:'#E0955F'},
  {name:'Pastel Rose',   hex:'#F6C6C7'},
  {name:'Pastel Gold',   hex:'#F9DCA0'},
  {name:'Pastel Seafoam',hex:'#B9E0D4'},
  {name:'Pastel Lilac',  hex:'#C9B8E0'},
  {name:'Pastel Apricot',hex:'#F5CBA1'},
  {name:'Pastel Powder Blue', hex:'#A9C8E0'},
  {name:'Pastel Mauve',  hex:'#D9B8B8'},
  {name:'Pastel Sage',   hex:'#B7CBA0'},
];
const DEFAULT_THEME = THEME_PRESETS[0].hex;

function hexToRgb(hex){
  const c = (hex||'').replace('#','');
  return { r:parseInt(c.substr(0,2),16), g:parseInt(c.substr(2,2),16), b:parseInt(c.substr(4,2),16) };
}
function rgbToHex(r,g,b){
  const h = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#'+h(r)+h(g)+h(b);
}
// Blends `hex` toward `target` (white/black) by `amt` (0..1).
function mixHex(hex, target, amt){
  const a = hexToRgb(hex), b = hexToRgb(target);
  return rgbToHex(a.r+(b.r-a.r)*amt, a.g+(b.g-a.g)*amt, a.b+(b.b-a.b)*amt);
}
function lightenHex(hex, amt){ return mixHex(hex, '#FFFFFF', amt); }
function darkenHex(hex, amt){ return mixHex(hex, '#000000', amt); }

// Sets every theme CSS variable from a single accent color and (optionally)
// persists it to the user's own storage so it's personal, not shared.
async function applyTheme(hex, persist){
  if(!/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
  const root = document.documentElement.style;
  const rgb = hexToRgb(hex);
  const dark = !!state.darkMode;
  root.setProperty('--navy', hex);
  root.setProperty('--navy-2', dark ? darkenHex(hex, 0.25) : lightenHex(hex, 0.35));
  root.setProperty('--navy-text', dark ? lightenHex(hex, 0.35) : darkenHex(hex, 0.35));
  root.setProperty('--navy-ink', getContrastTextColor(hex));
  root.setProperty('--navy-rgb', `${rgb.r},${rgb.g},${rgb.b}`);
  if(dark){
    root.setProperty('--bg', mixHex(hex, '#12141C', 0.90));
    root.setProperty('--surface', mixHex(hex, '#1B1E2A', 0.88));
    root.setProperty('--line', mixHex(hex, '#2E3346', 0.72));
    root.setProperty('--ink', '#E8EAF2');
    root.setProperty('--muted', '#9AA0B8');
  } else {
    root.setProperty('--bg', lightenHex(hex, 0.92));
    root.setProperty('--surface', '#FFFFFF');
    root.setProperty('--line', lightenHex(hex, 0.8));
    root.setProperty('--ink', '#2A2E3D');
    root.setProperty('--muted', '#6B7290');
  }
  state.themeHex = hex;
  if(persist) await queueSave(()=> sSet('theme', hex, false));
}
async function loadTheme(){
  const saved = await sGet('theme', false);
  await applyTheme((saved && /^#[0-9A-Fa-f]{6}$/.test(saved)) ? saved : DEFAULT_THEME, false);
}

];

function openFontSizePicker(anchorEl){
  document.querySelectorAll('.swatch-popover').forEach(p=>p.remove());
  const rect = anchorEl.getBoundingClientRect();
  const popover = el(`<div class="swatch-popover" style="top:${rect.bottom+4}px;right:${window.innerWidth-rect.right}px;left:auto;grid-template-columns:1fr;width:150px;padding:8px;"></div>`);
  FONT_SCALE_STEPS.forEach(step=>{
    const active = Math.abs((state.fontScale||1)-step.value) < 0.001;
    const btn = el(`<button class="chip ${active?'active':''}" style="width:100%;justify-content:center;margin-bottom:4px;">${step.name}</button>`);
    btn.onclick = (e)=>{ e.stopPropagation(); popover.remove(); applyFontScale(step.value, true); };
    popover.appendChild(btn);
  });
  document.body.appendChild(popover);
  setTimeout(()=>{
    const closeHandler = (ev)=>{
      if(!popover.contains(ev.target) && ev.target!==anchorEl){
        popover.remove();
        document.removeEventListener('click', closeHandler);
      }
    };
    document.addEventListener('click', closeHandler);
  }, 0);
}

async function loadScheduleFont(){
