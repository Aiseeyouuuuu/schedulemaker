function getMember(id){ return state.members.find(m=>m.id===id); }

function catalogKey(code, section){
  return (code||'').trim().toUpperCase().replace(/\s+/g,' ') + '|' + (section||'').trim().toUpperCase().replace(/\s+/g,' ');
}

function entryFor(id){
  // id could be a catalog id, a local manual entry id, or an account
  // friend's own manual entry id (cached read-only after fetchFriendSchedule)
  const c = state.catalog.find(c=>c.id===id);
  if(c) return c;
  for(const mid in state.manualEntries){ if(state.manualEntries[mid][id]) return state.manualEntries[mid][id]; }
  for(const uid in state.remoteManualEntries){ if(state.remoteManualEntries[uid][id]) return state.remoteManualEntries[uid][id]; }
  return null;
}

// a and b are single meetings: {days, start, end}
function meetingOverlap(a,b){
  if(a.start==null||a.end==null||b.start==null||b.end==null) return false;
  const shareDay = a.days.some(d=>b.days.includes(d));
  if(!shareDay) return false;
  return a.start < b.end && b.start < a.end;
}

// "Find a Free Time": given the currently selected members' entries (each
// {entries:[...]} — same shape as combined-view boardGroups) and a filter
// {days, startMin, endMin, minMinutes}, returns every open gap on those
// days, within that time window, at least minMinutes long, that NONE of
// the selected people have a class during. One pass per day: collect
// every meeting's busy interval (clamped to the window) from every
// selected person, merge overlaps, then take what's left over as free.
function findFreeTimes(boardGroups, filters){
  const {days, startMin, endMin, minMinutes} = filters;
  const results = [];
  days.forEach(day=>{
    const busy = [];
    boardGroups.forEach(g=>{
      (g.entries||[]).forEach(entry=>{
        (entry.meetings||[]).forEach(m=>{
          if(!m.days || !m.days.includes(day) || m.start==null || m.end==null) return;
          const s = Math.max(m.start, startMin), e = Math.min(m.end, endMin);
          if(e>s) busy.push({start:s, end:e});
        });
      });
    });
    busy.sort((a,b)=>a.start-b.start);
    const merged = [];
    busy.forEach(b=>{
      if(merged.length && b.start<=merged[merged.length-1].end){
        merged[merged.length-1].end = Math.max(merged[merged.length-1].end, b.end);
      } else merged.push({...b});
    });
    let cursor = startMin;
    merged.forEach(b=>{
      if(b.start-cursor >= minMinutes) results.push({day, start:cursor, end:b.start});
      cursor = Math.max(cursor, b.end);
    });
    if(endMin-cursor >= minMinutes) results.push({day, start:cursor, end:endMin});
  });
  // Sort by day-of-week order, then by start time within a day.
  results.sort((a,b)=> DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day) || a.start-b.start);
  return results;
}

// Merged busy intervals for ONE person's own entries on a single day —
// used to check how far a proposed free slot sits from that person's own
// neighboring classes (see personWaitForSlot below).
function personDayIntervals(entries, day){
  const list = [];
  (entries||[]).forEach(entry=>{
    (entry.meetings||[]).forEach(m=>{
      if(m.days && m.days.includes(day) && m.start!=null && m.end!=null) list.push({start:m.start, end:m.end});
    });
  });
  list.sort((a,b)=>a.start-b.start);
  const merged = [];
  list.forEach(iv=>{
    if(merged.length && iv.start<=merged[merged.length-1].end){
      merged[merged.length-1].end = Math.max(merged[merged.length-1].end, iv.end);
    } else merged.push({...iv});
  });
  return merged;
}

// A shared free slot is only actually convenient if nobody has to sit
// around campus for it. This looks at ONE person's own classes that day
// and returns the longer of: how long they'd be done-and-waiting before
// the slot starts (if they have a class right before it), and how long
// they'd be waiting-before-their-next-class after it ends (if they have
// one right after). Returns null if neither side applies — meaning they
// have no class that day bracketing the slot, so there's nothing to wait
// out; they'd just come for the meeting itself.
function personWaitForSlot(intervals, slotStart, slotEnd){
  let prevEnd = null, nextStart = null;
  intervals.forEach(iv=>{
    if(iv.end<=slotStart && (prevEnd===null || iv.end>prevEnd)) prevEnd = iv.end;
    if(iv.start>=slotEnd && (nextStart===null || iv.start<nextStart)) nextStart = iv.start;
  });
  const gapBefore = prevEnd!=null ? slotStart-prevEnd : null;
  const gapAfter = nextStart!=null ? nextStart-slotEnd : null;
  const candidates = [gapBefore, gapAfter].filter(g=>g!=null);
  if(!candidates.length) return null;
  return Math.max(...candidates);
}

// Who (if anyone) shown in boardGroups would have a 3+ hour dead-time wait
// around this specific free slot. Returns [{name, waitMinutes}, ...].
const LONG_WAIT_MINUTES = 180;
function longWaitersForSlot(boardGroups, slot){
  const waiters = [];
  boardGroups.forEach(g=>{
    const intervals = personDayIntervals(g.entries, slot.day);
    const wait = personWaitForSlot(intervals, slot.start, slot.end);
    if(wait!=null && wait > LONG_WAIT_MINUTES) waiters.push({name:g.member.name, waitMinutes:wait});
  });
  return waiters;
}
function minutesToDuration(mins){
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  if(h && m) return `${h}h ${m}m`;
  if(h) return `${h}h`;
  return `${m}m`;
}

// entries carry .meetings[]; conflict if any meeting pair between the two overlaps
function entriesConflict(entryA, entryB){
  return (entryA.meetings||[]).some(ma=>(entryB.meetings||[]).some(mb=>meetingOverlap(ma,mb)));
}

/* ============================= RENDER ROOT ============================= */
// Runs on first load AND every time sign-in state changes (sign in, sign
// up, sign out) — each time, it reloads data from whichever tier applies
// now (that account's cloud data, or this browser's local guest data) and
// re-renders, so switching accounts always shows the right schedule.
let __guestChosenThisSession = false; // "Continue without an account" — only skips the gate for this page load
let __forceGateAfterSignOut = false;  // set right before signOut() so boot() shows the landing gate instead of falling through to old local guest data
async function boot(){
  await loadDarkMode(); // must run before loadTheme() — bg/surface/ink depend on light-vs-dark
  await loadTheme();
  await loadFontScale();
  await loadCustomFonts();
  await loadScheduleFont();
  await loadLabelInterval();
  await loadAll();
  if(__forceGateAfterSignOut){
    __forceGateAfterSignOut = false;
    renderGateChoice();
    return;
  }
  if(!state.meId){
    // Brand-new visitor (no local guest data and no cloud data yet). If
    // real accounts are configured and they're not already signed in, ask
    // for sign-in/sign-up FIRST — signing in here can also pull in an
    // existing account's name/schedule, skipping the name prompt entirely.
    if(__auth && !currentUid() && !__guestChosenThisSession){ renderAuthGate(); return; }
    renderNamePrompt();
    return;
  }
  if(currentUid()){
    await ensureDirectoryProfile();
    await loadFriendsData();
  }
  render();
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
// A <tr> set via a plain div's innerHTML gets silently dropped by the HTML
// parser (table rows outside a <table> aren't valid) — this wraps it in a
// real <table><tbody> first so the row actually gets created.
function elRow(trHtml){
  const t = document.createElement('table');
  t.innerHTML = `<tbody>${trHtml.trim()}</tbody>`;
  return t.querySelector('tr');
}
// Same problem as elRow above, one level down: a bare <td> set via a plain
// div's innerHTML gets silently dropped by the parser too (only its
// children survive), so building a <td> with el() returns the wrong node
// entirely. This wraps it in a real <table><tbody><tr> first so the <td>
// itself actually gets created.
function elCell(tdHtml){
  const t = document.createElement('table');
  t.innerHTML = `<tbody><tr>${tdHtml.trim()}</tr></tbody>`;
  return t.querySelector('td');
}
// Grows a <textarea> to fit its content vertically instead of clipping or
// scrolling. Needs the element to actually be laid out (a real width) to
// measure scrollHeight correctly, so callers doing this right after
// insertion should go through scheduleAutoResize below instead.
function autoResizeTextarea(ta){
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}
// Detached/just-inserted nodes can report scrollHeight:0 before the browser
// has painted them, so the very first sizing pass waits a frame.
function scheduleAutoResize(ta){
  requestAnimationFrame(()=> autoResizeTextarea(ta));
}

// ---- Link/Notes cells that auto-render a pasted URL as a clickable chip ----
// Recognizes bare "example.com" style entries too, not just ones already
// starting with http(s):// — those get that scheme assumed when opened.
// Also recognizes multiple URLs sharing one box (e.g. "slides:
// https://... doc: https://... — review both by Friday") by pulling every
// http(s) URL out of the string; each becomes its own chip, and whatever
// text is left over is kept and shown alongside them rather than dropped.
function extractUrlFromText(v){
  const s = (v||'').trim();
  if(!s) return null;
  const m = s.match(/https?:\/\/\S+/i);
  if(!m) return null;
  // Trim trailing punctuation/brackets/quotes that were just sentence
  // punctuation around the link, not part of it.
  return m[0].replace(/[),.;!?\]}'"]+$/,'');
}
// Splits a field's raw text into {hrefs, rest}: hrefs is every link found
// (in order, duplicates removed), rest is whatever other text was in the box.
function parseLinkField(v){
  const s = (v||'').trim();
  if(!s) return {hrefs:[], rest:''};
  // Whole-string case: the box holds nothing but a single bare domain
  // (e.g. "example.com", no protocol) — preserves the original strict
  // behavior for that shorthand, since bare domains are ambiguous inside
  // a longer sentence.
  if(!/\s/.test(s) && !/^https?:\/\//i.test(s) && /^[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(s)){
    return {hrefs:[`https://${s}`], rest:''};
  }
  // Otherwise pull out every http(s) URL present, in order.
  const rawMatches = s.match(/https?:\/\/\S+/gi) || [];
  if(!rawMatches.length) return {hrefs:[], rest:s};
  const hrefs = [];
  let rest = s;
  rawMatches.forEach(raw=>{
    const trimmed = raw.replace(/[),.;!?\]}'"]+$/,'');
    if(!hrefs.includes(trimmed)) hrefs.push(trimmed);
    rest = rest.replace(raw, ' ');
  });
  rest = rest.replace(/[ \t]+/g,' ').trim();
  return {hrefs, rest};
}
function isLikelyUrl(v){
  return parseLinkField(v).hrefs.length > 0;
}
// Recognizes common file/doc/media hosts and returns a short, friendly
// title (e.g. "Google Sheet", "Canva Design") instead of the raw URL —
// covers the file types people actually paste in here.
function knownLinkTitle(href){
  let host, path;
  try{
    const u = new URL(href);
    host = u.hostname.replace(/^www\./,'').toLowerCase();
    path = u.pathname;
  }catch(e){ return null; }

  if(host==='docs.google.com'){
    if(path.startsWith('/spreadsheets')) return 'Google Sheet';
    if(path.startsWith('/presentation')) return 'Google Slides';
    if(path.startsWith('/forms')) return 'Google Form';
    if(path.startsWith('/document')) return 'Google Doc';
    return 'Google Docs';
  }
  if(host==='sheets.google.com') return 'Google Sheet';
  if(host==='slides.google.com') return 'Google Slides';
  if(host==='forms.google.com' || host==='forms.gle') return 'Google Form';
  if(host==='drive.google.com') return 'Google Drive File';
  if(host==='photos.google.com' || host==='photos.app.goo.gl') return 'Google Photos';
  if(host==='canva.com' || host.endsWith('.canva.com') || host==='canva.site') return 'Canva Design';
  if(host==='youtube.com' || host==='m.youtube.com' || host==='youtu.be') return 'YouTube Video';
  if(host==='notion.so' || host.endsWith('.notion.site')) return 'Notion Page';
  if(host==='dropbox.com' || host==='www.dropbox.com') return 'Dropbox File';
  if(host==='figma.com') return 'Figma File';
  if(host==='airtable.com') return 'Airtable Base';
  if(host==='zoom.us' || host.endsWith('.zoom.us')) return 'Zoom Link';
  if(host==='calendar.google.com') return 'Google Calendar';
  return null;
}
// The chip wraps onto extra lines rather than clipping, so this only needs
// to guard against pathologically long URLs — not the common case.
function urlLabel(href){
  const known = knownLinkTitle(href);
  if(known) return known;
  let label;
  try{
    const u = new URL(href);
    const path = u.pathname.replace(/\/+$/,'') + u.search;
    label = u.hostname.replace(/^www\./,'') + (path && path!=='/' ? path : '');
  }catch(e){
    label = href;
  }
  return label.length > 200 ? label.slice(0,197)+'…' : label;
}
// Builds a <td> for a link/notes field that shows a plain auto-growing
// textarea while being edited, but renders as one or more clickable pills
// (site icon + friendly title or host/path, each opening in a new tab)
// once it holds something URL-shaped and loses focus. Any leftover text
// is shown below the chips. A small pencil button (visible on hover)
// switches back to editing.
function makeLinkCell(initialValue, placeholder, onSave){
  const td = elCell(`<td class="grow-cell"><div class="link-cell-wrap"></div></td>`);
  const wrap = td.querySelector('.link-cell-wrap');
  const ta = el(`<textarea rows="1" placeholder="${placeholder}"></textarea>`);
  ta.value = initialValue || '';

  const chipRow = el(`<div class="link-chip-row">
    <div class="link-chip-col"></div>
    <button type="button" class="link-chip-edit" title="Edit">✎</button>
  </div>`);
  const chipCol = chipRow.querySelector('.link-chip-col');
  const editBtn = chipRow.querySelector('.link-chip-edit');

  // Swaps in the site's favicon (via a lightweight, no-CORS favicon
  // service) in place of the generic chain emoji; falls back to the
  // emoji if the favicon fails to load or the host can't be parsed.
  function setChipIcon(iconEl, href){
    let host = null;
    try{ host = new URL(href).hostname; }catch(e){}
    iconEl.innerHTML = '';
    if(host){
      const img = document.createElement('img');
      img.className = 'link-chip-favicon';
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.src = `https://www.google.com/s2/favicons?sz=32&domain=${encodeURIComponent(host)}`;
      img.onerror = ()=>{ iconEl.textContent = '🔗'; };
      iconEl.appendChild(img);
    } else {
      iconEl.textContent = '🔗';
    }
  }
  function makeChip(href){
    const a = el(`<a class="link-chip" target="_blank" rel="noopener noreferrer">
      <span class="link-chip-icon">🔗</span><span class="link-chip-label"></span>
    </a>`);
    a.href = href;
    a.querySelector('.link-chip-label').textContent = urlLabel(href);
    setChipIcon(a.querySelector('.link-chip-icon'), href);
    a.onclick = (e)=> e.stopPropagation();
    return a;
  }

  function showChip(){
    const {hrefs, rest} = parseLinkField(ta.value);
    chipCol.innerHTML = '';
    hrefs.forEach(href=> chipCol.appendChild(makeChip(href)));
    if(rest){
      chipCol.appendChild(el(`<div class="link-chip-extra"></div>`));
      chipCol.lastChild.textContent = rest;
    }
    wrap.innerHTML = ''; wrap.appendChild(chipRow);
  }
  function showTextarea(focus){
    wrap.innerHTML = ''; wrap.appendChild(ta);
    scheduleAutoResize(ta);
    if(focus){ ta.focus(); ta.select(); }
  }

  ta.oninput = ()=> autoResizeTextarea(ta);
  ta.onchange = (e)=> onSave(e.target.value);
  ta.onblur = ()=>{ if(isLikelyUrl(ta.value)) showChip(); };
  editBtn.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); showTextarea(true); };

  if(isLikelyUrl(ta.value)) showChip(); else showTextarea(false);
  return td;
}

// ---- Task-tracker due-date cell ----
// A native <input type="date"> makes typing awkward: it splits into
// month/day/year segments and each one intercepts keystrokes on its own,
// so digits easily land in the wrong segment (e.g. typing "09082026"
// leaves "0020" sitting in the year). This pairs a plain, freely-typable
// text field (MM/DD/YYYY, slashes auto-inserted) with a small calendar
// button that opens the browser's native date picker via a hidden
// <input type="date"> — so both typing and pick-from-calendar work. The
// value going in and coming out via onCommit is always the ISO
// "YYYY-MM-DD" string the rest of the app stores and sorts by.
function isoToTyped(iso){
  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length!==3) return '';
  const [y,m,d] = parts;
  if(!y||!m||!d) return '';
  return `${m}/${d}/${y}`;
}
function typedToIso(str){
  const m = str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  const mm = m[1].padStart(2,'0'), dd = m[2].padStart(2,'0'), yyyy = m[3];
  const dt = new Date(`${yyyy}-${mm}-${dd}T00:00:00`);
  if(dt.getFullYear()!==Number(yyyy) || dt.getMonth()+1!==Number(mm) || dt.getDate()!==Number(dd)) return null;
  return `${yyyy}-${mm}-${dd}`;
}
function createDueDateCell(value, onCommit){
  const td = elCell(`<td><div class="due-date-field">
    <input type="text" class="due-date-text" inputmode="numeric" autocomplete="off" placeholder="MM/DD/YYYY" maxlength="10" value="${isoToTyped(value)}" />
    <button type="button" class="due-date-cal" title="Pick a date from calendar" aria-label="Pick a date from calendar">📅</button>
    <input type="date" class="due-date-native" value="${value||''}" tabindex="-1" aria-hidden="true" />
  </div></td>`);
  const textInput = td.querySelector('.due-date-text');
  const calBtn = td.querySelector('.due-date-cal');
  const nativeInput = td.querySelector('.due-date-native');

  // Auto-insert slashes as digits are typed, so "09082026" becomes
  // "09/08/2026" without the person having to type the separators.
  textInput.oninput = ()=>{
    const digits = textInput.value.replace(/\D/g,'').slice(0,8);
    let out = digits;
    if(digits.length>4) out = digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
    else if(digits.length>2) out = digits.slice(0,2)+'/'+digits.slice(2);
    textInput.value = out;
  };
  const commitText = ()=>{
    const raw = textInput.value.trim();
    if(!raw){ if(value){ value=''; nativeInput.value=''; onCommit(''); } return; }
    const iso = typedToIso(raw);
    if(iso===null){
      showToast('Enter a valid date as MM/DD/YYYY.');
      textInput.value = isoToTyped(value);
      return;
    }
    if(iso===value) return;
    value = iso;
    nativeInput.value = iso;
    onCommit(iso);
  };
  textInput.onchange = commitText;
  textInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); textInput.blur(); } };

  calBtn.onclick = (e)=>{
    e.stopPropagation();
    if(typeof nativeInput.showPicker === 'function'){
      try{ nativeInput.showPicker(); return; }catch(err){}
    }
    nativeInput.focus();
  };
  nativeInput.onchange = ()=>{
    value = nativeInput.value;
    textInput.value = isoToTyped(value);
    onCommit(value);
  };

  return td;
}
// Same typable-text + calendar-button field as createDueDateCell above, but
// returned as a plain <div> instead of a <td> — for use in modals/forms
// outside a table (e.g. the New Event date field).
function createDueDateField(value, onCommit){
  const wrap = el(`<div class="due-date-field">
    <input type="text" class="due-date-text" inputmode="numeric" autocomplete="off" placeholder="MM/DD/YYYY" maxlength="10" value="${isoToTyped(value)}" />
    <button type="button" class="due-date-cal" title="Pick a date from calendar" aria-label="Pick a date from calendar">📅</button>
    <input type="date" class="due-date-native" value="${value||''}" tabindex="-1" aria-hidden="true" />
  </div>`);
  const textInput = wrap.querySelector('.due-date-text');
  const calBtn = wrap.querySelector('.due-date-cal');
  const nativeInput = wrap.querySelector('.due-date-native');

  textInput.oninput = ()=>{
    const digits = textInput.value.replace(/\D/g,'').slice(0,8);
    let out = digits;
    if(digits.length>4) out = digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
    else if(digits.length>2) out = digits.slice(0,2)+'/'+digits.slice(2);
    textInput.value = out;
  };
  const commitText = ()=>{
    const raw = textInput.value.trim();
    if(!raw) return;
    const iso = typedToIso(raw);
    if(iso===null){
      showToast('Enter a valid date as MM/DD/YYYY.');
      textInput.value = isoToTyped(value);
      return;
    }
    if(iso===value) return;
    value = iso;
    nativeInput.value = iso;
    onCommit(iso);
  };
  textInput.onchange = commitText;
  textInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); textInput.blur(); } };

  calBtn.onclick = (e)=>{
    e.stopPropagation();
    if(typeof nativeInput.showPicker === 'function'){
      try{ nativeInput.showPicker(); return; }catch(err){}
    }
    nativeInput.focus();
  };
  nativeInput.onchange = ()=>{
    value = nativeInput.value;
    textInput.value = isoToTyped(value);
    onCommit(value);
  };

  return wrap;
}

// iframes (including this one) — they silently no-op instead of throwing,
// which looks exactly like "the button did nothing." This is a real modal

    background:var(--navy);color:var(--navy-ink);padding:10px 18px;border-radius:20px;font-size:13px;
    font-family:'Poppins',sans-serif;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,0.2);

// Reusable popover of color swatches anchored under `anchorEl`. Positioned
// with position:fixed so it isn't clipped by any overflow:hidden ancestor
// (blocks on the board clip their own content for text truncation). Always
// includes a color-wheel swatch at the end for a fully custom pick.
function openColorPicker(anchorEl, colors, onPick, currentColor){
  document.querySelectorAll('.swatch-popover').forEach(p=>p.remove());
  const rect = anchorEl.getBoundingClientRect();
  const popover = el(`<div class="swatch-popover" style="top:${rect.bottom+4}px;left:${rect.left}px;"></div>`);
  colors.forEach(color=>{
    const dot = el(`<button class="swatch-dot" style="background:${color};"></button>`);
    dot.onclick = (e)=>{ e.stopPropagation(); popover.remove(); onPick(color); };
    popover.appendChild(dot);
  });
  const customWrap = el(`<label class="swatch-dot" title="Custom color" style="background:conic-gradient(#FADADD,#FFE5B4,#FFFACD,#D9F2D9,#D6EAF8,#E0D6F5,#FADADD);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;"></label>`);
  const customInput = el(`<input type="color" value="${currentColor||'#6B5CA0'}" style="position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;top:0;left:0;border:none;padding:0;" />`);
  customWrap.appendChild(customInput);
  customInput.onchange = (e)=>{ popover.remove(); onPick(e.target.value); };
  popover.appendChild(customWrap);
  document.body.appendChild(popover);
  setTimeout(()=>{
    const closeHandler = (ev)=>{
      if(!popover.contains(ev.target) && ev.target!==anchorEl){
        popover.remove();
        document.removeEventListener('click', closeHandler);
      }
    };
    document.addEventListener('click', closeHandler);
  }, 0);
}

function renderGateForm(mode){ // mode: 'signup' | 'signin'
  const app = $('#app');
  app.innerHTML = '';
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal">
        <h2>${mode==='signup' ? 'Create your account' : 'Sign in'}</h2>
        <p class="hint">${mode==='signup'
          ? 'Create an account to save your schedule and pick it up on any device.'
          : 'Sign in — if you\'ve already set up your schedule under this account, it\'ll load automatically.'}</p>
        <input id="gateEmail" type="email" placeholder="Email" autocomplete="email" />
        <input id="gatePassword" type="password" placeholder="Password" autocomplete="${mode==='signup'?'new-password':'current-password'}" />
        <p class="hint" id="gateError" style="color:var(--danger);display:none;"></p>
        <button id="gateSubmit">${mode==='signup' ? 'Create Account' : 'Sign in'}</button>
        <p class="hint" style="margin-top:14px;"><a href="#" id="gateBack">Back</a></p>
        ${mode==='signin' ? `<p class="hint"><a href="#" id="gateForgot">Forgot password?</a></p>` : ''}
        <p class="hint" style="margin-top:${mode==='signin'?'0':'14px'};"><a href="#" id="gateSkip">Continue without an account</a></p>
      </div>
    </div>`);
  app.appendChild(backdrop);

  const emailInput = backdrop.querySelector('#gateEmail');
  const passwordInput = backdrop.querySelector('#gatePassword');
  const errorP = backdrop.querySelector('#gateError');
  const submitBtn = backdrop.querySelector('#gateSubmit');
  emailInput.focus();

  backdrop.querySelector('#gateBack').onclick = (e)=>{ e.preventDefault(); renderGateChoice(); };
  backdrop.querySelector('#gateSkip').onclick = (e)=>{
    e.preventDefault();
    __guestChosenThisSession = true;
    boot(); // resumes this browser's local guest schedule if one exists, otherwise shows the name prompt
  };
  const forgotLink = backdrop.querySelector('#gateForgot');
  if(forgotLink){
    forgotLink.onclick = async (e)=>{
      e.preventDefault();
      const email = emailInput.value.trim();
      if(!email){ errorP.style.color='var(--danger)'; errorP.textContent = 'Enter your email above first.'; errorP.style.display = 'block'; return; }
      try{
        await __auth.sendPasswordResetEmail(email);
        errorP.style.color = 'var(--muted)';
        errorP.textContent = 'Password reset email sent — check your inbox.';
        errorP.style.display = 'block';
      }catch(err){
        errorP.style.color = 'var(--danger)';
        errorP.textContent = authErrorMessage(err);
        errorP.style.display = 'block';
      }
    };
  }

  const submit = async ()=>{
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if(!email || !password){
      errorP.style.color = 'var(--danger)';
      errorP.textContent = 'Enter both an email and a password.';
      errorP.style.display = 'block';
      return;
    }
    submitBtn.disabled = true;
    const originalLabel = submitBtn.textContent;
    submitBtn.textContent = mode==='signup' ? 'Creating account…' : 'Signing in…';
    errorP.style.display = 'none';
    try{
      if(mode==='signup'){
        await __auth.createUserWithEmailAndPassword(email, password);
        // No local guest data exists yet at this gate (that's what makes
        // this a new-visitor flow) — nothing to migrate, they'll just get
        // the name prompt next since this fresh account has no meId yet.
      } else {
        await __auth.signInWithEmailAndPassword(email, password);
      }
      // onAuthStateChanged fires boot() again: currentUid() is now set, so
      // the gate is skipped. An existing account's data (including meId)
      // loads automatically; a brand-new one falls through to the name prompt.
    }catch(err){
      errorP.style.color = 'var(--danger)';
      errorP.textContent = authErrorMessage(err);
      errorP.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }
  };
  submitBtn.onclick = submit;
  passwordInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

// Friendlier text for the Firebase Auth error codes people actually hit.
function authErrorMessage(e){
  const map = {
    'auth/invalid-email': 'That email address doesn\'t look right.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/email-already-in-use': 'An account already exists with that email — try signing in instead.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/too-many-requests': 'Too many attempts — please wait a bit and try again.',
    'auth/network-request-failed': 'Network error — check your connection and try again.',
  };
  return map[e && e.code] || (e && e.message) || 'Something went wrong. Please try again.';
}

  else if(state.activeTab==='friends') app.appendChild(renderFriendsTab());
  else app.appendChild(renderCombinedTab());
}

// Single dropdown for everything that used to be its own small header icon
// (theme, dark mode, font size, schedule font, time-label interval, admin)
// plus account/sign-out at the bottom, so signing out doesn't require
// opening the account modal first.
function openSettingsMenu(anchorEl){
  document.querySelectorAll('.settings-menu').forEach(p=>p.remove());
  const uid = currentUid();
  const user = __auth ? __auth.currentUser : null;
  const rect = anchorEl.getBoundingClientRect();
  const width = 220;
  const right = Math.max(8, window.innerWidth - rect.right);
  const menu = el(`<div class="settings-menu" style="top:${rect.bottom+6}px;right:${right}px;width:${width}px;"></div>`);

  const closeHandler = (ev)=>{
    if(!menu.contains(ev.target) && ev.target!==anchorEl){
      menu.remove();
      document.removeEventListener('click', closeHandler);
    }
  };
  const close = ()=>{ menu.remove(); document.removeEventListener('click', closeHandler); };

  const item = (iconHtml, label, onClick, extraClass)=>{
    const btn = el(`<button type="button" class="settings-menu-item${extraClass?' '+extraClass:''}"><span class="smi-icon">${iconHtml}</span><span class="smi-label">${label}</span></button>`);
    btn.onclick = (e)=>{ e.stopPropagation(); close(); onClick(); };
    menu.appendChild(btn);
    return btn;
  };

  item(`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;background:conic-gradient(#FADADD,#FFE5B4,#FFFACD,#D9F2D9,#D6EAF8,#E0D6F5,#FADADD);"></span>`, 'Theme color', ()=> openThemePicker(anchorEl));
  item(state.darkMode?'☀️':'🌙', state.darkMode?'Light mode':'Dark mode', async ()=>{ await applyDarkMode(!state.darkMode, true); render(); });
  item('Aa', 'Font size', ()=> openFontSizePicker(anchorEl));
  item('🔤', 'Schedule font', ()=> openScheduleFontPicker());
  item('⏱', 'Time-label interval', ()=> openLabelIntervalPicker(anchorEl));
  item(state.isAdmin?'🔓':'🔒', 'Admin', ()=> openAdminModal());

  menu.appendChild(el(`<div class="settings-menu-divider"></div>`));

  if(uid){
    menu.appendChild(el(`<div class="settings-menu-account">Signed in as<br/><b style="color:var(--ink);">${(user&&user.email||'').replace(/</g,'&lt;')}</b></div>`));
    item('🚪', 'Sign out', async ()=>{ await signOutNow(); }, 'danger');
  } else {
    item('👤', 'Sign in', ()=> openAccountModal());
  }

  document.body.appendChild(menu);
  setTimeout(()=> document.addEventListener('click', closeHandler), 0);
}

function renderTabs(){
  const wrap = el(`<div class="tabs"></div>`);
  [['mine','My Schedule'],['tasks','Tasks'],['sidequests','Sidequests'],['calendar','Calendar'],['friends','Friends'],['combined','Combined']].forEach(([key,label])=>{
    const b = el(`<button class="tab-btn ${state.activeTab===key?'active':''}">${label}</button>`);
    b.onclick = async ()=>{
      state.activeTab=key;
      if(key==='tasks') await ensureTasksLoaded();
      if(key==='sidequests') await ensureSidequestsLoaded();
      if(key==='calendar'){ await ensureTasksLoaded(); await ensureSidequestsLoaded(); await ensureCalendarLoaded(); }
      render();
    };
    wrap.appendChild(b);
  });
  return wrap;
}

/* ============================= AUTOMATED CATALOG (GitHub Actions) =============================
   The Cloud-Functions-based importer was replaced with a GitHub Actions
   workflow (see aisis-backend/) that fetches + parses AISIS itself, on a
   schedule or on manual dispatch, and writes each term's result straight
   to Firestore at sked_shared/catalog__<schoolYear>-<termCode> — using a
   service-account key that lives in GitHub Secrets, never in this file or
   the repo. That write bypasses these client-side Firestore rules
   entirely (the Admin SDK always can), so no admin sign-in is needed for
   the automated side. This panel just lets an admin pull one of those
   already-written terms into the LIVE shared catalog everyone here reads
   from — same merge-by-course+section behavior as the manual import
   below, so re-loading a term after a re-run never duplicates classes.

   "Update AISIS Catalog" (below) is a separate step from that: it just
   asks the Cloudflare Worker to kick off the GitHub Actions workflow for
   a term, it does NOT load anything into the shared catalog itself. The
   Worker holds the real X-Trigger-Secret server-side — this page never
   sees it. All the browser sends is the signed-in admin's Firebase ID
   token (via __auth.currentUser.getIdToken()); the Worker needs a small
   server-side change to verify that token (Firebase's public JWKS, or
   the Firebase Admin SDK) and check the uid against its own allow-list
   before honoring the request — see AISIS_TRIGGER_WORKER_URL above. */
function renderAutoCatalogPanel(){
  const panel = el(`
    <div class="panel">
      <h3>Load automated catalog</h3>
      <p class="hint">The GitHub Actions updater writes each term to its own spot in the database — it never touches other terms. Pick a term, optionally start a fresh AISIS pull for it, then load it into the shared catalog below; loading merges in by course + section, so nothing already added gets duplicated.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-start;">
        <select id="autoCatYear"></select>
        <select id="autoCatTerm"></select>
        <div id="autoCatDeptWrap" style="position:relative;">
          <button type="button" class="ghost" id="autoCatDeptBtn" style="min-width:170px;text-align:left;">All Departments ▾</button>
          <div id="autoCatDeptMenu" style="display:none;position:absolute;z-index:20;top:100%;left:0;margin-top:4px;padding:8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.25);max-height:260px;overflow:auto;min-width:220px;color:var(--ink);">
            <label style="display:flex;align-items:center;gap:6px;padding:4px 2px;font-weight:600;border-bottom:1px solid var(--line);margin-bottom:4px;">
              <input type="checkbox" id="autoCatDeptAll" checked/> All Departments
            </label>
            <div id="autoCatDeptList"></div>
            <input id="autoCatDeptCustom" type="text" placeholder="Other code(s), comma-separated" style="width:100%;margin-top:6px;box-sizing:border-box;" />
          </div>
        </div>
        <button class="ghost" id="autoCatTrigger">🔄 Update AISIS Catalog</button>
        <button id="autoCatLoad">Load into shared catalog</button>
      </div>
      <p class="hint" id="autoCatTriggerStatus" style="margin-top:8px;"></p>
      <p class="hint" id="autoCatStatus" style="margin-top:8px;"></p>
    </div>`);
  const yearSel = panel.querySelector('#autoCatYear');
  schoolYearOptions().forEach(y=> yearSel.appendChild(el(`<option value="${y}" ${state.schoolYear===y?'selected':''}>SY ${y}</option>`)));
  const termSel = panel.querySelector('#autoCatTerm');
  SEMESTER_TYPES.forEach(t=> termSel.appendChild(el(`<option value="${t.value}" ${state.semesterType===t.value?'selected':''}>${t.label}</option>`)));
  const status = panel.querySelector('#autoCatStatus');
  const triggerStatus = panel.querySelector('#autoCatTriggerStatus');

  // Department checklist dropdown. AISIS_DEPARTMENTS is a placeholder
  // (see its definition above) — until it's filled in, this falls back
  // to just the "All Departments" checkbox plus the free-text field for
  // typing codes directly, so the feature still works end to end.
  const deptBtn = panel.querySelector('#autoCatDeptBtn');
  const deptMenu = panel.querySelector('#autoCatDeptMenu');
  const deptAllCb = panel.querySelector('#autoCatDeptAll');
  const deptListEl = panel.querySelector('#autoCatDeptList');
  const deptCustomInput = panel.querySelector('#autoCatDeptCustom');
  const deptCbs = [];
  AISIS_DEPARTMENTS.forEach(d=>{
    const row = el(`<label style="display:flex;align-items:center;gap:6px;padding:3px 2px;white-space:nowrap;">
      <input type="checkbox" value="${d.code}"/> ${d.code} — ${d.label}
    </label>`);
    const cb = row.querySelector('input');
    deptCbs.push(cb);
    cb.onchange = ()=> updateDeptButtonLabel();
    deptListEl.appendChild(row);
  });

  function updateDeptButtonLabel(){
    const checked = deptCbs.filter(cb=>cb.checked).map(cb=>cb.value);
    const custom = deptCustomInput.value.trim();
    if(deptAllCb.checked || (!checked.length && !custom)){
      deptBtn.textContent = 'All Departments ▾';
      return;
    }
    const parts = checked.concat(custom ? custom.split(',').map(s=>s.trim()).filter(Boolean) : []);
    deptBtn.textContent = (parts.length===1 ? parts[0] : `${parts.length} departments`) + ' ▾';
  }

  deptAllCb.onchange = ()=>{
    if(deptAllCb.checked){
      deptCbs.forEach(cb=> cb.checked=false);
      deptCustomInput.value = '';
    }
    updateDeptButtonLabel();
  };
  deptCbs.forEach(cb=> cb.addEventListener('change', ()=>{
    if(cb.checked) deptAllCb.checked = false;
    updateDeptButtonLabel();
  }));
  deptCustomInput.addEventListener('input', ()=>{
    if(deptCustomInput.value.trim()) deptAllCb.checked = false;
    updateDeptButtonLabel();
  });
  deptBtn.onclick = (e)=>{
    e.stopPropagation();
    deptMenu.style.display = deptMenu.style.display==='none' ? 'block' : 'none';
  };
  document.addEventListener('click', (e)=>{
    if(!panel.contains(e.target)) return;
    if(deptMenu.style.display!=='none' && !deptMenu.contains(e.target) && e.target!==deptBtn){
      deptMenu.style.display = 'none';
    }
  });

  // Reads the checklist + custom field into the "all" | "CODE1,CODE2"
  // string the Worker's validateDepartments() and the AISIS updater
  // expect. Client-side format check only — the Worker re-validates
  // server-side regardless.
  function collectDepartments(){
    if(deptAllCb.checked) return {value:'all'};
    const checked = deptCbs.filter(cb=>cb.checked).map(cb=>cb.value);
    const custom = deptCustomInput.value.trim()
      ? deptCustomInput.value.trim().split(',').map(c=>c.trim().toUpperCase()).filter(Boolean)
      : [];
    const codes = checked.concat(custom);
    if(!codes.length) return {value:'all'}; // nothing picked = same as "All Departments"
    if(codes.some(c => c.length>20 || !/^[A-Z0-9 ()]+$/.test(c))){
      return {error:'Department codes can only contain letters, numbers, spaces, and parentheses.'};
    }
    return {value: Array.from(new Set(codes)).join(',')};
  }

  // Starts the GitHub Actions AISIS updater for the selected term. This
  // only queues the workflow run — it does not load anything into the
  // shared catalog. Once the run finishes, use "Load into shared
  // catalog" below (possibly after a manual refresh/re-check) to pull
  // the result in.
  panel.querySelector('#autoCatTrigger').onclick = async ()=>{
    const btn = panel.querySelector('#autoCatTrigger');
    if(btn.disabled) return;

    // Reads the department checklist into "all" | "CODE1,CODE2", the
    // format the Worker's validateDepartments() and the AISIS updater
    // expect. The Worker re-validates this server-side regardless; this
    // is just to catch obvious mistakes before spending a workflow run.
    const deptResult = collectDepartments();
    if(deptResult.error){
      triggerStatus.textContent = deptResult.error;
      triggerStatus.style.color = 'var(--danger)';
      return;
    }
    const departments = deptResult.value;

    btn.disabled = true;
    triggerStatus.style.color = 'var(--muted)';
    triggerStatus.textContent = 'Starting AISIS update…';
    try{
      const schoolYearStart = parseInt(String(yearSel.value).split('-')[0], 10);
      const term = termSel.value; // SEMESTER_TYPES values are already 'intersession'|'first'|'second' — same strings the Worker expects
      // No X-Trigger-Secret here — that stays server-side in the Worker.
      // We send the signed-in admin's Firebase ID token instead, so the
      // Worker can verify who's asking without this page ever holding a
      // credential capable of triggering the workflow on its own.
      const idToken = (__auth && __auth.currentUser) ? await __auth.currentUser.getIdToken() : null;
      const headers = {'Content-Type':'application/json'};
      if(idToken) headers['Authorization'] = 'Bearer ' + idToken;
      const res = await fetch(AISIS_TRIGGER_WORKER_URL, {
        method:'POST',
        headers,
        body: JSON.stringify({schoolYearStart, term, departments})
      });
      let data = null;
      try{ data = await res.json(); }catch(e){ /* non-JSON error body, fall through to the generic message below */ }
      if(!res.ok || !data || data.triggered !== true){
        const detail = data && data.error ? ` (${data.error})` : '';
        triggerStatus.textContent = `Could not start the AISIS update. Please try again.${detail}`;
        triggerStatus.style.color = 'var(--danger)';
        return;
      }
      const deptLabel = departments === 'all' ? 'all departments' : departments;
      triggerStatus.textContent = `AISIS update started successfully for ${deptLabel}. GitHub Actions is now running. `;
      triggerStatus.style.color = 'var(--muted)';
      if(data.html_url){
        const link = document.createElement('a');
        link.href = data.html_url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'View GitHub Action';
        triggerStatus.appendChild(link);
      }
    }catch(e){
      console.error('trigger AISIS update failed', e);
      triggerStatus.textContent = 'Could not start the AISIS update. Please try again.';
      triggerStatus.style.color = 'var(--danger)';
    }finally{
      btn.disabled = false;
    }
  };

  panel.querySelector('#autoCatLoad').onclick = async ()=>{
    const btn = panel.querySelector('#autoCatLoad');
    if(btn.disabled) return;
    btn.disabled = true;
    status.style.color = 'var(--muted)';
    status.textContent = 'Loading…';
    try{
      const key = catalogTermKey(yearSel.value, termSel.value);
      const termCourses = await sGet('catalog__'+key, true);
      if(!termCourses || !termCourses.length){
        status.textContent = `No automated catalog found yet for ${semesterLabel(termSel.value, yearSel.value)} (doc "catalog__${key}"). Run the GitHub Action first.`;
        status.style.color = 'var(--danger)';
        return;
      }
      let added=0, replaced=0;
      termCourses.forEach(entry=>{
        const k = catalogKey(entry.code, entry.section);
        const idx = state.catalog.findIndex(c => catalogKey(c.code, c.section) === k);
        const copy = {...entry};
        if(idx>-1){ copy.id = state.catalog[idx].id; state.catalog[idx] = copy; replaced++; }
        else{ copy.id = copy.id || ('c_'+Math.random().toString(36).slice(2,9)); state.catalog.push(copy); added++; }
      });
      await saveCatalog();
      render();
      showToast(`Loaded ${semesterLabel(termSel.value, yearSel.value)} — ${added} added, ${replaced} replaced.`);
    }catch(e){
      console.error('load automated catalog failed', e);
      status.textContent = 'Something went wrong loading that term — check the console.';
      status.style.color = 'var(--danger)';
    }finally{
      btn.disabled = false;
    }
  };
  return panel;
}

function renderStageTable(container){
  container.innerHTML = '';
  if(!state.staged.length){ return; }
  const table = el(`
    <table class="stage">
      <thead><tr>
        <th>Code</th><th>Sec</th><th>Title</th><th>Units</th><th>Days</th><th>Start</th><th>End</th><th>Room</th><th>Remarks</th><th></th>
      </tr></thead>
      <tbody></tbody>
    </table>`);
  const tbody = table.querySelector('tbody');
  state.staged.forEach((row,idx)=>{
    const tr = elRow(`
      <tr>
        <td><input value="${row.code}" data-f="code"/></td>
        <td><input value="${row.section}" data-f="section" style="width:40px"/></td>
        <td><input value="${row.title}" data-f="title" style="width:100%"/></td>
        <td><input value="${row.units}" data-f="units" style="width:36px"/></td>
        <td><input value="${row.days.join('')}" data-f="days" style="width:56px"/></td>
        <td><input value="${row.start!=null?minutesToLabel(row.start):''}" data-f="start" style="width:70px"/></td>
        <td><input value="${row.end!=null?minutesToLabel(row.end):''}" data-f="end" style="width:70px"/></td>
        <td><input value="${row.room}" data-f="room" style="width:70px"/></td>
        <td><input value="${row.remarks||''}" data-f="remarks" style="width:80px"/></td>
        <td><button class="danger small" data-del>×</button></td>
      </tr>`);
    tr.querySelectorAll('input').forEach(inp=>{
      const commit = ()=>{
        const f = inp.dataset.f;
        if(f==='days') row.days = parseDays(inp.value);
        else if(f==='start'||f==='end') row[f] = timeToMinutes(inp.value);
        else row[f] = inp.value;
      };
      inp.addEventListener('input', commit);
      inp.addEventListener('change', commit);
    });
    tr.querySelector('[data-del]').onclick = ()=>{ state.staged.splice(idx,1); renderStageTable(container); };
    tbody.appendChild(tr);
  });
  container.appendChild(table);
  const btnRow = el(`<div class="row" style="margin-top:12px;"><button class="gold" id="confirmAdd">Add ${state.staged.length} to shared catalog</button><span class="hint">Everyone with this link can pick from the catalog.</span></div>`);
  btnRow.querySelector('#confirmAdd').onclick = async ()=>{
    // Guard against double-clicks / repeated reimports stacking multiple
    // large writes on top of each other before the first one resolves —
    // that's what floods Firestore's write stream (resource-exhausted).
    const btn = btnRow.querySelector('#confirmAdd');
    if(btn.disabled) return;
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = 'Saving…';
    try{
      // Group meeting-rows sharing the same code+section into one entry —
      // this is what keeps a lecture+lab pair (or MWF+TH split) bundled together.
      const groups = new Map();
      state.staged.forEach(r=>{
        const key = catalogKey(r.code, r.section);
        if(!groups.has(key)){
          groups.set(key, {
            code: r.code, section: r.section, title: r.title, units: r.units,
            instructor: r.instructor, remarks: r.remarks, meetings: []
          });
        } else {
          // A section can span multiple staged rows (e.g. lecture + lab meeting
          // lines). Previously only the FIRST row's title/units/instructor/remarks
          // were kept — an edit made on a later row for the same section was
          // silently dropped. Any row can now update these shared fields.
          const g = groups.get(key);
          if(r.code) g.code = r.code;
          if(r.section) g.section = r.section;
          if(r.title) g.title = r.title;
          if(r.units) g.units = r.units;
          if(r.instructor) g.instructor = r.instructor;
          if(r.remarks) g.remarks = r.remarks;
        }
        groups.get(key).meetings.push({days: r.days, start: r.start, end: r.end, room: r.room});
      });
      // Re-importing a class that's already in the catalog REPLACES it in
      // place (same key = same code+section, matched case/whitespace-insensitively)
      // rather than duplicating it, and keeps the original id so anyone who
      // already added it keeps pointing at the corrected data instead of it
      // silently vanishing from their grid.
      let added=0, replaced=0;
      groups.forEach((entry, key)=>{
        const idx = state.catalog.findIndex(c => catalogKey(c.code, c.section) === key);
        if(idx>-1){ entry.id = state.catalog[idx].id; state.catalog[idx] = entry; replaced++; }
        else{ entry.id = 'c_'+Math.random().toString(36).slice(2,9); state.catalog.push(entry); added++; }
      });
      state.staged = [];
      await saveCatalog();
      render();
      const parts = [];
      if(added) parts.push(`${added} added`);
      if(replaced) parts.push(`${replaced} replaced`);
      showToast(`Catalog updated — ${parts.join(', ') || 'no changes'}.`);
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  };
  container.appendChild(btnRow);
}

/* ============================= ADD-CLASS SEARCH+DROPDOWN ============================= */
function renderAddClassBar(memberId, boardEl){
  const wrap = el(`
    <div class="panel">
      <h3>Add a class</h3>
      <div class="row">
        <div class="combo">
          <input type="text" id="searchInput" placeholder="Search by code, section, or professor, e.g. CSCI 30 or Dela Cruz..." autocomplete="off" />
          <div class="combo-list" id="comboList"></div>
        </div>
        <button class="ghost" id="manualToggle">+ Add Manually</button>
      </div>
      <div id="manualForm" style="display:none;margin-top:12px;"></div>
    </div>`);

  const input = wrap.querySelector('#searchInput');
  const list = wrap.querySelector('#comboList');

  function renderList(){
    const q = input.value.trim().toLowerCase();
    const terms = q.split(/\s+/).filter(Boolean);
    const matches = state.catalog.filter(c=>{
      const hay = (c.code+' '+c.section+' '+c.title+' '+(c.instructor||'')).toLowerCase();
      return terms.every(t=>hay.includes(t));
    });
    list.innerHTML = '';
    if(!state.catalog.length){
      list.innerHTML = `<div class="combo-empty">The shared catalog is empty. Import the public schedule above first.</div>`;
    } else if(!matches.length){
      list.innerHTML = `<div class="combo-empty">No matches. Try a different course code, or add manually.</div>`;
    } else {
      matches.forEach(c=>{
        const meta = (c.meetings||[]).map(m=>
          `${m.days.map(d=>DAY_LABEL[d]).join('/')} ${m.start!=null?minutesToLabel(m.start):''}${m.end!=null?' – '+minutesToLabel(m.end):''}${m.room?' · '+m.room:''}`
        ).join('; ') + (c.instructor ? ` · ${c.instructor}` : '');
        const remarkTag = c.remarks && c.remarks!=='-' ? ` <span style="color:var(--danger)">(${c.remarks})</span>` : '';

        // Clash check: everything already on this member's grid, excluding
        // other sections of the SAME course (so browsing alternate sections
        // of one class never falsely flags against itself).
        const existing = (state.schedules[memberId]||[])
          .map(entryFor).filter(Boolean)
          .filter(e => (e.code||'').trim() !== (c.code||'').trim());
        const clashes = existing.some(e => entriesConflict(c, e));
        const clashTag = clashes ? `<span class="clash-tag">clashes</span>` : '';

        const item = el(`<div class="combo-item">
          <div class="row" style="justify-content:space-between;gap:8px;">
            <span><span class="code">${c.code||'—'} ${c.section||''}</span>${c.title||''}${remarkTag}</span>
            ${clashTag}
          </div>
          <div class="meta">${meta}</div>
        </div>`);
        item.onclick = async ()=>{
          state.schedules[memberId] = state.schedules[memberId]||[];
          if(!state.schedules[memberId].includes(c.id)){
            const colorIdx = state.schedules[memberId].length;
            state.schedules[memberId].push(c.id);
            setBlockColor(memberId, c.id, PASTEL_COLORS[colorIdx % PASTEL_COLORS.length]);
            await saveBlockColors();
          }
          await saveSchedules();
          input.value=''; list.classList.remove('open');
          boardEl.__clearGhosts();
          render();
        };
        item.addEventListener('mouseenter', ()=>{
          boardEl.__clearGhosts();
          (c.meetings||[]).forEach(m=>{
            if(m.start==null||m.end==null||!m.days.length) return;
            m.days.forEach(day=>{
              const colIdx = DAY_ORDER.indexOf(day);
              if(colIdx<0) return;
              const top = ((m.start-BOARD_START)/30)*ROW_H;
              const height = Math.max(((m.end-m.start)/30)*ROW_H, 22);
              const ghost = el(`<div class="ghost-block ${clashes?'ghost-clash':''}" style="top:${top}px;height:${height}px;"></div>`);
              boardEl.__dayCols[colIdx].appendChild(ghost);
            });
          });
        });
        item.addEventListener('mouseleave', ()=> boardEl.__clearGhosts());
        list.appendChild(item);
      });
    }
  }
  input.addEventListener('focus', ()=>{
    if(input.value.trim().length){ renderList(); list.classList.add('open'); }
  });
  input.addEventListener('input', ()=>{
    if(input.value.trim().length){
      renderList();
      list.classList.add('open');
    } else {
      list.classList.remove('open');
      boardEl.__clearGhosts();
    }
  });
  document.addEventListener('click', (e)=>{
    if(!wrap.contains(e.target)){ list.classList.remove('open'); boardEl.__clearGhosts(); }
  });

  wrap.querySelector('#manualToggle').onclick = ()=>{
    const mf = wrap.querySelector('#manualForm');
    mf.style.display = mf.style.display==='none' ? 'block' : 'none';
    if(mf.style.display==='block') renderManualForm(mf, memberId);
  };

  return wrap;
}

  const form = el(`

      <input type="text" id="mCode" placeholder="Code (CSCI 30)" style="width:120px"/>
      <input type="text" id="mSec" placeholder="Sec" style="width:50px"/>

/* ============================= GROUPS ============================= */
function renderGroupsPanel(){
  const panel = el(`
    <div class="panel">
      <h3>Groups</h3>
      <div class="friend-manage" id="groupChipRow"></div>
      <div class="row" style="margin-top:8px;">
        <input type="text" id="newGroupName" placeholder="Group name — e.g. Blocktimers" style="width:220px"/>
        <button id="startGroupBtn">Create Group</button>
      </div>
      <div id="groupPicker" style="display:none;"></div>
      <p class="hint">Group people into custom sets — by block, org, or barkada — so Combined view can show just one set at a time instead of toggling everyone.</p>
    </div>`);

  const chipRow = panel.querySelector('#groupChipRow');
  const nameInput = panel.querySelector('#newGroupName');
  const picker = panel.querySelector('#groupPicker');
  let editingGroupId = null;
  let selected = new Set();

  function closePicker(){
    picker.style.display = 'none';
    picker.innerHTML = '';
    editingGroupId = null;
    selected = new Set();
  }

  function openPicker(existingGroup){
    editingGroupId = existingGroup ? existingGroup.id : null;
    selected = new Set(existingGroup ? existingGroup.memberIds : []);
    if(existingGroup) nameInput.value = existingGroup.name;
    picker.style.display = 'block';
    picker.innerHTML = '';
    picker.appendChild(el(`<p class="hint" style="margin:10px 0 6px;">${existingGroup?`Editing "${existingGroup.name}" — `:''}Who's in this group?</p>`));
    const row = el(`<div class="friend-manage"></div>`);
    state.members.forEach(m=>{
      const chip = el(`<div class="chip ${selected.has(m.id)?'active':''}"><span class="dot" style="background:${m.color}"></span>${m.name}${m.id===state.meId?' (you)':''}</div>`);
      chip.onclick = ()=>{
        if(selected.has(m.id)){ selected.delete(m.id); chip.classList.remove('active'); }
        else { selected.add(m.id); chip.classList.add('active'); }
      };
      row.appendChild(chip);
    });
    picker.appendChild(row);
    const btnRow = el(`<div class="row" style="margin-top:10px;"></div>`);
    const saveBtn = el(`<button class="gold">${existingGroup?'Save changes':'Save group'}</button>`);
    saveBtn.onclick = async ()=>{
      const name = nameInput.value.trim();
      if(!name || !selected.size) return;
      if(editingGroupId){
        const g = state.groups.find(x=>x.id===editingGroupId);
        if(g){ g.name = name; g.memberIds = [...selected]; }
      } else {
        state.groups.push({id:'g_'+Math.random().toString(36).slice(2,9), name, memberIds:[...selected]});
      }
      await saveGroups();
      closePicker();
      nameInput.value = '';
      render();
    };
    btnRow.appendChild(saveBtn);
    const cancelBtn = el(`<button class="ghost">Cancel</button>`);
    cancelBtn.onclick = ()=>{ closePicker(); };
    btnRow.appendChild(cancelBtn);
    picker.appendChild(btnRow);
  }

  state.groups.forEach(g=>{
    const chip = el(`<div class="chip">
      <span class="chip-label" title="Edit ${g.name}'s members">${g.name} <span style="opacity:.65;">(${g.memberIds.length})</span></span>
      <span class="rename-group" title="Rename Group">✎</span>
      <span class="x" title="Delete group">×</span>
    </div>`);
    chip.querySelector('.chip-label').onclick = ()=> openPicker(g);
    chip.querySelector('.rename-group').onclick = (e)=>{
      e.stopPropagation();
      openRenameGroupModal(g);
    };
    chip.querySelector('.x').onclick = async (e)=>{
      e.stopPropagation();
      const ok = await customConfirm(`Delete the group "${g.name}"?\n\nThis only removes the group itself — members and their classes are unaffected.`);
      if(!ok) return;
      state.groups = state.groups.filter(x=>x.id!==g.id);
      if(state.activeGroupId===g.id) state.activeGroupId = null;
      await saveGroups();
      if(editingGroupId===g.id) closePicker();
      render();
    };
    chipRow.appendChild(chip);
  });
  if(!state.groups.length){
    chipRow.appendChild(el(`<span class="hint" style="margin:0;">No groups yet.</span>`));
  }

  panel.querySelector('#startGroupBtn').onclick = ()=>{
    const name = nameInput.value.trim();
    if(!name) return;
    openPicker(null);
  };

  return panel;
}

/* ============================= TASKS TAB ============================= */
// Task tracker synced per class: the storage key for a subject's task list
// is derived from that subject's own code+section (the same catalogKey used
// for conflict-checking), NOT from any user id. So anyone who has that same
// class in their own schedule automatically loads and writes to the exact
// same shared list — no separate "who's in this class together" modeling
// needed. Tasks not tied to a real class ("Others") stay personal.
const TASK_STATUSES = ['Not Started','In Progress','Did Not Push','Completed'];
const TASK_ONSITE_OPTS = ['Onsite','Online','Both'];
function taskStatusColors(status){
  switch(status){
    case 'Did Not Push': return {bg:'#F3C6C6', fg:'#7A1E1E'};
    case 'Completed':    return {bg:'#D9F2D9', fg:'#2E5B22'};
    case 'In Progress':  return {bg:'#FFE7B0', fg:'#7A5A12'};
    default:              return {bg:'#D6EAF8', fg:'#274E70'}; // Not Started
  }
}
function taskOnsiteColors(onsite){
  switch(onsite){
    case 'Online': return {bg:'#E0D6F5', fg:'#4A2E7A'};
    case 'Both':   return {bg:'#FFD9A8', fg:'#7A4A12'};
    default:       return {bg:'#D9F2D9', fg:'#2E5B22'}; // Onsite
  }
}
function taskUrgencyColors(urgency){
  switch(urgency){
    case 'OVERDUE':       return {bg:'#7A1E1E', fg:'#FFFFFF'};
    case 'TODAY':         return {bg:'#E8862E', fg:'#FFFFFF'};
    case 'URGENT':        return {bg:'#F6D6D6', fg:'#7A1E1E'};
    case 'MID':           return {bg:'#FFE7B0', fg:'#7A5A12'};
    case 'RELAXED':       return {bg:'#D6EAF8', fg:'#274E70'};
    case 'COMPLETED':     return {bg:'#BEEFA9', fg:'#2E5B22'};
    case 'DID NOT PUSH':  return {bg:'#111111', fg:'#FFFFFF'};
    default:               return {bg:'transparent', fg:'var(--muted)'};
  }
}

// The list of subjects tasks can be filed under: every distinct class in
// the signed-in person's OWN schedule (this is what makes syncing "you
// have to actually be in the class" automatic), a synced "University Wide"
// bucket everyone shares regardless of schedule, any custom categories the
// user made for themselves, and a catch-all "Others".
const UNIVERSITY_WIDE_KEY = 'university-wide';
function taskSubjectOptions(){
  const entries = (state.schedules[state.meId]||[]).map(entryFor).filter(Boolean);
  const seen = new Set();
  const opts = [];
  entries.forEach(e=>{
    const key = catalogKey(e.code, e.section);
    if(seen.has(key)) return;
    seen.add(key);
    const label = `${e.code||''} ${e.section||''}`.trim() || 'Untitled class';
    opts.push({key, label});
  });
  opts.push({key:UNIVERSITY_WIDE_KEY, label:'University Wide'});
  (state.customCategories||[]).forEach(c=> opts.push({key:'custom:'+c.id, label:c.label}));
  opts.push({key:'others', label:'Others'});
  return opts;
}
// A "personal" subject key lives only in state.personalTasks and is never
// written to shared storage: the blank/unassigned bucket a brand-new task
// starts in, the "Others" catch-all, and any custom category the user made
// for themselves. Everything else (a real class, or University Wide) is a
// shared, synced list in state.tasks.
function isPersonalSubject(key){
  return key==='' || key==='others' || (typeof key==='string' && key.startsWith('custom:'));
}
function taskSubjectColor(label, allLabelsInOrder){
  const idx = allLabelsInOrder.indexOf(label);
  return PASTEL_COLORS[(idx<0?0:idx) % PASTEL_COLORS.length];
}

async function ensureTasksLoaded(){
  if(!state.__personalTasksLoaded){
    state.personalTasks = await loadTermScopedPersonal('personalTasks', []);
    state.personalStatuses = await loadTermScopedPersonal('taskStatuses', {});
    state.customCategories = await loadTermScopedPersonal('customCategories', []);
    state.__personalTasksLoaded = true;
  }
  const subjects = taskSubjectOptions().filter(s=>!isPersonalSubject(s.key));
  for(const s of subjects){
    if(!(s.key in state.tasks)){
      state.tasks[s.key] = await loadTermScopedShared(`tasks:${s.key}`, []);
    }
  }
}
async function saveCustomCategories(){
  await queueSave(()=> sSet(termScopedKey('customCategories'), state.customCategories, false));
}
async function saveSubjectTasks(key){
  await queueSave(()=> sSet(termScopedKey(`tasks:${key}`), state.tasks[key]||[], true));
}
async function savePersonalTasks(){
  await queueSave(()=> sSet(termScopedKey('personalTasks'), state.personalTasks, false));
}
async function saveTaskStatuses(){
  await queueSave(()=> sSet(termScopedKey('taskStatuses'), state.personalStatuses, false));
}
// A class's task LIST is shared (everyone in that class sees the same
// tasks), but each person's progress on it is their own — one classmate
// finishing a task shouldn't flip it to "Completed" for everyone else. So
// status for a shared-subject task lives in this personal, per-user map
// instead of on the shared task object itself. "Others" tasks are already
// fully personal (never synced to classmates), so their status just stays
// on the task like before.
function getEffectiveStatus(subjectKey, t){
  if(isPersonalSubject(subjectKey)) return t.status || 'Not Started';
  return state.personalStatuses[t.id] || t.status || 'Not Started';
}
async function setTaskStatus(subjectKey, taskId, status){
  if(isPersonalSubject(subjectKey)){ await updateTaskField(subjectKey, taskId, 'status', status); return; }
  state.personalStatuses[taskId] = status;
  await saveTaskStatuses();
}
// category is only meaningful for personal tasks: '' (not yet assigned a
// subject), 'others', or 'custom:{id}'. Shared class / University Wide
// tasks live in state.tasks[key] instead and don't need it.
function newTaskObj(category){
  return { id:'t_'+Math.random().toString(36).slice(2,9), task:'', status:'Not Started', onsite:'Onsite', dueDate:'', link:'', notes:'', category: category!==undefined?category:'' };
}
// New tasks always start personal and unassigned — the user picks a
// subject afterward from the pill in the row (a class, University Wide, a
// custom category, or Others).
async function addTask(){
  const t = newTaskObj('');
  state.personalTasks.unshift(t);
  await savePersonalTasks();
  render();
}
async function updateTaskField(subjectKey, taskId, field, value){
  const list = isPersonalSubject(subjectKey) ? state.personalTasks : (state.tasks[subjectKey]||[]);
  const t = list.find(x=>x.id===taskId);
  if(!t) return;
  t[field] = value;
  if(isPersonalSubject(subjectKey)) await savePersonalTasks(); else await saveSubjectTasks(subjectKey);
}
// Moving a task to a different subject means moving it between two
// different storage locations (possibly two different shared docs) —
// unless it's staying personal, in which case it's just a category swap
// within the same list.
async function moveTaskSubject(oldKey, taskId, newKey){
  const oldPersonal = isPersonalSubject(oldKey);
  const newPersonal = isPersonalSubject(newKey);
  if(oldPersonal && newPersonal){
    const t = state.personalTasks.find(x=>x.id===taskId);
    if(!t) return;
    t.category = newKey;
    await savePersonalTasks();
    render();
    return;
  }
  const oldList = oldPersonal ? state.personalTasks : (state.tasks[oldKey]||[]);
  const idx = oldList.findIndex(x=>x.id===taskId);
  if(idx<0) return;
  const [t] = oldList.splice(idx,1);
  if(oldPersonal) await savePersonalTasks(); else await saveSubjectTasks(oldKey);
  if(newPersonal){ t.category = newKey; state.personalTasks.push(t); await savePersonalTasks(); }
  else { state.tasks[newKey] = state.tasks[newKey]||[]; state.tasks[newKey].push(t); await saveSubjectTasks(newKey); }
  render();
}
async function deleteTask(subjectKey, taskId){
  if(isPersonalSubject(subjectKey)){ state.personalTasks = state.personalTasks.filter(x=>x.id!==taskId); await savePersonalTasks(); }
  else { state.tasks[subjectKey] = (state.tasks[subjectKey]||[]).filter(x=>x.id!==taskId); await saveSubjectTasks(subjectKey); }
  if(taskId in state.personalStatuses){ delete state.personalStatuses[taskId]; await saveTaskStatuses(); }
  render();
}
// Prompts for a name and adds a new personal, unsynced category that tasks
// can be filed under — for things that don't belong to any class.
function openNewCategoryModal(){
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal">

// Removing a custom category doesn't delete its tasks — they fall back to
// "Others" so nothing gets silently lost.
async function deleteCustomCategory(id){
  const cat = (state.customCategories||[]).find(c=>c.id===id);
  if(!cat) return;
  const ok = await customConfirm(`Delete the category "${cat.label}"?\n\nTasks filed under it will move to Others.`);
  if(!ok) return;
  const key = 'custom:'+id;
  state.personalTasks.forEach(t=>{ if(t.category===key) t.category = 'others'; });
  state.customCategories = state.customCategories.filter(c=>c.id!==id);
  await savePersonalTasks();
  await saveCustomCategories();
  render();
}
// Dedicated popover for the Subject pill: like openFieldPicker, but custom
// categories get an inline delete "×", and a "+ New Category" row sits at
// the bottom so adding one is right where you'd reach for it.
function openSubjectPicker(anchorEl, subjects, subjectLabels, onSelect){
  document.querySelectorAll('.field-popover').forEach(p=>p.remove());
  const rect = anchorEl.getBoundingClientRect();
  const width = Math.max(rect.width, 180);
  const left = Math.min(rect.left, window.innerWidth - width - 8);
  const popover = el(`<div class="field-popover" style="top:${rect.bottom+4}px;left:${Math.max(8,left)}px;width:${width}px;"></div>`);
  const closeHandler = (ev)=>{
    if(!popover.contains(ev.target) && ev.target!==anchorEl){
      popover.remove();
      document.removeEventListener('click', closeHandler);
    }
  };
  subjects.forEach(s=>{
    const isCustom = s.key.startsWith('custom:');
    const cc = taskSubjectColor(s.label, subjectLabels);
    const item = el(`<div class="field-popover-item${isCustom?' with-del':''}" style="background:${cc};color:#2A2E3D;"><span>${s.label}</span></div>`);
    item.onclick = (e)=>{ e.stopPropagation(); popover.remove(); document.removeEventListener('click', closeHandler); onSelect(s.key); };
    if(isCustom){
      const del = el(`<button type="button" class="field-popover-item-del" title="Delete category">×</button>`);
      del.onclick = async (e)=>{
        e.stopPropagation();
        popover.remove();
        document.removeEventListener('click', closeHandler);
        await deleteCustomCategory(s.key.slice(7));
      };
      item.appendChild(del);
    }
    popover.appendChild(item);
  });
  const addItem = el(`<div class="field-popover-item field-popover-add">+ New Category</div>`);
  addItem.onclick = (e)=>{ e.stopPropagation(); popover.remove(); document.removeEventListener('click', closeHandler); openNewCategoryModal(); };
  popover.appendChild(addItem);
  document.body.appendChild(popover);
  setTimeout(()=> document.addEventListener('click', closeHandler), 0);
}

// Mirrors the Excel formulas exactly:
//   Urgency: COMPLETED / DID NOT PUSH / blank / OVERDUE / TODAY / URGENT (≤5 days) / MID (≤7 days) / RELAXED
//   Rank: MATCH(date, SORT(UNIQUE(dates of everything not COMPLETED/DID NOT PUSH/blank)), 0)
//         — i.e. a dense rank shared by every task due on the same day, in ascending date order.
function computeTaskUrgencyAndRank(tasks){
  const today = new Date(); today.setHours(0,0,0,0);
  const msPerDay = 24*60*60*1000;

  const withUrgency = tasks.map(t=>{
    let urgency;
    if(t.status==='Completed') urgency = 'COMPLETED';
    else if(t.status==='Did Not Push') urgency = 'DID NOT PUSH';
    else if(!t.dueDate) urgency = '';
    else{
      const due = new Date(t.dueDate+'T00:00:00');
      const diffDays = Math.round((due-today)/msPerDay);
      if(diffDays<0) urgency = 'OVERDUE';
      else if(diffDays===0) urgency = 'TODAY';
      else if(diffDays<=5) urgency = 'URGENT';
      else if(diffDays<=7) urgency = 'MID';
      else urgency = 'RELAXED';
    }
    return {...t, urgency};
  });

  // Rank pool: every task with a due date that isn't COMPLETED/DID NOT PUSH — same FILTER as the sheet.
  const activeDates = [...new Set(withUrgency.filter(t=>t.dueDate && t.urgency!=='COMPLETED' && t.urgency!=='DID NOT PUSH').map(t=>t.dueDate))].sort();

  const decorated = withUrgency.map(t=>{
    let rank;
    if(t.urgency==='COMPLETED') rank='COMPLETED';
    else if(t.urgency==='DID NOT PUSH') rank='DID NOT PUSH';
    else if(!t.dueDate) rank='';
    else rank = activeDates.indexOf(t.dueDate)+1;
    return {...t, rank};
  });

  return decorated.sort((a,b)=>{
    // Completed tasks always sink to the bottom of the list, regardless of due date.
    const aDone = a.status==='Completed', bDone = b.status==='Completed';
    if(aDone !== bDone) return aDone ? 1 : -1;
    if(!a.dueDate && !b.dueDate) return 0;
    if(!a.dueDate) return -1;
    if(!b.dueDate) return 1;
    return a.dueDate.localeCompare(b.dueDate);
  });
}

function renderTasksTab(){
  const wrap = el(`<div></div>`);

  const subjects = taskSubjectOptions();
  const subjectLabels = subjects.map(s=>s.label);

  const merged = [];
  // Freshly added tasks start with no category at all — not yet filed
  // under any of the options above — so they need to show up too, with a
  // blank subject pill prompting the user to pick one. Pushed first so a
  // brand-new blank task lands at the very top of the table.
  state.personalTasks.filter(t=>!t.category).forEach(t=> merged.push({...t, status:getEffectiveStatus('', t), __subjectKey:'', __subjectLabel:''}));
  subjects.forEach(s=>{
    const list = isPersonalSubject(s.key) ? state.personalTasks.filter(t=>(t.category||'')===s.key) : (state.tasks[s.key]||[]);
    list.forEach(t=> merged.push({...t, status:getEffectiveStatus(s.key, t), __subjectKey:s.key, __subjectLabel:s.label}));
  });
  const decorated = computeTaskUrgencyAndRank(merged);

  // Urgent-tasks summary: everything due OVERDUE / TODAY / URGENT, ordered
  // earliest deadline first (decorated is already sorted by dueDate, which
  // rank tracks 1:1, so no extra sort is needed here).
  const urgentTasks = decorated.filter(t=> t.urgency==='OVERDUE' || t.urgency==='TODAY' || t.urgency==='URGENT');
  let urgentPanel = null;
  if(urgentTasks.length){
    urgentPanel = el(`<div class="urgent-panel" style="flex:1;min-width:280px;margin-bottom:0;">
      <div class="urgent-banner"><span class="dot"></span>Urgent Tasks</div>
      <div style="overflow-x:auto;">
        <table class="urgent-tasks">
          <thead><tr><th>Task</th><th>Subject</th><th>Due date</th><th>Rank</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>`);
    const utBody = urgentPanel.querySelector('tbody');
    urgentTasks.forEach(t=>{
      const uc = taskUrgencyColors(t.urgency);
      const tr = document.createElement('tr');

      const taskTd = document.createElement('td'); taskTd.className = 'ut-task'; taskTd.textContent = t.task || '';

      const subjTd = document.createElement('td');
      const subjPill = document.createElement('span'); subjPill.className = 'ut-subject-pill';
      subjPill.textContent = t.__subjectLabel || '';
      if(t.__subjectLabel){
        subjPill.style.background = taskSubjectColor(t.__subjectLabel, subjectLabels);
        subjPill.style.color = '#2A2E3D';
      }
      subjTd.appendChild(subjPill);

      const dueTd = document.createElement('td'); dueTd.className = 'ut-due'; dueTd.textContent = t.dueDate || '';

      const rankTd = document.createElement('td');
      const rankBadge = document.createElement('span'); rankBadge.className = 'ut-rank-badge';
      rankBadge.style.background = uc.bg; rankBadge.style.color = uc.fg;
      rankBadge.textContent = t.rank; rankTd.appendChild(rankBadge);

      tr.appendChild(taskTd); tr.appendChild(subjTd); tr.appendChild(dueTd); tr.appendChild(rankTd);
      utBody.appendChild(tr);
    });
  }

  // Completed-tasks count — small stat card, green to echo the Completed
  // status/urgency color used elsewhere in the tracker.
  const completedCount = decorated.filter(t=> t.urgency==='COMPLETED').length;
  const statCard = el(`<div class="stat-card" style="margin-bottom:0;align-self:flex-start;">
    <div class="stat-card-label">Completed Tasks 🎉</div>
    <div class="stat-card-value">${completedCount}</div>
  </div>`);

  if(urgentPanel || completedCount){
    const summaryRow = el(`<div class="row" style="align-items:flex-start;gap:16px;margin-bottom:18px;"></div>`);
    if(urgentPanel) summaryRow.appendChild(urgentPanel);
    summaryRow.appendChild(statCard);
    wrap.appendChild(summaryRow);
  }

  const panel = el(`<div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:8px;">
      <div class="row" style="gap:8px;">
        <button id="addTaskBtn">+ Add Task</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="tasks">
        <thead><tr>
          <th>Task</th><th>Status</th><th>Subject</th><th>Onsite or Online</th><th>Due date</th>
          <th>Urgency</th><th>Rank</th><th>Link to Task</th><th>Notes</th><th></th>
        </tr></thead>
        <tbody id="tasksBody"></tbody>
      </table>
    </div>
  </div>`);

  panel.querySelector('#addTaskBtn').onclick = ()=> addTask();

  const tbody = panel.querySelector('#tasksBody');
  if(!decorated.length){
    tbody.appendChild(elRow(`<tr><td colspan="10" class="hint" style="padding:14px 6px;">No tasks yet. Add one above, then use the Subject pill on the row to file it under a class (shared with classmates), University Wide (shared with everyone), a category of your own, or Others — the last two stay private to you.</td></tr>`));
  }
  decorated.forEach(t=>{
    const tr = elRow(`<tr></tr>`);

    const taskTd = elCell(`<td class="grow-cell task-name-cell"><textarea rows="1" placeholder="Task name"></textarea></td>`);
    const taskInput = taskTd.querySelector('textarea');
    taskInput.value = t.task || '';
    taskInput.oninput = ()=> autoResizeTextarea(taskInput);
    taskInput.onchange = (e)=> updateTaskField(t.__subjectKey, t.id, 'task', e.target.value);
    scheduleAutoResize(taskInput);
    tr.appendChild(taskTd);

    const statusTd = elCell(`<td></td>`);
    const statusBtn = el(`<button type="button" class="task-pill-btn"><span class="pill-label"></span><span class="pill-caret">▾</span></button>`);
    const statusLabel = statusBtn.querySelector('.pill-label');
    const paintStatus = ()=>{ const c=taskStatusColors(t.status); statusBtn.style.background=c.bg; statusBtn.style.color=c.fg; statusLabel.textContent=t.status; };
    paintStatus();
    statusBtn.onclick = (e)=>{
      e.stopPropagation();
      const items = TASK_STATUSES.map(s=>{ const c=taskStatusColors(s); return {value:s, label:s, bg:c.bg, fg:c.fg}; });
      openFieldPicker(statusBtn, items, async (val)=>{ await setTaskStatus(t.__subjectKey, t.id, val); render(); });
    };
    statusTd.appendChild(statusBtn); tr.appendChild(statusTd);

    const subjTd = elCell(`<td></td>`);
    const subjBtn = el(`<button type="button" class="task-pill-btn"><span class="pill-label"></span><span class="pill-caret">▾</span></button>`);
    if(t.__subjectLabel){
      const c = taskSubjectColor(t.__subjectLabel, subjectLabels);
      subjBtn.style.background = c; subjBtn.style.color = '#2A2E3D';
      subjBtn.querySelector('.pill-label').textContent = t.__subjectLabel;
    } else {
      subjBtn.style.background = 'transparent'; subjBtn.style.color = 'var(--muted)'; subjBtn.style.border = '1px dashed var(--muted)';
      subjBtn.querySelector('.pill-label').textContent = 'Choose subject';
    }
    subjBtn.onclick = (e)=>{
      e.stopPropagation();
      openSubjectPicker(subjBtn, subjects, subjectLabels, (val)=> moveTaskSubject(t.__subjectKey, t.id, val));
    };
    subjTd.appendChild(subjBtn); tr.appendChild(subjTd);

    const onsiteTd = elCell(`<td></td>`);
    const onsiteSel = el(`<select></select>`);
    TASK_ONSITE_OPTS.forEach(o=> onsiteSel.appendChild(el(`<option value="${o}" ${t.onsite===o?'selected':''}>${o}</option>`)));
    const paintOnsite = ()=>{ const c=taskOnsiteColors(onsiteSel.value); onsiteSel.style.background=c.bg; onsiteSel.style.color=c.fg; };
    paintOnsite();
    onsiteSel.onchange = ()=>{ paintOnsite(); updateTaskField(t.__subjectKey, t.id, 'onsite', onsiteSel.value); };
    onsiteTd.appendChild(onsiteSel); tr.appendChild(onsiteTd);

    const dueTd = createDueDateCell(t.dueDate, async (val)=>{ await updateTaskField(t.__subjectKey, t.id, 'dueDate', val); render(); });
    tr.appendChild(dueTd);

    const uc = taskUrgencyColors(t.urgency);
