// A real month calendar that layers three kinds of things onto each date:
//   - your OWN classes, recurring on their weekday from state.schedules[meId]
//     (there's no stored semester date range anywhere in this app, so a
//     class just shows on every matching weekday of whatever month is on
//     screen — see the comment on state.catalog for why)
//   - tasks/sidequests with a due date that falls in the shown month
//   - personal calendar events: either private (only sSet under your own
//     personal key, never leaves your account/browser) or shared, in which
//     case a copy is also written to the 'calendar_events' Firestore
//     collection with an invitedUids list so each invited account friend's
//     own Calendar tab can query and show it too. Sharing therefore only
//     works between signed-in accounts that are already account friends
//     (manual, non-account friends have no uid to invite).
function isoDate(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
// e.g. "10/20/2026" -> "Oct 20"
function fmtShortDate(iso){
  const [y,m,d] = (iso||'').split('-').map(Number);
  if(!y||!m||!d) return iso||'';
  return new Date(y, m-1, d).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
// Bounds class chips to the actual semester date range (from the existing
// semesterDateRange() used for .ics export) instead of showing a class on
// every matching weekday forever — see state.semesterType/schoolYear.
function isDateInActiveSemester(dateStr){
  const range = semesterDateRange(state.semesterType, state.schoolYear);
  if(!range) return true;
  const d = new Date(dateStr+'T00:00:00');
  return d >= range.start && d <= range.end;
}
// Unlike timeToMinutes() above (which guesses AM/PM for messy pasted class
// times), an <input type="time"> value is always unambiguous 24-hour
// "HH:MM" — so this parses it directly instead of reusing that heuristic,
// which would wrongly flip an early-morning event (e.g. "06:30") to PM.
function hhmmToMinutes(str){
  if(!str) return null;
  const m = str.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
const JS_DAY_TO_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayIso(){ const t=new Date(); return isoDate(t.getFullYear(), t.getMonth(), t.getDate()); }

// Events other account friends invited you to. Two separate queries
// (owner vs invitee) because Firestore compat can't OR across fields, so
// there's nothing to merge here — this is invitee-only.
async function loadReceivedEvents(){
  const uid = currentUid();
  if(!__db || !uid){ state.receivedEvents = []; return; }
  try{
    const snap = await __db.collection('calendar_events').where('invitedUids','array-contains',uid).get();
    state.receivedEvents = snap.docs.map(d=>({...d.data(), id:d.id, __remote:true}));
  }catch(e){ console.error('loadReceivedEvents failed', e); }
}
async function createCalendarEvent({title, date, endDate, time, notes, isPrivate, invitedMembers}){
  const uid = currentUid();
  const me = getMember(state.meId);
  const id = 'ev_'+Math.random().toString(36).slice(2,9);
  const invitedUids = isPrivate ? [] : (invitedMembers||[]).map(m=>m.remoteUid).filter(Boolean);
  const invitedNames = isPrivate ? [] : (invitedMembers||[]).map(m=>m.name);
  const endDateVal = (endDate && endDate>=date) ? endDate : date;
  const event = { id, title, date, endDate:endDateVal, time:time||'', notes:notes||'', private:!!isPrivate, invitedUids, invitedNames, ownerUid: uid||null, ownerName: me?me.name:'' };
  state.calendarEvents.push(event);
  await saveCalendarEvents();
  if(!isPrivate && invitedUids.length){
    if(__db && uid){
      try{
        await __db.collection('calendar_events').doc(id).set({
          ownerUid: uid, ownerName: me?me.name:'', title, date, endDate: endDateVal, time: time||'', notes: notes||'',
          invitedUids, invitedNames, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

    } else {
      showToast('Saved to your calendar, but sharing needs you to be signed in.');
    }
  }
  render();

// Multi-day events store a start `date` and an `endDate` (equal to `date`
// for single-day events, and absent on events saved before this feature
// existed — treated as single-day in that case).
function eventOccursOn(ev, dateStr){

  const end = ev.endDate || ev.date;
  return dateStr >= start && dateStr <= end;

    ? `${termRange.start.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${termRange.end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`
    : '';
  const header = el(`<div class="panel">
    <div class="row" style="align-items:center;flex-wrap:wrap;gap:10px;">
      <div style="flex:1 1 0;min-width:10px;"></div>
      <div class="row" style="align-items:center;justify-content:center;gap:10px;">
        <button class="ghost small" id="calPrev" title="Previous month">‹</button>
        <h3 style="margin:0;min-width:170px;text-align:center;">${monthName}</h3>
        <button class="ghost small" id="calNext" title="Next month">›</button>
        <button class="ghost small" id="calToday">Today</button>
      </div>
      <div style="flex:1 1 0;min-width:10px;display:flex;justify-content:flex-end;">
        <button id="calNewEvent">+ New Event</button>
      </div>
    </div>
  </div>`);
  header.querySelector('#calPrev').onclick = ()=>{
    state.calendarViewMonth--; if(state.calendarViewMonth<0){ state.calendarViewMonth=11; state.calendarViewYear--; }
    render();
  };
  header.querySelector('#calNext').onclick = ()=>{
    state.calendarViewMonth++; if(state.calendarViewMonth>11){ state.calendarViewMonth=0; state.calendarViewYear++; }
    render();
  };
  header.querySelector('#calToday').onclick = ()=>{
    const t = new Date(); state.calendarViewYear=t.getFullYear(); state.calendarViewMonth=t.getMonth(); render();
  };
  header.querySelector('#calNewEvent').onclick = ()=> openNewEventModal(todayIso());
  wrap.appendChild(header);

  const classEntries = calendarClassEntries();
  const taskItems = calendarTaskItems();
  const eventItems = calendarEventItems();
  const today = todayIso();

  const gridPanel = el(`<div class="panel cal-panel"></div>`);
  const grid = el(`<div class="cal-grid"></div>`);
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=> grid.appendChild(el(`<div class="cal-dow">${d}</div>`)));

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();

  for(let i=0;i<startOffset;i++) grid.appendChild(el(`<div class="cal-cell cal-cell-empty"></div>`));

  for(let d=1; d<=daysInMonth; d++){
    const dateStr = isoDate(year, month, d);
    const dow = JS_DAY_TO_ABBR[new Date(year, month, d).getDay()];
    const holidayInfo = getHoliday(dateStr);
    const holiday = !!holidayInfo;
    const dayClasses = [];
    if(isDateInActiveSemester(dateStr) && !holiday){
      classEntries.forEach(e=>{
        (e.meetings||[]).forEach(m=>{
          if((m.days||[]).includes(dow)) dayClasses.push({entry:e, meeting:m});
        });
      });
    }
    const dayTasks = taskItems.filter(t=>t.date===dateStr);
    const dayEvents = eventItems.filter(ev=>eventOccursOn(ev, dateStr));

    const cell = el(`<div class="cal-cell ${dateStr===today?'cal-cell-today':''} ${holiday?'cal-cell-holiday':''}"><div class="cal-daynum">${d}</div><div class="cal-chips"></div></div>`);
    const chipsWrap = cell.querySelector('.cal-chips');
    const allChips = [];
    if(holiday) allChips.push({text:holidayInfo.label||'Holiday', cls:'cal-chip-holiday'});
    dayClasses.forEach(({entry})=> allChips.push({text:`${entry.code||''} ${entry.section||''}`.trim()||'Class', cls:'cal-chip-class'}));
    dayTasks.forEach(t=> allChips.push({text:t.title, cls: (t.kind==='sidequest'?'cal-chip-sidequest':'cal-chip-task')+(t.completed?' cal-chip-completed':'')}));
    dayEvents.forEach(ev=> allChips.push({text:ev.title, cls: ev.private?'cal-chip-event-private':'cal-chip-event-shared'}));
    const maxShown = 3;
    allChips.slice(0,maxShown).forEach(c=> chipsWrap.appendChild(el(`<div class="cal-chip ${c.cls}">${(c.text||'').replace(/</g,'&lt;')}</div>`)));
    if(allChips.length>maxShown) chipsWrap.appendChild(el(`<div class="cal-chip cal-chip-more">+${allChips.length-maxShown} more</div>`));
    cell.onclick = ()=> openDayAgendaModal(dateStr, dayClasses, dayTasks, dayEvents);
    grid.appendChild(cell);
  }
  gridPanel.appendChild(grid);
  wrap.appendChild(gridPanel);

  return wrap;
}

function openDayAgendaModal(dateStr, dayClasses, dayTasks, dayEvents){
  const niceDate = new Date(dateStr+'T00:00:00').toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const holidayInfo = getHoliday(dateStr);
  const holiday = !!holidayInfo;
  const backdrop = el(`<div class="modal-backdrop">
    <div class="modal" style="width:380px;text-align:left;max-height:80vh;overflow:auto;">
      <h2 style="text-align:center;">${niceDate}</h2>
      ${holiday?'<p class="hint" style="text-align:center;color:#7A2020;font-weight:600;margin-top:-8px;">🚫 '+((holidayInfo.label||'Holiday').replace(/</g,'&lt;'))+'</p>':''}
      <div id="agendaList"></div>
      <div class="row" style="justify-content:center;margin-top:16px;flex-wrap:wrap;">
        <button class="ghost" id="agendaClose">Close</button>
        <button class="ghost" id="agendaHoliday">${holiday?'Edit holiday':'Mark as holiday'}</button>
        <button id="agendaNew">+ New Event This Day</button>
      </div>
    </div>
  </div>`);
  const list = backdrop.querySelector('#agendaList');

  if(!dayClasses.length && !dayTasks.length && !dayEvents.length){
    list.appendChild(el(`<p class="hint" style="margin:0;">Nothing on the calendar for this day yet.</p>`));
  }
  dayClasses.forEach(({entry,meeting})=>{
    list.appendChild(el(`<div class="agenda-row">
      <span class="cal-chip cal-chip-class" style="flex:none;">Class</span>
      <div><b>${(entry.code||'')+' '+(entry.section||'')}</b>${entry.title?' — '+entry.title:''}<br/>
      <span class="hint" style="margin:0;">${meeting.start!=null?minutesToLabel(meeting.start):''}${meeting.end!=null?' – '+minutesToLabel(meeting.end):''}${meeting.room?' · '+meeting.room:''}</span></div>
    </div>`));
  });
  dayTasks.forEach(t=>{
    list.appendChild(el(`<div class="agenda-row">
      <span class="cal-chip ${t.kind==='sidequest'?'cal-chip-sidequest':'cal-chip-task'}" style="flex:none;">${t.kind==='sidequest'?'Sidequest':'Task'}</span>
      <div><b${t.completed?' style="text-decoration:line-through;opacity:0.55;"':''}>${(t.title||'').replace(/</g,'&lt;')}</b>${t.completed?' <span class="hint" style="margin:0;">✓ Completed</span>':''}${t.label?'<br/><span class="hint" style="margin:0;">'+t.label.replace(/</g,'&lt;')+'</span>':''}</div>
    </div>`));
  });
  dayEvents.forEach(ev=>{
    const row = el(`<div class="agenda-row">
      <span class="cal-chip ${ev.private?'cal-chip-event-private':'cal-chip-event-shared'}" style="flex:none;">${ev.private?'Private':'Shared'}</span>
      <div style="flex:1;"><b>${(ev.title||'').replace(/</g,'&lt;')}</b><br/>
      <span class="hint" style="margin:0;">${(ev.endDate && ev.endDate!==ev.date)?(fmtShortDate(ev.date)+' – '+fmtShortDate(ev.endDate)+' · '):''}${ev.time?minutesToLabel(hhmmToMinutes(ev.time))+' · ':''}${ev.__mine?'You':ev.ownerName||'Friend'}${(!ev.private && ev.invitedNames && ev.invitedNames.length)?' · with '+ev.invitedNames.join(', '):''}</span>
      ${ev.notes?'<br/><span class="hint" style="margin:0;">'+ev.notes.replace(/</g,'&lt;')+'</span>':''}</div>
    </div>`);
    if(ev.__mine){
      const del = el(`<button class="danger small" title="Delete event">×</button>`);
      del.onclick = async (e)=>{ e.stopPropagation(); backdrop.remove(); await deleteCalendarEvent(ev); };
      row.appendChild(del);
    }
    list.appendChild(row);
  });

  backdrop.querySelector('#agendaClose').onclick = ()=> backdrop.remove();
  backdrop.querySelector('#agendaNew').onclick = ()=>{ backdrop.remove(); openNewEventModal(dateStr); };
  backdrop.querySelector('#agendaHoliday').onclick = ()=>{ backdrop.remove(); openHolidayModal(dateStr); };
  backdrop.onclick = (e)=>{ if(e.target===backdrop) backdrop.remove(); };
  document.body.appendChild(backdrop);
}

        </div>

      </div>
      <label class="hint" style="display:block;margin:12px 0 4px;">Notes</label>
      <textarea id="evNotes" rows="2" placeholder="Optional details" style="width:100%;"></textarea>

      <div style="margin-top:14px;">
        <label class="hint" style="display:block;margin-bottom:6px;">Who can see this?</label>
        <div class="row" style="gap:16px;">
          <label class="row" style="gap:6px;align-items:center;cursor:pointer;"><input type="radio" name="evVis" value="private" checked style="width:auto;margin:0;flex:none;"/> Only me</label>
          <label class="row" style="gap:6px;align-items:center;cursor:pointer;"><input type="radio" name="evVis" value="shared" style="width:auto;margin:0;flex:none;"/> Invite friends</label>
        </div>
      </div>
      <div id="evFriendsWrap" style="display:none;margin-top:10px;max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;"></div>

      <div class="row" style="justify-content:center;margin-top:18px;">
        <button class="ghost" id="evCancel">Cancel</button>
        <button id="evSave">Create Event</button>
      </div>
    </div>
  </div>`);

  let dateVal = prefillDate || todayIso();
  const dateWrap = backdrop.querySelector('#evDateWrap');
  const dateField = createDueDateField(dateVal, (val)=>{
    dateVal = val;
    if(endDateVal && endDateVal < dateVal){
      endDateVal = dateVal;
      endDateField.querySelector('.due-date-text').value = isoToTyped(endDateVal);
      endDateField.querySelector('.due-date-native').value = endDateVal;
    }
  });
  dateWrap.appendChild(dateField);

  let endDateVal = dateVal;
  const endDateWrap = backdrop.querySelector('#evEndDateWrap');
  const endDateInner = backdrop.querySelector('#evEndDateInner');
  const endDateField = createDueDateField(endDateVal, (val)=>{ endDateVal = val; });
  endDateInner.appendChild(endDateField);
  backdrop.querySelector('#evMultiDay').onchange = (e)=>{
    endDateWrap.style.display = e.target.checked ? 'block' : 'none';
    if(!e.target.checked) endDateVal = dateVal;
  };

  const friends = invitableFriends();
  const friendsWrap = backdrop.querySelector('#evFriendsWrap');
  if(friends.length){
    friends.forEach(f=>{
      const row = el(`<label class="row" style="gap:8px;align-items:center;padding:5px 4px;cursor:pointer;">
        <input type="checkbox" value="${f.id}" style="width:auto;margin:0;flex:none;"/> <span>${f.name}</span>
      </label>`);
      friendsWrap.appendChild(row);
    });
  } else {
    friendsWrap.appendChild(el(`<p class="hint" style="margin:0;">You don't have any account friends yet to invite — add one from the Friends tab. (Manual, non-account friends can't receive invites.)</p>`));
  }

  backdrop.querySelectorAll('input[name="evVis"]').forEach(r=>{
    r.onchange = ()=>{
      const shared = backdrop.querySelector('input[name="evVis"]:checked').value==='shared';
      friendsWrap.style.display = shared ? 'block' : 'none';
    };
  });

  backdrop.querySelector('#evCancel').onclick = ()=> backdrop.remove();
  backdrop.onclick = (e)=>{ if(e.target===backdrop) backdrop.remove(); };
  backdrop.querySelector('#evSave').onclick = async ()=>{
    const title = backdrop.querySelector('#evTitle').value.trim();
    if(!title){ showToast('Give the event a title first.'); return; }
    if(!dateVal){ showToast('Pick a valid date.'); return; }
    const isMultiDay = backdrop.querySelector('#evMultiDay').checked;
    const endDate = isMultiDay ? (endDateVal || dateVal) : dateVal;
    if(isMultiDay && endDate < dateVal){ showToast('End date must be on or after the start date.'); return; }
    const time = backdrop.querySelector('#evTime').value;
    const notes = backdrop.querySelector('#evNotes').value.trim();
    const isPrivate = backdrop.querySelector('input[name="evVis"]:checked').value==='private';

    const invitedMembers = invitedIds.map(id=> state.members.find(m=>m.id===id)).filter(Boolean);
    backdrop.remove();
    await createCalendarEvent({title, date:dateVal, endDate, time, notes, isPrivate, invitedMembers});
  };

  document.body.appendChild(backdrop);
  backdrop.querySelector('#evTitle').focus();
}

// Search-by-name + pending requests UI for real account friends. Only
// meaningful when signed in — search/requests need a directory entry and a
// uid to attach requests to, neither of which a guest has.
function renderAccountFriendsPanel(){
  if(!__auth){ return el(`<div></div>`); } // accounts not configured for this deployment at all
  if(!currentUid()){
    return el(`<div class="panel"><h3>Add Friends by Account</h3><p class="hint">Sign in (👤 in the header) to search for friends by name — once you're both signed in and connected, you'll automatically see each other's schedule here.</p></div>`);
  }

  const panel = el(`
    <div class="panel">
      <h3>Add Friends by Account</h3>
      <div class="row">
        <input type="text" id="friendSearchInput" placeholder="Search by name…" style="width:200px"/>
        <button id="friendSearchBtn">Search</button>
      </div>
      <div id="friendSearchResults" class="row" style="flex-wrap:wrap;margin-top:8px;"></div>
      <div id="friendReqSections"></div>
    </div>`);

  const searchInput = panel.querySelector('#friendSearchInput');
  const resultsEl = panel.querySelector('#friendSearchResults');
  const doSearch = async ()=>{
    const q = searchInput.value;
    if(!q.trim()){ resultsEl.innerHTML=''; return; }
    resultsEl.innerHTML = '';
    resultsEl.appendChild(el(`<span class="hint" style="margin:0;">Searching…</span>`));
    const results = await searchDirectory(q);
    const alreadyFriends = new Set(state.members.filter(m=>m.isAccountFriend).map(m=>m.remoteUid));
    const pendingOut = new Set(state.outgoingRequests.map(r=>r.to));
    resultsEl.innerHTML = '';
    if(!results.length){
      resultsEl.appendChild(el(`<span class="hint" style="margin:0;">No one found with that name.</span>`));
      return;
    }
    results.forEach(u=>{
      const already = alreadyFriends.has(u.uid);
      const pending = pendingOut.has(u.uid);
      const row = el(`<div class="chip" style="cursor:default;"><span>${u.name}</span></div>`);
      if(already){
        row.appendChild(el(`<span class="hint" style="margin:0 0 0 6px;">Already friends</span>`));
      } else if(pending){
        row.appendChild(el(`<span class="hint" style="margin:0 0 0 6px;">Requested</span>`));
      } else {
        const btn = el(`<button style="padding:4px 10px;font-size:11.5px;margin-left:6px;">Add</button>`);
        btn.onclick = async ()=>{
          btn.disabled = true; btn.textContent = '…';
          const result = await sendFriendRequest(u.uid, u.name);
          if(result==='error'){ btn.disabled=false; btn.textContent='Add'; return; }
          await loadFriendsData();
          render();
        };
        row.appendChild(btn);
      }
      resultsEl.appendChild(row);
    });
  };
  panel.querySelector('#friendSearchBtn').onclick = doSearch;
  searchInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

  const reqSections = panel.querySelector('#friendReqSections');
  if(state.incomingRequests.length){
    const sec = el(`<div style="margin-top:16px;"><h3 style="margin-bottom:10px;">Friend requests</h3><div class="fr-list"></div></div>`);
    const list = sec.querySelector('.fr-list');
    state.incomingRequests.forEach(r=>{
      const initials = (r.fromName||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
      const card = el(`<div class="fr-card">
        <div class="fr-avatar">${initials}</div>
        <div class="fr-info">
          <div class="fr-name">${r.fromName}</div>
          <div class="fr-sub">Sent you a friend request</div>
        </div>
        <div class="fr-actions">
          <button class="fr-btn fr-decline">Decline</button>
          <button class="fr-btn fr-accept">Accept</button>
        </div>
      </div>`);
      card.querySelector('.fr-accept').onclick = ()=> acceptFriendRequest(r);
      card.querySelector('.fr-decline').onclick = ()=> declineFriendRequest(r);
      list.appendChild(card);
    });
    reqSections.appendChild(sec);
  }
  if(state.outgoingRequests.length){
    const sec = el(`<div style="margin-top:16px;"><h3 style="margin-bottom:10px;">Sent requests</h3><div class="fr-list"></div></div>`);
    const list = sec.querySelector('.fr-list');
    state.outgoingRequests.forEach(r=>{
      const initials = (r.toName||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
      const card = el(`<div class="fr-card">
        <div class="fr-avatar" style="background:var(--gold);color:var(--gold-ink);">${initials}</div>
        <div class="fr-info">
          <div class="fr-name">${r.toName}</div>
          <div class="fr-sub">Waiting for them to accept</div>
        </div>
        <div class="fr-actions">
          <button class="fr-btn fr-cancel">Cancel</button>
        </div>
      </div>`);
      card.querySelector('.fr-cancel').onclick = ()=> cancelOutgoingRequest(r);
      list.appendChild(card);
    });
    reqSections.appendChild(sec);
  }
  return panel;
}

// Read-only board for an account friend — their real "My Schedule", never
// editable here since it isn't your data.
function renderReadOnlyFriendBoard(memberId){
  const m = getMember(memberId);
  const entries = (state.schedules[memberId]||[]).map(entryFor).filter(Boolean);
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="panel"><h3>${m.name}'s schedule</h3><p class="hint" style="margin:0;">This is ${m.name}'s own account schedule — read-only.</p></div>`));
  if(!entries.length){
    wrap.appendChild(el(`<div class="empty">${m.name} hasn't added any classes yet.</div>`));
    return wrap;
  }
  wrap.appendChild(renderBoard([{member:m, color:m.color, entries}], false));
  return wrap;
}

function renderFriendsTab(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderAccountFriendsPanel());

  const manage = el(`
    <div class="panel">
      <h3>Your Friends</h3>
      <div class="friend-manage" id="chipRow"></div>
      <div class="row">
        <input type="text" id="friendName" placeholder="Friend's name" style="width:200px"/>
        <button id="addFriend">Add Friend</button>
      </div>
      <p class="hint">Friends connected by account (👥, from above) sync automatically. Add someone here to type in their classes yourself instead — saved to your own browser only.</p>
    </div>`);
  const chipRow = manage.querySelector('#chipRow');
  state.members.forEach(m=>{
    const isMe = m.id===state.meId;
    const colorLabel = isMe ? 'your' : `${m.name}'s`;
    const removeTitle = m.isAccountFriend ? `Unfriend ${m.name}` : `Remove ${m.name}`;
    const chip = el(`<div class="chip ${!isMe && state.friendEditingId===m.id?'active':''}">
      <button class="chip-dot" style="background:${m.color}" title="Change ${colorLabel} color"></button>
      <span class="chip-label" style="${isMe?'cursor:default;':''}">${m.name}${isMe?' (you)':''}${m.isAccountFriend?' 👥':''}</span>
      ${isMe?'':`<span class="x" title="${removeTitle}">×</span>`}
    </div>`);
    if(!isMe){
      chip.querySelector('.chip-label').onclick = ()=>{ state.friendEditingId = m.id; render(); };
    }
    const dotBtn = chip.querySelector('.chip-dot');
    dotBtn.onclick = (e)=>{
      e.stopPropagation();
      openColorPicker(dotBtn, MEMBER_COLORS, async (color)=>{
        m.color = color;
        await saveMembers();
        render();
      }, m.color);
    };
    if(!isMe){
      chip.querySelector('.x').onclick = async (e)=>{
        e.stopPropagation();
        if(m.isAccountFriend){ await unfriendAccount(m.remoteUid); return; }
        const ok = await customConfirm(`Remove ${m.name} entirely?\n\nTheir added classes will be deleted too, and they'll be taken out of any groups. This can't be undone.`);
        if(!ok) return;
        await removeMember(m.id);
        render();
      };
    }
    chipRow.appendChild(chip);
  });
  manage.querySelector('#addFriend').onclick = async ()=>{
    const val = manage.querySelector('#friendName').value.trim();
    if(!val) return;
    const id = 'm_'+Math.random().toString(36).slice(2,9);
    const color = colorForIndex(state.members.length);
    state.members.push({id,name:val,color});
    state.schedules[id]=[]; state.manualEntries[id]={};
    await saveMembers(); await saveSchedules(); await saveManual();
    state.friendEditingId = id;
    render();
  };
  wrap.appendChild(manage);
  wrap.appendChild(renderGroupsPanel());

  if(!state.members.filter(m=>m.id!==state.meId).length){
    wrap.appendChild(el(`<div class="empty">No friends yet. Search for one above, or add one manually to start building their schedule.</div>`));
    return wrap;
  }
  if(!state.friendEditingId || !getMember(state.friendEditingId)){
    state.friendEditingId = state.members.find(m=>m.id!==state.meId).id;
  }
  const editingMember = getMember(state.friendEditingId);
  wrap.appendChild(editingMember.isAccountFriend ? renderReadOnlyFriendBoard(state.friendEditingId) : renderMemberEditor(state.friendEditingId));
  return wrap;
}

/* ============================= COMBINED TAB ============================= */
function renderCombinedTab(){
  const wrap = el(`<div></div>`);
  if(state.combinedOn.size===0){ state.members.forEach(m=>state.combinedOn.add(m.id)); }

  if(state.groups.length){
    const groupRow = el(`<div class="panel"><h3>View a group</h3><div class="row" id="groupFilterRow"></div></div>`);
    const gRow = groupRow.querySelector('#groupFilterRow');
    const everyoneChip = el(`<div class="chip ${state.activeGroupId===null?'active':''}">Everyone</div>`);
    everyoneChip.onclick = ()=>{
      state.activeGroupId = null;
      state.combinedOn = new Set(state.members.map(m=>m.id));
      render();
    };
    gRow.appendChild(everyoneChip);
    state.groups.forEach(g=>{
      const chip = el(`<div class="chip ${state.activeGroupId===g.id?'active':''}">${g.name}</div>`);
      chip.onclick = ()=>{
        state.activeGroupId = g.id;
        state.combinedOn = new Set(g.memberIds);
        render();
      };
      gRow.appendChild(chip);
    });
    wrap.appendChild(groupRow);
  }

  const toggleRow = el(`<div class="panel"><h3>Show on combined view</h3><div class="row" id="toggles"></div></div>`);
  const toggles = toggleRow.querySelector('#toggles');
  state.members.forEach(m=>{
    const on = state.combinedOn.has(m.id);
    const isMe = m.id===state.meId;
    const colorLabel = isMe ? 'your' : `${m.name}'s`;
    const chip = el(`<div class="chip ${on?'active':''}">
      <button class="chip-dot" style="background:${m.color}" title="Change ${colorLabel} color"></button>
      <span class="chip-label">${m.name}${isMe?' (you)':''}</span>
    </div>`);
    chip.querySelector('.chip-label').onclick = ()=>{
      state.activeGroupId = null; // manual adjustment no longer matches a preset group exactly
      if(state.combinedOn.has(m.id)) state.combinedOn.delete(m.id); else state.combinedOn.add(m.id);
      render();
    };
    const dotBtn = chip.querySelector('.chip-dot');
    dotBtn.onclick = (e)=>{
      e.stopPropagation();
      openColorPicker(dotBtn, MEMBER_COLORS, async (color)=>{
        m.color = color;
        await saveMembers();
        render();
      }, m.color);
    };
    toggles.appendChild(chip);
  });
  wrap.appendChild(toggleRow);

  const boardGroups = state.members.filter(m=>state.combinedOn.has(m.id)).map(m=>({
    member:m, color:m.color, entries:(state.schedules[m.id]||[]).map(entryFor).filter(Boolean)
  }));

  if(!boardGroups.length || boardGroups.every(g=>!g.entries.length)){
    wrap.appendChild(el(`<div class="empty">Nothing to show yet. Turn on a member above, and make sure they've added classes.</div>`));
    return wrap;
  }

  const legend = el(`<div class="legend"></div>`);
  boardGroups.forEach(g=>legend.appendChild(el(`<div class="item"><span class="dot" style="background:${g.color}"></span>${g.member.name}</div>`)));
  wrap.appendChild(legend);
  wrap.appendChild(renderBoard(boardGroups, false));

  const wpRow = el(`<div class="row" style="margin-top:14px;">
    <button class="ghost" id="makeCombinedWallpaperBtn">⬇️ Download combined schedule</button>
  </div>`);
  wpRow.querySelector('#makeCombinedWallpaperBtn').onclick = ()=> openWallpaperBuilder(boardGroups);
  wrap.appendChild(wpRow);

  // ---------- Find a Free Time ----------
  // Uses exactly the people currently shown above (Everyone / a group /
  // whichever chips are toggled on) — no separate person picker needed.
  if(state.freeTime.results){
    // Keep results in sync with the latest filters/selection on every
    // re-render, so toggling a person or a filter after already finding a
    // time updates the list instead of showing a stale answer.
    state.freeTime.results = findFreeTimes(boardGroups, {
      days: state.freeTime.days, startMin: state.freeTime.startMin,
      endMin: state.freeTime.endMin, minMinutes: state.freeTime.minMinutes
    });
  }

  const ftPanel = el(`<div class="panel" style="margin-top:18px;">
    <h3>Find a Free Time</h3>
    <p class="hint" style="margin:0 0 12px;">Finds gaps where none of the people shown above have a class.</p>

    <div class="row" style="margin-bottom:10px;align-items:center;">
      <span class="hint" style="margin:0;width:64px;">Days</span>
      <div class="row" id="ftDaysRow" style="gap:6px;"></div>
    </div>

    <div class="row" style="margin-bottom:10px;align-items:center;">
      <span class="hint" style="margin:0;width:64px;">Time</span>
      <input type="time" id="ftStart" value="${minutesToHHMM(state.freeTime.startMin)}"
        style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:'Poppins',sans-serif;font-size:calc(13px * var(--font-scale));"/>
      <span class="hint" style="margin:0;">to</span>
      <input type="time" id="ftEnd" value="${minutesToHHMM(state.freeTime.endMin)}"
        style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:'Poppins',sans-serif;font-size:calc(13px * var(--font-scale));"/>
    </div>

    <div class="row" style="margin-bottom:14px;align-items:center;">
      <span class="hint" style="margin:0;width:64px;">Minimum</span>
      <select id="ftMinDur" style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:'Poppins',sans-serif;font-size:calc(13px * var(--font-scale));cursor:pointer;"></select>
    </div>

    <button id="ftFindBtn">Find free time</button>
    <div id="ftResults"></div>
  </div>`);

  const daysRowEl = ftPanel.querySelector('#ftDaysRow');
  DAY_ORDER.forEach(d=>{
    const active = state.freeTime.days.includes(d);
    const chip = el(`<div class="chip ${active?'active':''}">${DAY_LABEL[d]}</div>`);
    chip.onclick = ()=>{
      const idx = state.freeTime.days.indexOf(d);
      if(idx>=0) state.freeTime.days.splice(idx,1); else state.freeTime.days.push(d);
      render();
    };
    daysRowEl.appendChild(chip);
  });

  ftPanel.querySelector('#ftStart').onchange = (e)=>{
    if(!e.target.value) return;
    const [h,m] = e.target.value.split(':').map(Number);
    state.freeTime.startMin = h*60+m;
    render();
  };
  ftPanel.querySelector('#ftEnd').onchange = (e)=>{
    if(!e.target.value) return;
    const [h,m] = e.target.value.split(':').map(Number);
    state.freeTime.endMin = h*60+m;
    render();
  };

  const MIN_DUR_OPTS = [
    {value:15, label:'15 minutes'}, {value:30, label:'30 minutes'}, {value:45, label:'45 minutes'},
    {value:60, label:'1 hour'}, {value:90, label:'1.5 hours'}, {value:120, label:'2 hours'}, {value:180, label:'3 hours'}
  ];
  const minDurSelect = ftPanel.querySelector('#ftMinDur');
  MIN_DUR_OPTS.forEach(o=> minDurSelect.appendChild(el(`<option value="${o.value}" ${state.freeTime.minMinutes===o.value?'selected':''}>${o.label}</option>`)));
  minDurSelect.onchange = ()=>{ state.freeTime.minMinutes = Number(minDurSelect.value); render(); };

  ftPanel.querySelector('#ftFindBtn').onclick = ()=>{
    state.freeTime.results = findFreeTimes(boardGroups, {
      days: state.freeTime.days, startMin: state.freeTime.startMin,
      endMin: state.freeTime.endMin, minMinutes: state.freeTime.minMinutes
    });
    render();
  };

  const ftResultsEl = ftPanel.querySelector('#ftResults');
  if(state.freeTime.results){
    ftResultsEl.style.marginTop = '14px';
    if(!state.freeTime.days.length){
      ftResultsEl.appendChild(el(`<p class="hint" style="margin:0;">Pick at least one day above.</p>`));
    } else if(state.freeTime.startMin >= state.freeTime.endMin){
      ftResultsEl.appendChild(el(`<p class="hint" style="margin:0;">The start time needs to be before the end time.</p>`));
    } else if(!state.freeTime.results.length){
      ftResultsEl.appendChild(el(`<p class="hint" style="margin:0;">No shared free time that long was found in that window — try widening the time range, lowering the minimum, or picking fewer people.</p>`));
    } else {
      const list = el(`<div style="display:flex;flex-direction:column;gap:10px;"></div>`);
      state.freeTime.results.forEach(r=>{
        const row = el(`<div></div>`);
        row.appendChild(el(`<div style="font-size:calc(13.5px * var(--font-scale));color:var(--ink);">
          <b>${DAY_FULL[r.day]}</b> — ${minutesToLabel(r.start)} – ${minutesToLabel(r.end)}
        </div>`));

        const waiters = longWaitersForSlot(boardGroups, r);
        if(waiters.length){
          const names = waiters.map(w=>`${w.name} (${minutesToDuration(w.waitMinutes)})`).join(', ');
          row.appendChild(el(`<div class="hint" style="margin:2px 0 0;color:var(--danger);">⚠️ Long wait: ${names}</div>`));
        }

        const noClassPeople = boardGroups.filter(g=> !personDayIntervals(g.entries, r.day).length).map(g=>g.member.name);
        if(noClassPeople.length){
          row.appendChild(el(`<div class="hint" style="margin:2px 0 0;">📌 No classes ${DAY_FULL[r.day]}: ${noClassPeople.join(', ')}</div>`));
        }

        list.appendChild(row);
      });
      ftResultsEl.appendChild(list);

      // Prefer the longest slot that nobody has a long wait for; only fall
      // back to the longest slot overall if every option has a long-waiter.
      const clean = state.freeTime.results.filter(r=> !longWaitersForSlot(boardGroups, r).length);
      const pool = clean.length ? clean : state.freeTime.results;
      const best = pool.reduce((b,r)=> (r.end-r.start) > (b ? b.end-b.start : -1) ? r : b, null);
      const bestWaiters = longWaitersForSlot(boardGroups, best);
      ftResultsEl.appendChild(el(`<div style="margin-top:12px;padding:10px 14px;background:var(--gold);color:var(--gold-ink);border-radius:8px;font-family:'Poppins',sans-serif;font-weight:700;font-size:calc(13.5px * var(--font-scale));">
        🏆 Best time: ${DAY_FULL[best.day]}, ${minutesToLabel(best.start)} – ${minutesToLabel(best.end)}
        ${bestWaiters.length ? `<div style="font-weight:600;font-size:calc(12px * var(--font-scale));margin-top:4px;">⚠️ Long wait: ${bestWaiters.map(w=>w.name).join(', ')}</div>` : ''}
      </div>`));
    }
  }

  wrap.appendChild(ftPanel);
  return wrap;
}

/* ============================= BOARD (weekly grid) ============================= */
const BOARD_START = 7*60+30; // 7:30 AM — a half-row of padding above 8:00
                              // so the top hour label never collides with
                              // the day header row; that half-hour itself
                              // isn't labeled (labels stay on the :00 marks).
const BOARD_END = 21*60;    // 9:00 PM
const ROW_H = 48;           // px per 30 min

// Greedy interval-lane packing: overlapping blocks on the same day get
// assigned side-by-side lanes instead of drawing directly on top of each
// other. Mutates each block with __lane / __laneCount.
function packDayBlocks(blocks){
  const sorted = [...blocks].sort((a,b)=>a.start-b.start);
  let cluster = null;
  const clusters = [];
  for(const b of sorted){
    if(!cluster || b.start >= cluster.maxEnd){
      cluster = {items:[], laneEnds:[], maxEnd:-Infinity};
      clusters.push(cluster);
    }
    let lane = cluster.laneEnds.findIndex(end=>end<=b.start);
    if(lane===-1){ lane = cluster.laneEnds.length; cluster.laneEnds.push(b.end); }
    else cluster.laneEnds[lane] = b.end;
    b.__lane = lane;
    cluster.items.push(b);
    cluster.maxEnd = Math.max(cluster.maxEnd, b.end);
  }
  clusters.forEach(c=>{ const n=c.laneEnds.length; c.items.forEach(it=> it.__laneCount = n); });
  return sorted;
}

function renderBoard(groups, allowDelete){
  const totalRows = (BOARD_END-BOARD_START)/30;
  const board = el(`
    <div class="board">
      <div class="board-head">
        <div></div>
        ${DAY_ORDER.map(d=>`<div>${DAY_LABEL[d]}</div>`).join('')}
      </div>
      <div class="board-body" style="height:${totalRows*ROW_H}px;">
        <div class="time-col"></div>
        ${DAY_ORDER.map(()=>`<div class="day-col"></div>`).join('')}
      </div>
    </div>`);
  const body = board.querySelector('.board-body');
  const timeCol = board.querySelector('.time-col');
  // Positioned with the exact same top formula the gridlines below use
  // (r*ROW_H, same r), so a label lines up pixel-for-pixel with its actual
  // gridline instead of drifting from an independent flex-stacked layout.
  // Interval is user-adjustable (state.labelInterval, default 60min);
  // ticks always anchor to 8:00 AM regardless of interval — see
  // computeLabelStart — so changing intervals never shifts the labels.
  const labelInterval = state.labelInterval || 60;
  const firstLabelT = computeLabelStart(BOARD_START, labelInterval);
  for(let t=firstLabelT; t<BOARD_END; t+=labelInterval){
    const topPx = ((t-BOARD_START)/30)*ROW_H;
    timeCol.appendChild(el(`<div class="time-cell" style="top:${topPx}px;">${minutesToLabel(t)}</div>`));
  }
  const dayCols = [...body.querySelectorAll('.day-col')];
  dayCols.forEach(col=>{
    for(let r=0;r<totalRows;r++){
      col.appendChild(el(`<div class="gridline" style="top:${r*ROW_H}px;"></div>`));
    }
  });
  board.__dayCols = dayCols; // used by the search dropdown to draw hover previews
  board.__clearGhosts = ()=> board.querySelectorAll('.ghost-block').forEach(n=>n.remove());

  // Flatten every meeting of every entry into per-day block descriptors,
  // one entry can have several meetings (e.g. lecture MWF + lab TH).
  const perDay = DAY_ORDER.map(()=>[]);
  groups.forEach(g=>{
    g.entries.forEach(entry=>{
      const conflict = g.entries.some(other=>other!==entry && entriesConflict(entry,other));
      (entry.meetings||[]).forEach(meeting=>{
        if(meeting.start==null||meeting.end==null||!meeting.days.length) return;
        meeting.days.forEach(day=>{
          const colIdx = DAY_ORDER.indexOf(day);
          if(colIdx<0) return;
          perDay[colIdx].push({start:meeting.start, end:meeting.end, room:meeting.room, entry, group:g, conflict});
        });
      });
    });
  });

  perDay.forEach((dayBlocks, colIdx)=>{
    packDayBlocks(dayBlocks);
    dayBlocks.forEach(b=>{
      const top = ((b.start-BOARD_START)/30)*ROW_H;
      const height = Math.max(((b.end-b.start)/30)*ROW_H, 22);
      const laneCount = b.__laneCount || 1;
      const widthPct = 100/laneCount;
      const leftPct = b.__lane*widthPct;
      // Combined view (allowDelete=false) always uses each person's fixed
      // color so blocks read as "whose schedule is this" at a glance.
      // Editable views (My Schedule / editing a friend) keep the per-class
      // pastel color, since there it's only ever one person's grid anyway.
      const blockColor = allowDelete
        ? getBlockColor(b.group.member.id, b.entry.id, b.group.color)
        : b.group.color;
      const textColor = getContrastTextColor(blockColor);
      const blk = el(`
        <div class="block ${b.conflict?'conflict':''} ${allowDelete?'removable':''}"
             style="top:${top}px;height:${height}px;left:calc(${leftPct}% + 3px);width:calc(${widthPct}% - 6px);background:${blockColor};color:${textColor};"
             ${allowDelete?'title="Click to remove"':''}>
          <span class="code">${b.entry.code||'—'} ${b.entry.section||''}</span>
          <span class="title">${b.entry.title||''}</span>
          ${b.room?`<span class="room">${b.room}${b.entry.instructor?' · '+b.entry.instructor:''}</span>`:
            b.entry.instructor?`<span class="room">${b.entry.instructor}</span>`:''}
          ${allowDelete?'<button class="swatch-btn" title="Change color"></button>':''}
          ${allowDelete?'<span class="del">×</span>':''}
        </div>`);
      if(allowDelete){
        blk.onclick = async ()=>{
          const mid = b.group.member.id;
          state.schedules[mid] = (state.schedules[mid]||[]).filter(id=>id!==b.entry.id);
          await saveSchedules();
          render();
        };
        const swatchBtn = blk.querySelector('.swatch-btn');
        swatchBtn.onclick = (e)=>{
          e.stopPropagation();
          openColorPicker(swatchBtn, PASTEL_COLORS, async (color)=>{
            setBlockColor(b.group.member.id, b.entry.id, color);
            await saveBlockColors();
            render();
          }, blockColor);
        };
      }
      dayCols[colIdx].appendChild(blk);
    });
  });

  return board;
}

/* ============================= WALLPAPER / IMAGE EXPORT ============================= */
const WALLPAPER_DIMS = {
  phone:  {w:1080, h:2400, label:'Phone · 1080×2400'},
  laptop: {w:2560, h:1600, label:'Laptop · 2560×1600'},
  custom: {w:1080, h:1920, label:'Custom'}, // w/h overwritten live by the width/height inputs
};
const WALLPAPER_CUSTOM_MIN = 320, WALLPAPER_CUSTOM_MAX = 4000;
// Reference width used for "Schedule image" mode, where there's no phone/
// laptop canvas — the table just defines its own tight canvas.
const IMAGE_MODE_BASE_W = 1080;

function getCssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || null;
}

// Draws `img` into the x,y,w,h rect using cover-fit (scale to fill, crop
// overflow, centered) — same behavior as CSS background-size:cover.
function drawImageCover(ctx, img, x, y, w, h){
  const s = Math.max(w/img.width, h/img.height);
  const sw = w/s, sh = h/s;
  const sx = (img.width-sw)/2, sy = (img.height-sh)/2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function roundRectPath(ctx, x, y, w, h, r){
  const rr = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x+rr, y);
  ctx.arcTo(x+w, y, x+w, y+h, rr);
  ctx.arcTo(x+w, y+h, x, y+h, rr);
  ctx.arcTo(x, y+h, x, y, rr);
  ctx.arcTo(x, y, x+w, y, rr);
  ctx.closePath();
}

// Binary-search ellipsis truncation against actual measured text width,
// rather than guessing by character count.
function truncateText(ctx, text, maxWidth){
  if(!text) return '';
  if(ctx.measureText(text).width <= maxWidth) return text;
  let lo=0, hi=text.length;
  while(lo<hi){
    const mid = Math.ceil((lo+hi)/2);
    const candidate = text.slice(0,mid)+'…';
    if(ctx.measureText(candidate).width <= maxWidth) lo=mid; else hi=mid-1;
  }
  return lo>0 ? text.slice(0,lo)+'…' : '…';
}


// "Dela Cruz, Juan M." -> "Dela Cruz"; "Juan Dela Cruz" -> "Cruz" (last
// word) as a fallback when there's no comma. Keeps class blocks compact.
function surnameOf(instructor){
  if(!instructor) return '';
  const trimmed = instructor.trim();
  if(trimmed.includes(',')) return trimmed.split(',')[0].trim();
  const words = trimmed.split(/\s+/);
  return words[words.length-1];
}

// Auto-fits the visible hour range to this person's actual classes: padded
// by a half-hour above the first class and a full hour after the last one,
// so the top hour label has a blank half-row above it instead of colliding
// with the day header row, matching the live board. That leading half-hour
// isn't itself labeled — labels stay on the :00 marks. Clamped to sane
// bounds.
function computeWallpaperTimeRange(entries){
  let minStart=Infinity, maxEnd=-Infinity;
  entries.forEach(entry=>(entry.meetings||[]).forEach(m=>{
    if(m.start!=null) minStart = Math.min(minStart, m.start);
    if(m.end!=null) maxEnd = Math.max(maxEnd, m.end);
  }));
  if(!isFinite(minStart) || !isFinite(maxEnd)){ minStart=7*60; maxEnd=21*60; }
  let start = Math.floor(minStart/60)*60 - 30;
  let end = Math.ceil(maxEnd/60)*60 + 60;
  start = Math.max(start, 5*60);
  end = Math.min(end, 23*60);
  if(end-start < 6*60) end = Math.min(start+6*60, 23*60);
  return {start, end};
}

// Pure geometry pass — figures out every pixel size the table needs given
// a target width, a font scale, and an independent height-stretch factor
// (so the table can be pulled taller/shorter without distorting text).
// Both export modes call this first: wallpaper mode already knows its
// canvas size, but image mode needs the table's own height before it can
// size the canvas.
function computeTableLayout(groups, tableW, scale, heightScale=1){
  const allEntries = groups.flatMap(g=>g.entries);
  const {start:rangeStart, end:rangeEnd} = computeWallpaperTimeRange(allEntries);
  const totalRows = (rangeEnd-rangeStart)/30;
  const pad = 20*scale;
  const timeGutterW = 76*scale;
  const contentW = tableW - pad*2;
  const dayColW = (contentW - timeGutterW)/6;
  const headerH = 68*scale*heightScale;
  const rowH = 30*scale*heightScale;
  const bodyH = totalRows*rowH;
  // A legend strip (colored dot + name per person) only when downloading
  // more than one person's schedule at once — a single-person download
  // doesn't need one, it's obviously "yours".
  const legendH = groups.length>1 ? 30*scale : 0;
  const tableH = pad*2 + legendH + headerH + bodyH;
  return {rangeStart, rangeEnd, totalRows, pad, timeGutterW, contentW, dayColW, headerH, rowH, bodyH, legendH, tableH};
}

// Renders the schedule "card" onto the export canvas at (baseX,baseY).
// `style` picks between four visual languages — all show the same
// underlying data (code, section, time, location, professor), just
// presented differently:
//   'minimal'   — mirrors the live board's visual language (rounded
//                 pastel blocks, clean hour labels).
//   'bold'      — bigger uppercase headers on solid pills, chunkier
//                 rounded blocks.
//   'editorial' — soft rounded card, plain hour-only labels ("8a","12p").
// The table itself has no background fill — it sits directly on the
// wallpaper/background behind it, no white card.
// `groups` is an array of {member, entries}. A single group behaves exactly
// as before (per-class pastel colors, via getBlockColor). More than one
// group means this is a combined download: every block uses that person's
// FIXED color instead — same rule the on-site Combined tab already follows
// — and a small legend (dot + name per person) is drawn above the day
// header so the image is self-explanatory without the site open.
function paintTable(ctx, layout, baseX, baseY, tableW, groups, opacity, style, scale, tableColor, textScale, daysColor, timesColor, classesColor, labelInterval, tableFont){
  const {rangeStart, rangeEnd, pad, timeGutterW, contentW, dayColW, headerH, rowH, bodyH, legendH, tableH} = layout;
  const fontStack = fontStackFor(tableFont || DEFAULT_SCHEDULE_FONT);
  const isCombined = groups.length > 1;
  const gridX = baseX+pad+timeGutterW;
  const headerTopY = baseY+pad+legendH; // day header starts below the legend strip, if any
  const bodyY = headerTopY+headerH;
  const isPillHeader = style==='bold';
  // tableColor drives every non-class-block ink color (headers, divider
  // line, hour labels, bold-style pill fill) — a single user-picked color
  // instead of the fixed theme navy, so "table color" is fully custom.
  // daysColor/timesColor/classesColor are optional per-part overrides —
  // null means "derive it the usual way from tableColor/style" (below);
  // a non-null value is the user's explicit pick and wins outright.
  const inkColor = tableColor || getCssVar('--navy-text') || '#2A4492';
  const inkOnInk = getContrastTextColor(inkColor);
  const mutedColor = lightenHex(inkColor, 0.42);
  // textScale is an independent multiplier on font *sizes* only — layout
  // metrics (padding, row height, column width) stay driven by `scale`
  // alone, so cranking text size up/down doesn't resize the table shape.
  const ts = textScale || 1;

  ctx.save();
  ctx.globalAlpha = opacity;

  const defaultDaysColor = isPillHeader ? inkOnInk : inkColor;
  const defaultTimesColor = isPillHeader ? inkOnInk : mutedColor;
  const daysTextColor = daysColor || defaultDaysColor;
  const timesTextColor = timesColor || defaultTimesColor;

  if(isCombined){
    // One evenly-divided row across the full content width — a colored
    // dot plus that person's name, truncated to fit its own segment so it
    // never overflows regardless of how many people are included.
    const segW = contentW/groups.length;
    const dotR = 5*scale;
    const cy = baseY+pad+legendH/2;
    ctx.font = `600 ${10.5*ts*scale}px ${fontStack}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    groups.forEach((g,i)=>{
      const segX = baseX+pad + i*segW;
      ctx.fillStyle = g.member.color;
      ctx.beginPath(); ctx.arc(segX+dotR, cy, dotR, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = daysTextColor;
      const label = g.member.id===state.meId ? `${g.member.name} (you)` : g.member.name;
      ctx.fillText(truncateText(ctx, label, segW-dotR*2-10*scale), segX+dotR*2+6*scale, cy);
    });
  }

  if(isPillHeader){
    // Day header row: solid pill per day, uppercase label, in the user's
    // table color.
    const pillH = headerH*0.62;
    const pillY = headerTopY+(headerH-pillH)/2;
    ctx.font = `700 ${13*ts*scale}px ${fontStack}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    DAY_ORDER.forEach((day,i)=>{
      const cx0 = gridX + i*dayColW + 3*scale;
      const pw = dayColW - 6*scale;
      ctx.fillStyle = inkColor;
      roundRectPath(ctx, cx0, pillY, pw, pillH, 10*scale);
      ctx.fill();
      ctx.fillStyle = daysTextColor;
      ctx.fillText(DAY_LABEL[day].toUpperCase(), cx0+pw/2, pillY+pillH/2);
    });
  } else {
    // 'minimal' and 'editorial': plain centered label. Minimal adds a divider rule.
    ctx.font = `700 ${(style==='editorial'?15:16)*ts*scale}px ${fontStack}`;
    ctx.fillStyle = daysTextColor;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    DAY_ORDER.forEach((day,i)=>{
      const cx = gridX + i*dayColW + dayColW/2;
      ctx.fillText(DAY_LABEL[day], cx, headerTopY+headerH/2);
    });
    if(style==='minimal'){
      // Sits a little above the body, not exactly on the first hour tick —
      // otherwise the rule line runs straight through that label's text.
      const dividerY = bodyY - 7*scale;
      ctx.strokeStyle = inkColor;
      ctx.lineWidth = 2*scale;
      ctx.beginPath();
      ctx.moveTo(baseX+pad, dividerY);
      ctx.lineTo(baseX+pad+contentW, dividerY);
      ctx.stroke();
    }
  }

  // Hour labels. 'bold' gets the same solid pill treatment as the day
  // header, sized to fit each label, so they stay visible against any
  // background. 'minimal'/'editorial' stay plain text like the rest of
  // that style. Vertically centered right on the gridline it represents
  // (rather than floating above it), so it lines up with a class block
  // that starts at that exact time. Ticks always anchor to 8:00 AM
  // regardless of interval — see computeLabelStart.
  ctx.font = `${isPillHeader?'600 ':''}${11*ts*scale}px ${fontStack}`;
  const interval = labelInterval || 60;
  const firstLabelT = computeLabelStart(rangeStart, interval);
  for(let t=firstLabelT; t<=rangeEnd; t+=interval){
    const y = bodyY + ((t-rangeStart)/30)*rowH;
    const label = style==='editorial' ? abbrevHourLabel(t) : minutesToLabel(t);
    const labelX = gridX-8*scale;
    if(isPillHeader){
      const padX = 6*scale, padY = 3*scale, m = ctx.measureText(label);
      const w = m.width, asc = m.actualBoundingBoxAscent||8, desc = m.actualBoundingBoxDescent||3;
      const boxX = labelX-w-padX, boxY = y-(asc+desc)/2-padY, boxW = w+padX*2, boxH = asc+desc+padY*2;
      ctx.fillStyle = inkColor;
      roundRectPath(ctx, boxX, boxY, boxW, boxH, 5*scale);
      ctx.fill();
      ctx.fillStyle = timesTextColor;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(label, labelX, y);
    } else {
      ctx.fillStyle = timesTextColor;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(label, labelX, y);
    }
  }

  // Class blocks — same flatten + lane-pack approach as the live board,
  // now flattened across every group instead of just one person.
  const perDay = DAY_ORDER.map(()=>[]);
  groups.forEach(g=>{
    g.entries.forEach(entry=>{
      (entry.meetings||[]).forEach(m=>{
        if(m.start==null || m.end==null || !m.days.length) return;
        m.days.forEach(day=>{
          const colIdx = DAY_ORDER.indexOf(day);
          if(colIdx<0) return;
          perDay[colIdx].push({start:m.start, end:m.end, room:m.room, entry, groupMember:g.member});
        });
      });
    });
  });

  perDay.forEach((dayBlocks, colIdx)=>{
    packDayBlocks(dayBlocks);
    dayBlocks.forEach(b=>{
      const s = Math.max(b.start, rangeStart), e = Math.min(b.end, rangeEnd);
      if(e<=s) return;
      const y = bodyY + ((s-rangeStart)/30)*rowH;
      const h = Math.max(((e-s)/30)*rowH, 20*scale);
      const laneCount = b.__laneCount || 1;
      const colX = gridX + colIdx*dayColW;
      const blockW = dayColW/laneCount;
      const gap = (isPillHeader?4:2.5)*scale;
      const x = colX + b.__lane*blockW + gap/2;
      const w = blockW - gap;
      const yy = y+gap/2, hh = h-gap;

      // Combined downloads use each person's fixed color (matching the
      // on-site Combined tab exactly); a single-person download keeps the
      // per-class pastel override.
      const color = isCombined ? b.groupMember.color : getBlockColor(b.groupMember.id, b.entry.id, b.groupMember.color);
      const textColor = classesColor || getContrastTextColor(color);
      const surname = surnameOf(b.entry.instructor);

      ctx.fillStyle = color;
      roundRectPath(ctx, x, yy, w, hh, (isPillHeader?12:7)*scale);
      ctx.fill();

      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      const padX = (isPillHeader?9:7)*scale;
      const tx = x+padX, maxTextW = Math.max(w-padX*2, 4);
      let ty = yy+(isPillHeader?8:6)*scale;
      const lineH = (isPillHeader?13.5:12.5)*ts*scale;

      // Four separate lines, space permitting: code+section, time, location,
      // professor — same fields as the live board, one per line.
      ctx.fillStyle = textColor;
      ctx.font = `700 ${(isPillHeader?12.5:11.5)*ts*scale}px ${fontStack}`;
      ctx.fillText(truncateText(ctx, `${b.entry.code||'—'} ${b.entry.section||''}`.trim(), maxTextW), tx, ty);
      ty += (isPillHeader?16:14.5)*ts*scale;

      ctx.font = `${(isPillHeader?10.5:9.5)*ts*scale}px ${fontStack}`;
      ctx.globalAlpha = opacity*(isPillHeader?0.9:0.85);
      const timeLine = `${minutesToLabel(b.start)} – ${minutesToLabel(b.end)}`;
      if(hh > lineH*1.6){ ctx.fillText(truncateText(ctx, timeLine, maxTextW), tx, ty); ty += lineH; }

      if(b.room && hh > lineH*2.5){
        ctx.fillText(truncateText(ctx, b.room, maxTextW), tx, ty); ty += lineH;
      }
      if(surname && hh > lineH*3.4){
        ctx.fillText(truncateText(ctx, surname, maxTextW), tx, ty);
      }
      ctx.globalAlpha = opacity;
    });
  });

  ctx.restore();
}

// `groups` is an array of {member, entries}. Pass a single-item array for
// a personal download (behaves exactly as before), or several for a
// combined download — paintTable and the layout math both key off
// groups.length to switch between per-class and per-person coloring.
function openWallpaperBuilder(groups){

  let tableColor = '#2A4492'; // header/divider/hour-label ink color, user-customizable
  let tableFont = state.scheduleFont || DEFAULT_SCHEDULE_FONT; // font used for every label on the exported table
  let daysColor = null;     // per-part text color overrides — null = derive from tableColor/style
  let timesColor = null;
  let classesColor = null;  // null = auto per-block contrast against each class's own color

  const backdrop = el(`

            <input type="color" id="timesColorInput" value="#2A4492" style="position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;top:0;left:0;border:none;padding:0;" />

          <button class="ghost small" id="timesColorReset">Auto</button>

          <label class="swatch-dot" title="Classes font color" style="width:18px;height:18px;background:conic-gradient(#FADADD,#FFE5B4,#FFFACD,#D9F2D9,#D6EAF8,#E0D6F5,#FADADD);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;position:relative;">

        <p class="hint" id="dragHint" style="margin:12px 0 6px;">Drag the schedule below to reposition it on the wallpaper.</p>
        <div style="display:flex;justify-content:center;background:rgba(0,0,0,0.06);border-radius:10px;padding:10px;">
          <canvas id="wpCanvas" style="max-width:100%;max-height:58vh;border-radius:6px;cursor:grab;touch-action:none;"></canvas>
        </div>

        <p class="hint" id="wpColorListLabel" style="margin:14px 0 6px;">Class colors</p>

  document.body.appendChild(backdrop);

  const canvas = backdrop.querySelector('#wpCanvas');
  const ctx = canvas.getContext('2d');
  const deviceRow = backdrop.querySelector('#deviceRow');
  const bgRow = backdrop.querySelector('#bgRow');
  const opacityRow = backdrop.querySelector('#opacityRow');
  const dragHint = backdrop.querySelector('#dragHint');
  const wpTitle = backdrop.querySelector('#wpTitle');
  const downloadBtn = backdrop.querySelector('#wpDownload');
  const resetBtn = backdrop.querySelector('#wpReset');

  function paintCanvasBackground(w, h){
    if(bgImage){
      drawImageCover(ctx, bgImage, 0, 0, w, h);
    } else if(bgGradient){
      // Gradient runs from the exact chosen color to a mild variant of
      // the SAME color (darker if it's light, lighter if it's dark) —
      // enough to read as a gradient without washing the color out.
      const isLight = getContrastTextColor(bgHex) === '#1C2430';
      const grad = ctx.createLinearGradient(0,0,w,h);
      grad.addColorStop(0, bgHex);
      grad.addColorStop(1, isLight ? darkenHex(bgHex,0.22) : lightenHex(bgHex,0.22));
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,h);
    } else {
      // Exact chosen color/shade, no forced lightening — a user who
      // picks a deep navy or a bright red gets that color as-is.
      ctx.fillStyle = bgHex;
      ctx.fillRect(0,0,w,h);
    }
  }

  function draw(){
    const wScale = sizeWPct/100, hScale = sizeHPct/100;
    if(mode==='wallpaper'){
      const d = WALLPAPER_DIMS[device];
      canvas.width = d.w; canvas.height = d.h;
      ctx.clearRect(0,0,d.w,d.h);
      paintCanvasBackground(d.w, d.h);
      // Font/padding scale tracks canvas resolution only, independent of the
      // width/height stretch sliders — so stretching resizes the table's
      // shape without warping its text.
      const fontScale = Math.hypot(d.w, d.h) / Math.hypot(1080, 1920);
      const tableW = d.w*0.88*wScale;
      const layout = computeTableLayout(groups, tableW, fontScale, hScale);
      const baseX = (d.w-tableW)/2 + offsetX;
      const baseY = (d.h-layout.tableH)/2 + offsetY;
      paintTable(ctx, layout, baseX, baseY, tableW, groups, opacity, style, fontScale, tableColor, textScale, daysColor, timesColor, classesColor, labelInterval, tableFont);
    } else {
      // Image mode: canvas is sized to exactly fit the table — no device
      // frame, no drag. Background color/gradient/photo is still
      // user-choosable (bgRow), it just always fills edge-to-edge since
      // there's no larger frame to reposition it within. Width/height
      // stretch sliders control the table's shape; text stays a fixed,
      // crisp size.
      const fontScale = 1;
      const margin = 24;
      const tableW = IMAGE_MODE_BASE_W*0.88*wScale;
      const layout = computeTableLayout(groups, tableW, fontScale, hScale);
      canvas.width = tableW + margin*2;
      canvas.height = layout.tableH + margin*2;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      paintCanvasBackground(canvas.width, canvas.height);
      paintTable(ctx, layout, margin, margin, tableW, groups, opacity, style, fontScale, tableColor, textScale, daysColor, timesColor, classesColor, labelInterval, tableFont);
    }
  }

  // Mode toggle — wallpaper (device frame + background + position) vs a
  // plain schedule image sized to fit the table itself.
  const modeWallpaperBtn = backdrop.querySelector('#modeWallpaper');
  const modeImageBtn = backdrop.querySelector('#modeImage');
  function setMode(m){
    mode = m;

    resetBtn.style.display = isWallpaper ? 'inline-flex' : 'none';
    canvas.style.cursor = isWallpaper ? 'grab' : 'default';
    wpTitle.textContent = isWallpaper ? 'Make a wallpaper' : 'Save schedule as image';
    downloadBtn.textContent = 'Download';
    offsetX = 0; offsetY = 0;
    draw();
  }
  modeWallpaperBtn.onclick = ()=> setMode('wallpaper');
  modeImageBtn.onclick = ()=> setMode('image');

  // Device toggle — phone / laptop presets, or a free-form custom size the
  // user can stretch to whatever dimensions they want.
  const devPhoneBtn = backdrop.querySelector('#devPhone');
  const devLaptopBtn = backdrop.querySelector('#devLaptop');
  const devCustomBtn = backdrop.querySelector('#devCustom');
  const customSizeRow = backdrop.querySelector('#customSizeRow');
  const customWInput = backdrop.querySelector('#customW');
  const customHInput = backdrop.querySelector('#customH');
  function setDevice(d){
    device = d;
    devPhoneBtn.classList.toggle('active', d==='phone');
    devLaptopBtn.classList.toggle('active', d==='laptop');
    devCustomBtn.classList.toggle('active', d==='custom');
    customSizeRow.style.display = d==='custom' ? 'flex' : 'none';
    offsetX = 0; offsetY = 0; // dimensions differ a lot between devices — start centered again
    draw();
  }
  devPhoneBtn.onclick = ()=> setDevice('phone');
  devLaptopBtn.onclick = ()=> setDevice('laptop');
  devCustomBtn.onclick = ()=> setDevice('custom');

  function applyCustomSize(){
    const w = Math.min(WALLPAPER_CUSTOM_MAX, Math.max(WALLPAPER_CUSTOM_MIN, parseInt(customWInput.value,10) || WALLPAPER_DIMS.custom.w));
    const h = Math.min(WALLPAPER_CUSTOM_MAX, Math.max(WALLPAPER_CUSTOM_MIN, parseInt(customHInput.value,10) || WALLPAPER_DIMS.custom.h));
    WALLPAPER_DIMS.custom.w = w; WALLPAPER_DIMS.custom.h = h;
    customWInput.value = w; customHInput.value = h;
    if(device==='custom') draw();
  }
  customWInput.addEventListener('change', applyCustomSize);
  customHInput.addEventListener('change', applyCustomSize);

  // Style toggle
  const styleMinimalBtn = backdrop.querySelector('#styleMinimal');
  const styleBoldBtn = backdrop.querySelector('#styleBold');
  const styleEditorialBtn = backdrop.querySelector('#styleEditorial');
  const styleBtns = {minimal:styleMinimalBtn, bold:styleBoldBtn, editorial:styleEditorialBtn};
  function setStyle(s){
    style = s;
    Object.entries(styleBtns).forEach(([key,btn])=> btn.classList.toggle('active', key===s));
    draw();
  }
  styleMinimalBtn.onclick = ()=> setStyle('minimal');
  styleBoldBtn.onclick = ()=> setStyle('bold');
  styleEditorialBtn.onclick = ()=> setStyle('editorial');

  // Background source — a color/gradient (from a preset swatch or the
  // custom color wheel) or an uploaded photo. White is the default; the
  // old theme-tinted look lives on as the "Pastel Yellow" preset.
  let bgHex = '#FFFFFF', bgGradient = false;
  const bgSwatches = backdrop.querySelector('#bgSwatches');
  const bgGradToggle = backdrop.querySelector('#bgGradToggle');
  const bgCustomInput = backdrop.querySelector('#bgCustomInput');
  const bgUploadBtn = backdrop.querySelector('#bgUploadBtn');
  const bgInput = backdrop.querySelector('#bgUploadInput');
  const tableColorInput = backdrop.querySelector('#tableColorInput');
  const tableFontBtn = backdrop.querySelector('#tableFontBtn');
  tableFontBtn.onclick = (e)=>{
    e.stopPropagation();
    openFontPickerModal('Table font', tableFont, (name)=>{
      tableFont = name;
      tableFontBtn.textContent = tableFont;
      tableFontBtn.style.fontFamily = fontStackFor(tableFont);
      persistBgPref();
      draw();
    });
  };
  const daysColorInput = backdrop.querySelector('#daysColorInput');
  const timesColorInput = backdrop.querySelector('#timesColorInput');
  const classesColorInput = backdrop.querySelector('#classesColorInput');
  const intervalSelect = backdrop.querySelector('#intervalSelect');
  intervalSelect.value = String(labelInterval);
  intervalSelect.onchange = ()=>{
    labelInterval = Number(intervalSelect.value);
    draw();
  };
  const WALLPAPER_BG_PRESETS = [{name:'White', hex:'#FFFFFF'}, ...THEME_PRESETS];

  function persistBgPref(){ queueSave(()=> sSet('wallpaperBg', {hex:bgHex, gradient:bgGradient, tableColor, daysColor, timesColor, classesColor, tableFont}, false)); }
  function renderBgSwatches(){
    bgSwatches.innerHTML = '';
    WALLPAPER_BG_PRESETS.forEach(p=>{
      const pastel = lightenHex(p.hex, 0.92);
      const active = !bgImage && bgHex===pastel;
      const dot = el(`<button class="swatch-dot" title="${p.name}" style="width:20px;height:20px;background:${pastel};${active?'outline:2px solid var(--navy-text);outline-offset:1px;':''}"></button>`);
      dot.onclick = ()=>{
        bgHex = pastel;
        if(bgObjectUrl){ URL.revokeObjectURL(bgObjectUrl); bgObjectUrl=null; }
        bgImage = null;
        bgUploadBtn.classList.remove('active');
        persistBgPref();
        renderBgSwatches();
        draw();
      };
      bgSwatches.appendChild(dot);
    });
  }
  (async ()=>{
    const saved = await sGet('wallpaperBg', false);
    if(saved && /^#[0-9A-Fa-f]{6}$/.test(saved.hex)){
      bgHex = saved.hex;
      bgGradient = !!saved.gradient;
      bgGradToggle.checked = bgGradient;
      bgCustomInput.value = bgHex;
      if(saved.tableColor && /^#[0-9A-Fa-f]{6}$/.test(saved.tableColor)){
        tableColor = saved.tableColor;
        tableColorInput.value = tableColor;
      }
      if(saved.daysColor && /^#[0-9A-Fa-f]{6}$/.test(saved.daysColor)){ daysColor = saved.daysColor; daysColorInput.value = daysColor; }
      if(saved.timesColor && /^#[0-9A-Fa-f]{6}$/.test(saved.timesColor)){ timesColor = saved.timesColor; timesColorInput.value = timesColor; }
      if(saved.classesColor && /^#[0-9A-Fa-f]{6}$/.test(saved.classesColor)){ classesColor = saved.classesColor; classesColorInput.value = classesColor; }
      if(saved.tableFont && isKnownFontName(saved.tableFont)){
        tableFont = saved.tableFont;
        tableFontBtn.textContent = tableFont;
        tableFontBtn.style.fontFamily = fontStackFor(tableFont);
      }
      renderBgSwatches();
      draw();
    }
  })();
  bgGradToggle.onchange = ()=>{
    bgGradient = bgGradToggle.checked;
    persistBgPref();
    draw();
  };
  bgCustomInput.onchange = ()=>{
    bgHex = bgCustomInput.value;
    if(bgObjectUrl){ URL.revokeObjectURL(bgObjectUrl); bgObjectUrl=null; }
    bgImage = null;
    bgUploadBtn.classList.remove('active');
    persistBgPref();
    renderBgSwatches();
    draw();
  };
  bgUploadBtn.onclick = ()=> bgInput.click();
  bgInput.onchange = ()=>{
    const file = bgInput.files[0];
    if(!file) return;
    if(bgObjectUrl) URL.revokeObjectURL(bgObjectUrl);
    bgObjectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      bgImage = img;
      bgUploadBtn.classList.add('active');
      renderBgSwatches();
      draw();
    };
    img.src = bgObjectUrl;
  };
  renderBgSwatches();

  tableColorInput.onchange = ()=>{
    tableColor = tableColorInput.value;
    persistBgPref();
    draw();
  };

  daysColorInput.onchange = ()=>{ daysColor = daysColorInput.value; persistBgPref(); draw(); };
  timesColorInput.onchange = ()=>{ timesColor = timesColorInput.value; persistBgPref(); draw(); };
  classesColorInput.onchange = ()=>{ classesColor = classesColorInput.value; persistBgPref(); draw(); };
  backdrop.querySelector('#daysColorReset').onclick = ()=>{ daysColor = null; daysColorInput.value = tableColor; persistBgPref(); draw(); };
  backdrop.querySelector('#timesColorReset').onclick = ()=>{ timesColor = null; timesColorInput.value = tableColor; persistBgPref(); draw(); };
  backdrop.querySelector('#classesColorReset').onclick = ()=>{ classesColor = null; classesColorInput.value = tableColor; persistBgPref(); draw(); };

  // Samples the current background down to a small offscreen canvas and
  // averages its pixels — works the same way for a photo, a solid color,
  // or a gradient (drawn exactly as it renders on the wallpaper), so the
  // suggestion always reflects what's actually behind the table.
  function sampleBackgroundAverage(){
    const sw = 24, sh = 24;
    const c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    const sctx = c.getContext('2d');
    if(bgImage){
      drawImageCover(sctx, bgImage, 0, 0, sw, sh);
    } else if(bgGradient){
      const isLight = getContrastTextColor(bgHex) === '#1C2430';
      const grad = sctx.createLinearGradient(0,0,sw,sh);
      grad.addColorStop(0, bgHex);
      grad.addColorStop(1, isLight ? darkenHex(bgHex,0.22) : lightenHex(bgHex,0.22));
      sctx.fillStyle = grad; sctx.fillRect(0,0,sw,sh);
    } else {
      sctx.fillStyle = bgHex; sctx.fillRect(0,0,sw,sh);
    }
    let r=0,g=0,b=0,n=0;
    try{
      const data = sctx.getImageData(0,0,sw,sh).data;
      for(let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
    }catch(e){
      // Cross-origin image data can throw — fall back to the flat bgHex.
      return hexToRgb(bgHex);
    }
    return { r: Math.round(r/n), g: Math.round(g/n), b: Math.round(b/n) };
  }

  backdrop.querySelector('#suggestColorsBtn').onclick = ()=>{
    const avg = sampleBackgroundAverage();
    const avgHex = rgbToHex(avg.r, avg.g, avg.b);
    const bgIsLight = getContrastTextColor(avgHex) === '#1C2430';
    // A deep ink on light backgrounds, a soft cream on dark ones — reads
    // as an intentional color choice rather than flat black/white.
    tableColor = bgIsLight ? '#22304F' : '#F4F1E8';
    daysColor = null; timesColor = null; classesColor = null;
    tableColorInput.value = tableColor;
    daysColorInput.value = tableColor;
    timesColorInput.value = tableColor;
    classesColorInput.value = tableColor;
    persistBgPref();
    draw();
    showToast('Suggested colors applied for this background.');
  };

  // Translucency
  const opacitySlider = backdrop.querySelector('#opacitySlider');
  const opacityVal = backdrop.querySelector('#opacityVal');
  opacitySlider.oninput = ()=>{
    opacity = Number(opacitySlider.value)/100;
    opacityVal.textContent = opacitySlider.value+'%';
    draw();
  };

  // Table width/height stretch — independent sliders
  const sizeWSlider = backdrop.querySelector('#sizeWSlider');
  const sizeWVal = backdrop.querySelector('#sizeWVal');
  sizeWSlider.oninput = ()=>{
    sizeWPct = Number(sizeWSlider.value);
    sizeWVal.textContent = sizeWPct+'%';
    draw();
  };
  const sizeHSlider = backdrop.querySelector('#sizeHSlider');
  const sizeHVal = backdrop.querySelector('#sizeHVal');
  sizeHSlider.oninput = ()=>{
    sizeHPct = Number(sizeHSlider.value);
    sizeHVal.textContent = sizeHPct+'%';
    draw();
  };

  // Font size — independent of the width/height stretch sliders above, so
  // text can be made bigger/smaller without changing the table's shape.
  const textSizeSlider = backdrop.querySelector('#textSizeSlider');
  const textSizeVal = backdrop.querySelector('#textSizeVal');
  textSizeSlider.oninput = ()=>{
    textScale = Number(textSizeSlider.value)/100;
    textSizeVal.textContent = textSizeSlider.value+'%';
    draw();
  };

  // Drag to reposition (wallpaper mode only) — convert on-screen pixel
  // movement to canvas-internal pixels, since the canvas is displayed
  // smaller than its true export size.
  let dragging=false, lastX=0, lastY=0;
  canvas.addEventListener('pointerdown', e=>{
    if(mode!=='wallpaper') return;
    dragging = true; lastX=e.clientX; lastY=e.clientY;
    canvas.style.cursor='grabbing';
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const f = canvas.width/canvas.clientWidth;
    offsetX += (e.clientX-lastX)*f;
    offsetY += (e.clientY-lastY)*f;
    lastX=e.clientX; lastY=e.clientY;
    draw();
  });
  const stopDrag = ()=>{ dragging=false; if(mode==='wallpaper') canvas.style.cursor='grab'; };
  canvas.addEventListener('pointerup', stopDrag);
  canvas.addEventListener('pointercancel', stopDrag);

  resetBtn.onclick = ()=>{ offsetX=0; offsetY=0; draw(); };

  // Per-class color editing (personal) writes through the same shared
  // blockColors store the live grid uses. Combined mode instead lists each
  // person with their fixed color — editing it here writes to the same
  // member.color the on-site Combined tab uses, so it stays one source of
  // truth either way.
  function renderColorList(){
    const listEl = backdrop.querySelector('#wpColorList');
    const labelEl = backdrop.querySelector('#wpColorListLabel');
    listEl.innerHTML = '';
    if(isCombined){
      labelEl.textContent = 'People';
      groups.forEach(g=>{
        const chip = el(`<div class="chip" style="cursor:default;">
          <button class="chip-dot" style="background:${g.member.color};" title="Change ${g.member.name}'s color"></button>
          <span>${g.member.name}${g.member.id===state.meId?' (you)':''}</span>
        </div>`);
        const dotBtn = chip.querySelector('.chip-dot');
        dotBtn.onclick = (e)=>{
          e.stopPropagation();
          openColorPicker(dotBtn, MEMBER_COLORS, async (newColor)=>{
            g.member.color = newColor;
            await saveMembers();
            dotBtn.style.background = newColor;
            draw();
          }, g.member.color);
        };
        listEl.appendChild(chip);
      });
      return;
    }
    labelEl.textContent = 'Class colors';
    const {member, entries} = groups[0];
    if(!entries.length){
      listEl.appendChild(el(`<span class="hint" style="margin:0;">No classes yet — add some in My Schedule first.</span>`));
      return;
    }
    entries.forEach(entry=>{
      const color = getBlockColor(member.id, entry.id, member?member.color:'#4169E1');
      const chip = el(`<div class="chip" style="cursor:default;">
        <button class="chip-dot" style="background:${color};" title="Change color"></button>
        <span>${entry.code||'—'} ${entry.section||''}</span>
      </div>`);
      const dotBtn = chip.querySelector('.chip-dot');
      dotBtn.onclick = (e)=>{
        e.stopPropagation();
        openColorPicker(dotBtn, PASTEL_COLORS, async (newColor)=>{
          setBlockColor(member.id, entry.id, newColor);
          await saveBlockColors();
          dotBtn.style.background = newColor;
          draw();
        }, color);
      };
      listEl.appendChild(chip);
    });
  }

  function closeModal(){
    if(bgObjectUrl) URL.revokeObjectURL(bgObjectUrl);
    backdrop.remove();
    render(); // refresh the main grid in case any class colors were changed here
  }
  backdrop.querySelector('#wpClose').onclick = closeModal;

  downloadBtn.onclick = async ()=>{
    try{ await document.fonts.ready; }catch(e){}
    draw();
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = mode==='wallpaper'
        ? `${isCombined?'combined-':''}schedule-wallpaper-${device}.png`
        : `${isCombined?'combined-':''}schedule-image.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  };

  renderColorList();
  draw();
}

if(__auth){
  __auth.onAuthStateChanged(()=> boot());
} else {
  boot();
}
</script>
</body>
</html>
